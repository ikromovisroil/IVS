# IVS: nginx — Django (daphne) oldidagi teskari proksi. HTTPS (TLS) odatda tashqarida: server nginx'i, Cloudflare yoki
# yuk balanslagich; ular X-Forwarded-Proto: https yuboradi. To'g'ridan-to'g'ri HTTP bo'lsa .env da HTTPS_ONLY=0 qiling.

# Tashqi proksi X-Forwarded-Proto yuborgan bo'lsa shuni uzatamiz. Sarlavha bo'lmasa "https" deb hisoblaymiz:
# productionda HTTPS tashqi serverda tugaydi, aks holda Django cheksiz https ga yo'naltirib yuboradi.
# (Faqat HTTP orqali sinash uchun .env da HTTPS_ONLY=0 qiling.)
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      https;
}

# WebSocket (chat) uchun
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 50m;       # hujjat va chat fayllari (Django: DATA_UPLOAD_MAX_MEMORY_SIZE = 10 MB, PDF ilovalar)

    # Yuklangan fayllar (hujjat PDF, rasmlar): to'g'ridan-to'g'ri volume'dan
    location /media/ {
        alias /srv/media/;
        add_header X-Content-Type-Options nosniff always;
        expires 7d;
        access_log off;
    }

    # Chat WebSocket
    location /ws/ {
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 120s;      # katta hisobotlar va PDF yaratish
    }
}
