<!DOCTYPE html>
{% load static %}
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IVS | Tizimga kirish</title>

  <link href="{% static 'img/favicon.png' %}" rel="icon">
  <link href="{% static 'img/apple-touch-icon.png' %}" rel="apple-touch-icon">

  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;}
    body{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background: radial-gradient(1200px 500px at 50% 10%, rgba(255,255,255,0.08), transparent 60%),
                  linear-gradient(135deg,#0e1f24,#203a43 45%,#2c5364);
      padding:24px;
    }

    .card{
      width:min(1100px, 96vw);
      height:560px;
      display:grid;
      grid-template-columns: 1fr 1.1fr;
      border-radius:24px;
      overflow:hidden;
      box-shadow: 0 25px 80px rgba(0,0,0,.45);
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255,255,255,0.10);
    }

    /* LEFT */
    .left{
      background: rgba(14,31,36,0.55);
      padding:64px 64px;
      display:flex;
      flex-direction:column;
      justify-content:center;
      gap:26px;
    }
    .title{
      color:#fff;
      font-size:44px;
      line-height:1.05;
      letter-spacing:-0.5px;
      font-weight:700;
    }
    .subtitle{
      color:rgba(255,255,255,0.70);
      font-size:16px;
      line-height:1.5;
      max-width:420px;
    }

    .btn{
      width: 420px;
      max-width: 100%;
      display:flex;
      align-items:center;
      gap:12px;
      padding:16px 18px;
      border-radius:999px;
      background:#fff;
      color:#1c3c47;
      text-decoration:none;
      font-weight:700;
      box-shadow: 0 12px 30px rgba(0,0,0,.28);
      transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
    }
    .btn:hover{
      transform: translateY(-2px);
      box-shadow: 0 18px 36px rgba(0,0,0,.35);
      background:#f4f7f9;
    }
    .btn .icon{
      width:40px;height:40px;border-radius:12px;
      display:grid;place-items:center;
      background: rgba(44,83,100,0.10);
      font-size:18px;
    }
    .btn .text{
      display:flex;
      flex-direction:column;
      line-height:1.1;
    }
    .btn .text small{
      font-weight:600;
      opacity:.75;
      margin-top:3px;
    }

    /* RIGHT */
    .right{
      background: #ffffff;
      padding:64px 64px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      gap:18px;
      position:relative;
    }

    /* LOGO oq bo‘lsa ham ko‘rinsin */
    .logo-box{
      background: #2c5364;           /* ✅ oq PNG ko‘rinadigan fon */
      padding: 22px 26px;
      border-radius: 18px;
      box-shadow: 0 12px 30px rgba(0,0,0,.18);
      display:inline-flex;
      align-items:center;
      justify-content:center;
      margin-bottom: 6px;
    }
    .right img{
      width:350px;
      height:auto;
      display:block;
      /* istasangiz qo‘shimcha:
      filter: drop-shadow(0 6px 12px rgba(0,0,0,0.15));
      */
    }

    .right h3{
      color:#203a43;
      font-size:22px;
      font-weight:800;
      line-height:1.35;
      max-width: 520px;
    }

    .contact{
      margin-top:14px;
      color:#6b7280;
      font-size:15px;
    }
    .contact strong{color:#374151;}

    /* footer tiny */
    .hint{
      position:absolute;
      bottom:18px;
      left:0; right:0;
      text-align:center;
      font-size:12px;
      color:#9aa3ad;
    }

    /* RESPONSIVE */
    @media (max-width: 980px){
      .card{
        height:auto;
        grid-template-columns: 1fr;
      }
      .left,.right{padding:44px 26px;}
      .title{font-size:36px;}
    }
  </style>
</head>

<body>

  <div class="card">

    <!-- LEFT -->
    <div class="left">
      <div>
        <div class="title">Tizimga kirish</div>
        <div class="subtitle">
          Xavfsiz kirish uchun SSO orqali autentifikatsiya ishlatiladi.
        </div>
      </div>

      <a class="btn" href="{% url 'sso_start_login' %}">
        <div class="icon">🔐</div>
        <h1 class="text">
          Tizimga kirish
        </h1>
      </a>
    </div>

    <!-- RIGHT -->
    <div class="right">
      <div class="logo-box">
        <img src="{% static 'img/logo_ivs.png' %}" alt="IVS logo">
      </div>

      <h3>Texnik va tarmoq xizmatlarini qo‘llab-quvvatlash platformasi</h3>

      <div class="contact">
        Murojaat uchun: <strong>71-203-50-50 (01755)</strong>
      </div>

      <div class="hint">© REPORT.IMV.UZ</div>
    </div>

  </div>

</body>
</html>
