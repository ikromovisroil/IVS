<!doctype html>
<html>
<head><meta charset="utf-8"><title>SSO callback</title></head>
<body>
<script>
const qs       = new URLSearchParams(location.search);
const code     = qs.get("code");
const err      = qs.get("error");

function showError(text) {
    alert(text);
    window.location.href = "/sso/login/";
}

if (err || !code) {
    showError("SSO xatolik: " + (err || "code kelmadi"));
} else {
    const verifier = sessionStorage.getItem("pkce_verifier");
    if (!verifier) {
        showError("PKCE verifier topilmadi. Qaytadan urinib ko'ring.");
    } else {
        fetch("/sso/exchange/", {
            method:      "POST",
            credentials: "same-origin",
            headers:     {"Content-Type": "application/json"},
            body: JSON.stringify({
                code:         code,
                codeVerifier: verifier,
                redirectUri:  "{{ redirect_uri }}"
            })
        })
        .then(r => r.json().then(j => ({ok: r.ok, data: j})))
        .then(({ok, data}) => {
            sessionStorage.removeItem("pkce_verifier");
            if (ok && data.status === "ok") {
                window.location.href = data.redirect;
            } else {
                showError(data.message || "SSO xatolik");
            }
        })
        .catch(() => {
            showError("Tarmoq xatoligi. Qaytadan urinib ko'ring.");
        });
    }
}
</script>
</body>
</html>
