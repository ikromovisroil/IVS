{% extends 'base.html' %}
{% load static %}

{% block title %}
    <title>Hisobot</title>
{% endblock title %}

{% block css %}
{% endblock css %}

{% block content %}

 <main id="main" class="main">

    <div class="pagetitle">
      <h1>Akt</h1>
    </div><!-- End Page Title -->

    <section class="section">
      <div class="row">
        <div class="col-lg-4">

          <div class="card">
            <div class="card-body">
              <h5 class="card-title">Vertical Form</h5>

              <!-- Vertical Form -->
              <form class="row g-3" action="{% url 'akt_post' %}" method="post" data-download="true">{% csrf_token %}
                <div class="col-12">
                  <label for="organization" class="form-label">Tashkilot :</label>
                    <select id="organization" name="organization" class="form-select" required>
                        <option value="">Tanlang...</option>
                        {% for org in organizations %}
                            <option value="{{ org.id }}" {% if selected_org == org.id|stringformat:"s" %}selected{% endif %}>{{ org.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-12">
                  <label for="department" class="form-label">Departament :</label>
                    <select id="department" name="department" class="form-select" required>
                        <option value="">Tanlang...</option>
                        {% for dep in departments %}
                            <option value="{{ dep.id }}" {% if selected_dep == dep.id|stringformat:"s" %}selected{% endif %}>{{ dep.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-12">
                  <label for="employee" class="form-label">Xodim :</label>
                    <select id="employee" name="employee" class="form-select" required>
                        <option value="">Tanlang...</option>
                        {% for emp in employees %}
                            <option value="{{ emp.id }}">{{ emp.full_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-12">
                  <label for="date1" class="col-sm-2 col-form-label">Sana :</label>
                  <input type="date" name="date1" id="date1" required class="form-control">
                </div>
                <div class="col-md-12">
                  <input type="date" name="date2" id="date2" required class="form-control">
                </div>
                <div class="text-center">
                  <button type="submit" class="btn btn-primary w-100">Qidirish</button>
                </div>
              </form><!-- Vertical Form -->

            </div>
          </div>

        </div>

        <div class="col-lg-8">
            <div class="card">
                <div class="card-body m-5">
                    <div class="d-flex justify-content-center align-items-center mb-3">
                        <h5 class="text-center"><b>AKT</b></h5>
                    </div>
                </div>
            </div>
        </div>
      </div>
    </section>

  </main><!-- End #main -->

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
$(function () {

  function initSelect2() {
    // dropdownParent: agar modal bo‘lsa kerak bo‘ladi. Hozir oddiy sahifa — baribir zarar qilmaydi.
    $('#organization, #department, #employee').select2({
      width: '100%',
      placeholder: 'Tanlang...',
      allowClear: true
    });
  }

  initSelect2();

  function loadDepartments(orgId, selectedDepId=null) {
    // select2 bo‘lsa ham oddiy option qo‘yamiz
    $('#department').html('<option value="">Yuklanmoqda...</option>').trigger('change.select2');
    $('#employee').html('<option value="">Tanlang...</option>').trigger('change.select2');

    if (!orgId) {
      $('#department').html('<option value="">Tanlang...</option>').trigger('change.select2');
      return;
    }

    $.ajax({
      url: "{% url 'ajax_load_departments' %}",
      data: { organization: orgId },
      success: function (data) {
        let options = '<option value=""></option>'; // select2 placeholder uchun bo‘sh option
        data.forEach(function(dep){
          const selected = (String(selectedDepId) === String(dep.id)) ? 'selected' : '';
          options += `<option value="${dep.id}" ${selected}>${dep.name}</option>`;
        });
        $('#department').html(options).trigger('change.select2');
      }
    });
  }

  function loadEmployees(depId, selectedEmpId=null) {
    $('#employee').html('<option value="">Yuklanmoqda...</option>').trigger('change.select2');

    if (!depId) {
      $('#employee').html('<option value="">Tanlang...</option>').trigger('change.select2');
      return;
    }

    $.ajax({
      url: "{% url 'ajax_load_employees' %}",
      data: { department: depId },
      success: function (data) {
        let options = '<option value=""></option>';
        data.forEach(function(emp){
          const selected = (String(selectedEmpId) === String(emp.id)) ? 'selected' : '';
          options += `<option value="${emp.id}" ${selected}>${emp.full_name}</option>`;
        });
        $('#employee').html(options).trigger('change.select2');
      }
    });
  }

  // EVENTS
  $('#organization').on('change', function(){
    loadDepartments($(this).val());
  });

  $('#department').on('change', function(){
    loadEmployees($(this).val());
  });

  // OLDINGI TANLANGANLARNI QAYTA TIKLASH
  const initialOrg = '{{ selected_org|default:"" }}';
  const initialDep = '{{ selected_dep|default:"" }}';
  const initialEmp = '{{ selected_emp|default:"" }}';

  if (initialOrg) {
    $('#organization').val(initialOrg).trigger('change.select2');
    loadDepartments(initialOrg, initialDep);

    if (initialDep) {
      // departments ajaxdan kelishini kutib, keyin employees
      setTimeout(function(){
        $('#department').val(initialDep).trigger('change.select2');
        loadEmployees(initialDep, initialEmp);
      }, 250);
    }
  }

});
</script>

{% endblock content %}

{% block js %}
{% endblock js %}
