{% extends 'base.html' %}
{% load static %}

{% block title %}
  <title>Hisobot</title>
{% endblock title %}

{% block css %}
  <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
{% endblock css %}

{% block content %}

<main id="main" class="main">

  <div class="pagetitle">
    <h1>Akt</h1>
  </div>

  <section class="section">
    <form class="row" action="{% url 'akt_post' %}" method="post">{% csrf_token %}

      <!-- LEFT: FILTER + SIGN -->
      <div class="col-lg-4">

          <div class="card">
            <div class="card-body">
              <h5 class="card-title">Filtrlash</h5>

              <div class="row g-3">
                <div class="col-12">
                  <label for="organization" class="form-label">Tashkilot:</label>
                  <select id="organization" name="organization" class="form-select">
                    <option value="">Tanlang...</option>
                    {% for org in organizations %}
                      <option value="{{ org.id }}" {% if selected_org == org.id|stringformat:"s" %}selected{% endif %}>
                        {{ org.name }}
                      </option>
                    {% endfor %}
                  </select>
                </div>

                <div class="col-12">
                  <label for="department" class="form-label">Departament:</label>
                  <select id="department" name="department" class="form-select">
                    <option value="">Tanlang...</option>
                    {% for dep in departments %}
                      <option value="{{ dep.id }}" {% if selected_dep == dep.id|stringformat:"s" %}selected{% endif %}>
                        {{ dep.name }}
                      </option>
                    {% endfor %}
                  </select>
                </div>

                <div class="col-md-12">
                  <label for="date1" class="col-sm-2 col-form-label">Sana:</label>
                  <input type="date" name="date1" id="date1" required class="form-control">
                </div>

                <div class="col-md-12">
                  <input type="date" name="date2" id="date2" required class="form-control">
                </div>

                <div class="text-center">
                  <button type="button" id="btnSearch" class="btn btn-primary w-100">Qidirish</button>
                </div>
              </div>

            </div>
          </div>

          <div class="card">
            <div class="card-body">
              <h5 class="card-title">Imzolashga yuborish</h5>

              <div class="row g-3">
                <div class="col-12">
                  <label for="sender" class="form-label">Imzolovchi xodim:</label>
                  <select id="sender" name="sender" class="form-select" required>
                    <option value="">Tanlang...</option>
                  </select>
                </div>

                <div class="col-12">
                  <label for="agreements" class="form-label">Kelishuvchilar :</label>
                  <select id="agreements" name="agreements[]" class="form-select" multiple></select>
                </div>

                <div class="col-12">
                  <label for="message" class="form-label">Izoh :</label>
                  <textarea class="form-control" name="message" rows="4" placeholder="Izoh yozing..."></textarea>
                </div>

                <div class="text-center">
                  <button type="submit" class="btn btn-primary w-100">Imzolashga yuborish</button>
                </div>
              </div>

            </div>
          </div>

      </div>

      <!-- RIGHT: TINYMCE -->
      <div class="col-lg-8">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">TinyMCE Editor</h5>

              <textarea id="body" name="body" class="tinymce-editor">
                <div style="text-align:center;">
                  <b>Sarf materiallari, ehtiyot qismlar va uskunalarni o‘rnatish ishlari haqida</b>
                </div>
                <div style="text-align:center;">
                  <b>DALOLATNOMA</b>
                </div>
                <div style="text-align:right;">
                  <u id="doc_date">_</u>
                </div>
                <div style="text-align:center;">
                  Biz, quyida imzo chekuvchilar, O‘zbekiston Respublikasi Iqtisodiyot va Moliya vazirligi huzuridagi
                  “Axborot texnologiyalari markazi” davlat unitar korxonasining vakillari:
                </div>
                <div style="text-align:center;">
                  <b><u>Ikromov Isroil Ilxomovich (2-toifali mutaxassis)</u></b>
                </div>
                <div style="text-align:center;font-size:8pt;">
                  (F.I.Sh., ATM mutaxassisining lavozimi)
                </div>

                <div>
                  <table style="border-collapse:collapse;width:100%;">
                    <colgroup>
                      <col style="width:50%;">
                      <col style="width:50%;">
                    </colgroup>
                    <tbody>
                      <tr>
                        <td style="border:1px solid #fff;text-align:center;">
                          <span>O‘zbekiston Respublikasi <span id="org_id_1">Tashkilot</span> tashkiloti vakili:</span><br>
                          <b id="sender_name1"><u>Ikromov Isroil Ilxomovich (2-toifali mutaxassis)</u></b><br>
                          <span style="text-align:center;font-size:8pt;">(F.I.Sh., lavozimi)</span>
                        </td>
                        <td style="border:1px solid #fff;text-align:center;">
                          <span id="dep_id">department</span><br>
                          <span>ushbu dalolatnoma quyidagi ishlarni bajarilganligi uchun tuzilgan:</span>
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>

                <div style="text-align:center;margin-top:12px;">
                  <b><u>Quyida ko‘rsatilgan materiallarni o‘rnatish</u></b><br>
                  <span style="text-align:center;font-size:8pt;">(ATM mutaxassislari tomonidan bajarilgan ish turlari bo‘yicha tafsilotlar)</span>
                </div>

                <div style="margin-top:10px;">
                  <table style="border-collapse:collapse;width:100%;">
                    <colgroup>
                      <col style="width:50%;">
                      <col style="width:50%;">
                    </colgroup>
                    <tbody>
                      <tr>
                        <td style="border:1px solid #fff;text-align:center;">
                          <strong>Iqtisodiyot va Moliya vazirligi huzuridagi ATM tomonidan</strong><br>
                          <strong>quyidagi sarf materiallari, ehtiyot qismlar va uskunalar o‘rnatildi:</strong>
                        </td>
                        <td style="border:1px solid #fff;text-align:center;">
                          <strong>2025-yil 4-martdagi 1-son shartnomaga muvofiq</strong>
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>

                <div>
                  <table style="border-collapse:collapse;width:100%;" border="1">
                    <colgroup>
                      <col style="width:3%;">
                      <col style="width:13%;">
                      <col style="width:10%;">
                      <col style="width:22%;">
                      <col style="width:4%;">
                      <col style="width:6%;">
                      <col style="width:12%;">
                      <col style="width:12%;">
                      <col style="width:8%;">
                      <col style="width:5%;">
                      <col style="width:5%;">
                    </colgroup>

                    <!-- ✅ MUHIM: TinyMCE tbody'ni merge qilib yubormasligi uchun
                         header + data bir xil tbody ichida bo‘lsin -->
                    <tbody id="materials_tbody">
                      <tr>
                        <td style="border:1px solid #000;font-size:8pt;text-align:center;" rowspan="2">№</td>
                        <td style="border:1px solid #000;font-size:8pt;text-align:center;" rowspan="2">Ish bajarilgan qurilma nomi</td>
                        <td style="border:1px solid #000;font-size:8pt;text-align:center;" rowspan="2">Qurilma seriya raqami</td>
                        <td style="border:1px solid #000;font-size:8pt;text-align:center;" rowspan="2">Sarf materiallari, ehtiyot qismlar, uskunalar nomi</td>
                        <td style="border:1px solid #000;font-size:8pt;text-align:center;" rowspan="2">Soni</td>
                        <td style="border:1px solid #000;font-size:8pt;text-align:center;" rowspan="2">O‘lchov birligi</td>
                        <td style="border:1px solid #000;font-size:8pt;text-align:center;" colspan="5">
                          Kimga o‘rnatildi yoki o‘rnatilganligini tasdiqlovchi mas’ul shaxs (xarajatlar)
                        </td>
                      </tr>

                      <tr>
                        <td style="border:1px solid #000;font-size:8pt;text-align:center;">F.I.Sh.</td>
                        <td style="border:1px solid #000;font-size:8pt;text-align:center;">Lavozimi</td>
                        <td style="border:1px solid #000;font-size:8pt;text-align:center;">Eslatma*</td>
                        <td style="border:1px solid #000;font-size:8pt;text-align:center;">So‘rovnoma №</td>
                        <td style="border:1px solid #000;font-size:8pt;text-align:center;">O‘rnatish sanasi</td>
                      </tr>

                      <!-- material qatorlari JS orqali shu tbody'ga qo‘shiladi -->
                    </tbody>
                  </table>
                </div>

                <div style="text-align:left;">
                  <b>Yaroqsiz ehtiyot qismlar foydalanuvchida qoldirildi.</b>
                </div>
                <div style="text-align:left;">
                  Izoh: o‘rnatilgan ehtiyot qismlar yoki asbob-uskunalarning birlik narxi buxgalteriya hisobi uchun ko‘rsatiladi.
                </div>

                <div>
                  <table style="border-collapse:collapse;width:100%;">
                    <colgroup>
                      <col style="width:50%;">
                      <col style="width:50%;">
                    </colgroup>
                    <tbody>
                      <tr>
                        <td style="border:1px solid #fff;text-align:center;">
                          <b>Xizmat ko‘rsatuvchi vakili:</b><br>
                          <span>Ikromov Isroil Ilxomovich</span><br>
                          <span style="text-align:center;font-size:8pt;">(F.I.Sh.)</span>
                        </td>
                        <td style="border:1px solid #fff;text-align:center;">
                          <b>O‘zbekiston Respublikasi <span id="org_id_2">Tashkilot</span> tashkiloti vakili:</b><br>
                          <span id="sender_name2">Ikromov Isroil Ilxomovich</span><br>
                          <span style="text-align:center;font-size:8pt;">(F.I.Sh.)</span>
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </textarea>

          </div>
        </div>

      </div>
    </form>
  </section>

</main>


<!-- jQuery va Select2 -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script>
// ----------------- Helper funksiyalar -----------------
function todayDmy() {
  const d = new Date();
  const dd = String(d.getDate()).padStart(2, '0');
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const yy = d.getFullYear();
  return `${dd}.${mm}.${yy}`;
}

function ymdToDmy(ymd) {
  if (!ymd) return '';
  const [y, m, d] = ymd.split('-');
  return `${d}.${m}.${y}`;
}

// ----------------- TinyMCE ga yozish funksiyalari -----------------
function editorGet() {
  return tinymce.get('body');
}

function editorSetText(selector, text) {
  const ed = editorGet();
  if (!ed) return false;

  try {
    const node = ed.getBody().querySelector(selector);
    if (node) {
      node.textContent = text;
      ed.nodeChanged();
      return true;
    }
  } catch(e) {
    console.log("EditorSetText xatosi:", e);
  }
  return false;
}

function editorSetTbodyRows(rowsHtml) {
  const ed = editorGet();
  if (!ed) return;

  try {
    const body = ed.getBody();
    const tbody = body.querySelector('#materials_tbody');
    if (!tbody) {
      console.log("materials_tbody topilmadi");
      return;
    }

    // Header qatorlarini saqlash (birinchi 2 tr)
    const trs = tbody.querySelectorAll('tr');
    const header1 = trs[0] ? trs[0].outerHTML : '';
    const header2 = trs[1] ? trs[1].outerHTML : '';

    tbody.innerHTML = header1 + header2 + (rowsHtml || '');
    ed.nodeChanged();
  } catch(e) {
    console.log("EditorSetTbodyRows xatosi:", e);
  }
}

// ----------------- jQuery va Select2 -----------------
$(function () {
  // Select2 ni ishga tushirish
  $('#organization, #department, #sender, #agreements').select2({
    width: '100%',
    placeholder: 'Tanlang...',
    allowClear: true
  });

  // Boshlang'ich sanalarni o'rnatish
  const today = new Date();
  const todayStr = today.toISOString().split('T')[0];
  const monthAgo = new Date();
  monthAgo.setMonth(monthAgo.getMonth() - 1);
  const monthAgoStr = monthAgo.toISOString().split('T')[0];

  if (!$('#date1').val()) $('#date1').val(monthAgoStr);
  if (!$('#date2').val()) $('#date2').val(todayStr);

  // ----------------- Departmentlarni yuklash -----------------
  function loadDepartments(orgId, selectedDepId = null) {
    $('#department').html('<option value="">Yuklanmoqda...</option>').trigger('change');
    $('#sender, #agreements').html('<option value=""></option>').trigger('change');

    if (!orgId) {
      $('#department').html('<option value="">Tanlang...</option>').trigger('change');
      return;
    }

    $.ajax({
      url: "{% url 'ajax_load_departments' %}",
      data: { organization: orgId },
      success: function (data) {
        let options = '<option value=""></option>';
        data.forEach(function(dep) {
          const selected = (String(selectedDepId) === String(dep.id)) ? 'selected' : '';
          options += `<option value="${dep.id}" ${selected}>${dep.name}</option>`;
        });
        $('#department').html(options).trigger('change');
      },
      error: function() {
        $('#department').html('<option value="">Xatolik yuz berdi</option>').trigger('change');
      }
    });
  }

  // ----------------- Imzolovchilarni yuklash -----------------
  function loadSignatories(depId, selectedSenderId = null) {
    $('#sender').html('<option value="">Yuklanmoqda...</option>').trigger('change');

    if (!depId) {
      $('#sender').html('<option value="">Tanlang...</option>').trigger('change');
      return;
    }

    $.ajax({
      url: "{% url 'ajax_dep_signatory' %}",
      data: { department: depId },
      success: function (data) {
        let options = '<option value=""></option>';
        data.forEach(function(emp) {
          const selected = (String(selectedSenderId) === String(emp.id)) ? 'selected' : '';
          // Ism va lavozimni birlashtirish
          const fullText = emp.rank ? `${emp.full_name} (${emp.rank})` : emp.full_name;
          options += `<option value="${emp.id}" ${selected} data-fullname="${emp.full_name}" data-rank="${emp.rank || ''}">${fullText}</option>`;
        });
        $('#sender').html(options).trigger('change');
      },
      error: function() {
        $('#sender').html('<option value="">Xatolik</option>').trigger('change');
      }
    });
  }

  // ----------------- Kelishuvchilarni yuklash -----------------
  function loadNegotiators(depId, selectedIds = []) {
    $('#agreements').html('').trigger('change');

    if (!depId) return;

    $.ajax({
      url: "{% url 'ajax_dep_negotiator' %}",
      data: { department: depId },
      success: function (data) {
        let options = '';
        const selectedSet = new Set((selectedIds || []).map(String));
        data.forEach(function(emp) {
          const selected = selectedSet.has(String(emp.id)) ? 'selected' : '';
          options += `<option value="${emp.id}" ${selected}>${emp.full_name}</option>`;
        });
        $('#agreements').html(options).trigger('change');
      },
      error: function() {
        $('#agreements').html('').trigger('change');
      }
    });
  }

  // ----------------- Tanlangan malumotlarni TinyMCE ga yozish -----------------
  function updateEditorWithSelections() {
    const orgName = $('#organization option:selected').text();
    const depName = $('#department option:selected').text();

    // Sender ma'lumotlarini olish
    const selectedSender = $('#sender').select2('data')[0];

    // Tashkilot nomlarini yangilash
    if (orgName && orgName !== 'Tanlang...') {
      editorSetText('#org_id_1', orgName);
      editorSetText('#org_id_2', orgName);
    }

    // Departament nomini yangilash
    if (depName && depName !== 'Tanlang...') {
      editorSetText('#dep_id', depName);
    }

    // Imzolovchi nomlarini yangilash
    if (selectedSender) {
      const fullName = selectedSender.text; // To'liq matn (ism + lavozim)
      const rank = selectedSender.element ? selectedSender.element.dataset.rank : '';
      const nameOnly = selectedSender.element ? selectedSender.element.dataset.fullname : fullName;

      // sender_name1 ga ism + lavozim
      editorSetText('#sender_name1', fullName);

      // sender_name2 ga faqat ism
      editorSetText('#sender_name2', nameOnly);

      console.log("Sender_name1 (to'liq):", fullName);
      console.log("Sender_name2 (faqat ism):", nameOnly);
    }
  }

  // ----------------- Materiallarni qidirish -----------------
  function searchMaterials() {
    const orgId = $('#organization').val();
    const depId = $('#department').val();
    const date1 = $('#date1').val();
    const date2 = $('#date2').val();

    if (!orgId || !depId || !date1 || !date2) {
      alert("Iltimos, tashkilot, departament va sanalarni to'liq tanlang!");
      return;
    }

    // Tanlangan ma'lumotlarni editorga yozish
    updateEditorWithSelections();

    // Yuklanmoqda xabarini ko'rsatish
    editorSetTbodyRows(`
      <tr>
        <td colspan="11" style="text-align:center; padding:20px;">
          <i>Yuklanmoqda...</i>
        </td>
      </tr>
    `);

    // Materiallarni yuklash
    $.ajax({
      url: "{% url 'ajax_akt_materials' %}",
      method: "GET",
      data: { department: depId, date1: date1, date2: date2 },
      success: function(data) {
        if (!data || data.length === 0) {
          editorSetTbodyRows(`
            <tr>
              <td colspan="11" style="text-align:center; color:#888; padding:20px;">
                Tanlangan sana oralig'ida ma'lumot topilmadi
              </td>
            </tr>
          `);
          return;
        }

        let rows = "";
        data.forEach(function(item, index) {
          const finishedDate = item['order__date_finished']
            ? new Date(item['order__date_finished']).toLocaleDateString('ru-RU')
            : '-';

          rows += `
            <tr>
              <td style="border:1px solid #000; font-size:8pt; text-align:center;">${index + 1}</td>
              <td style="border:1px solid #000; font-size:8pt; text-align:center;">${item['order__technics__name'] || '-'}</td>
              <td style="border:1px solid #000; font-size:8pt; text-align:center;">${item['order__technics__serial'] || '-'}</td>
              <td style="border:1px solid #000; font-size:8pt; text-align:center;">${item['material__name'] || '-'}</td>
              <td style="border:1px solid #000; font-size:8pt; text-align:center;">${item['number'] || '0'}</td>
              <td style="border:1px solid #000; font-size:8pt; text-align:center;">${item['material__unit__name'] || '-'}</td>
              <td style="border:1px solid #000; font-size:8pt; text-align:center;">${item['full_name'] || '-'}</td>
              <td style="border:1px solid #000; font-size:8pt; text-align:center;">${item['rank_name'] || '-'}</td>
              <td style="border:1px solid #000; font-size:8pt; text-align:center;">${item['material__price'] || '0'}</td>
              <td style="border:1px solid #000; font-size:8pt; text-align:center;">${item['id'] || '-'}</td>
              <td style="border:1px solid #000; font-size:8pt; text-align:center;">${finishedDate}</td>
            </tr>
          `;
        });

        editorSetTbodyRows(rows);
      },
      error: function(xhr) {
        console.error("Xatolik:", xhr);
        editorSetTbodyRows(`
          <tr>
            <td colspan="11" style="text-align:center; color:red; padding:20px;">
              Xatolik yuz berdi: ${xhr.status} ${xhr.statusText}
            </td>
          </tr>
        `);
      }
    });
  }

  // ----------------- Event listeners -----------------
  $('#organization').on('change', function() {
    loadDepartments($(this).val());
    updateEditorWithSelections();
  });

  $('#department').on('change', function() {
    const depId = $(this).val();
    loadSignatories(depId);
    loadNegotiators(depId);
    updateEditorWithSelections();
  });

  $('#sender').on('change', updateEditorWithSelections);

  $('#date2').on('change', function() {
    console.log('date2 o\'zgardi, lekin doc_date o\'zgarmaydi');
  });

  $('#btnSearch').on('click', searchMaterials);

  // ----------------- Initial load -----------------
  const initialOrg = '{{ selected_org|default:"" }}';
  const initialDep = '{{ selected_dep|default:"" }}';
  const initialSender = '{{ selected_sender|default:"" }}';
  const initialConsentList = {{ selected_employees|default:"[]"|safe }};

  if (initialOrg) {
    $('#organization').val(initialOrg).trigger('change');
    loadDepartments(initialOrg, initialDep);

    if (initialDep) {
      setTimeout(function() {
        $('#department').val(initialDep).trigger('change');
        loadSignatories(initialDep, initialSender);
        loadNegotiators(initialDep, initialConsentList);
        setTimeout(updateEditorWithSelections, 1500);
      }, 500);
    }
  }

  // Sanani bir marta tekshirish
  setTimeout(function() {
    const bugungiSana = todayDmy() + ' y';
    editorSetText('#doc_date', bugungiSana);
  }, 2000);
});
</script>
{% endblock content %}
