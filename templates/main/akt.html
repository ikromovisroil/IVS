<!-- jQuery va Select2 -->
<script>
function todayDmy() {
  const d  = new Date();
  const dd = String(d.getDate()).padStart(2, '0');
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const yy = d.getFullYear();
  return `${dd}.${mm}.${yy}`;
}

function formatNumber(value) {
  if (value === null || value === undefined) return '-';
  let s = String(value).trim();
  if (!s) return '-';
  s = s.replace(/\s+/g, '');
  const normalized = s.replace(',', '.');
  const num = Number(normalized);
  if (!isFinite(num)) return '-';
  const hasFraction = /[,.]\d+/.test(s);
  let [intPart, fracPart] = (hasFraction ? num.toFixed(2) : Math.trunc(num).toString()).split('.');
  const sign = intPart.startsWith('-') ? '-' : '';
  intPart = intPart.replace('-', '').replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  return hasFraction ? `${sign}${intPart},${fracPart}` : `${sign}${intPart}`;
}

// ─── EDITOR HELPERS ───────────────────────────────────────────────────────────

function editorGet() {
  if (!window.tinymce) return null;
  const ed = tinymce.get('body');
  if (!ed) return null;
  try { if (!ed.getBody()) return null; } catch (e) { return null; }
  return ed;
}

function editorSetText(selector, text) {
  const ed = editorGet();
  if (!ed) return false;
  try {
    const node = ed.getBody().querySelector(selector);
    if (node) { node.textContent = text; ed.nodeChanged(); return true; }
  } catch (e) { console.log("editorSetText xatosi:", e); }
  return false;
}

function editorSetTbodyRows(rowsHtml) {
  const ed = editorGet();
  if (!ed) return;
  try {
    const tbody = ed.getBody().querySelector('#materials_tbody');
    if (!tbody) return;
    const trs     = tbody.querySelectorAll('tr');
    const header1 = trs[0] ? trs[0].outerHTML : '';
    const header2 = trs[1] ? trs[1].outerHTML : '';
    tbody.innerHTML = header1 + header2 + (rowsHtml || '');
    ed.nodeChanged();
  } catch (e) { console.log("editorSetTbodyRows xatosi:", e); }
}

function waitForTinyMCE(callback, tries = 0) {
  const ed = editorGet();
  if (ed) { callback(); return; }
  if (tries > 50) { console.log("TinyMCE topilmadi"); return; }
  setTimeout(function () { waitForTinyMCE(callback, tries + 1); }, 200);
}

// ─── EDITOR UPDATE ────────────────────────────────────────────────────────────

function updateDocDate() {
  editorSetText('#doc_date', todayDmy() + ' y');
}

function updateContractText() {
  const contract = $('#organization option:selected').data('contract');
  editorSetText('#date_contract', (contract && String(contract).trim()) ? contract : '_');
}

function updateEditorWithSelections() {
  const orgName = $('#organization option:selected').text();
  const depName = $('#department option:selected').text();

  const org = (orgName && orgName !== 'Tanlang...') ? orgName : 'Tashkilot';
  const dep = (depName && depName !== 'Tanlang...') ? depName : 'Departament';

  editorSetText('#org_id_1', org);
  editorSetText('#org_id_2', org);
  editorSetText('#dep_id',   dep);

  updateContractText();

  const $sender  = $('#sender option:selected');
  const senderVal = $('#sender').val();

  if (senderVal) {
    const fullText = $sender.text()                   || '_';
    const fullName = $sender.data('fullname') || fullText;
    editorSetText('#sender_name1', fullText);
    editorSetText('#sender_name2', fullName);
  } else {
    editorSetText('#sender_name1', '_');
    editorSetText('#sender_name2', '_');
  }
}

// ─── JQUERY READY ─────────────────────────────────────────────────────────────

$(function () {

  $('#organization, #department, #sender, #agreements').select2({
    width: '100%',
    placeholder: 'Tanlang...',
    allowClear: true
  });

  // Sanalarni avtomatik to'ldirish
  const today    = new Date();
  const monthAgo = new Date();
  monthAgo.setMonth(monthAgo.getMonth() - 1);

  if (!$('#date1').val()) $('#date1').val(monthAgo.toISOString().split('T')[0]);
  if (!$('#date2').val()) $('#date2').val(today.toISOString().split('T')[0]);

  const userRegion = "{{ user_region|default:'' }}";

  // ─── LOAD DEPARTMENTS ───────────────────────────────────────────────────────

  function loadDepartments(orgId, regId, selectedDepId = null, onSuccess = null) {
    const effectiveReg = regId || userRegion;
    const $dep         = $('#department');
    const $sender      = $('#sender');
    const $agr         = $('#agreements');

    if (!orgId || !effectiveReg) {
      $dep.html('<option value="">Tanlang...</option>').val('').trigger('change');
      return;
    }

    $dep.html('<option value="">Yuklanmoqda...</option>').val('').trigger('change');
    $sender.html('<option value="">Tanlang...</option>').val('').trigger('change');
    $agr.html('').trigger('change');

    $.ajax({
      url: "{% url 'ajax_load_departments' %}",
      method: "GET",
      dataType: "json",
      data: { organization: orgId, region: effectiveReg },

      success: function (data) {
        const list = Array.isArray(data) ? data : (data.departments || data.results || []);
        let options = '<option value="">Tanlang...</option>';

        list.forEach(function (dep) {
          const sel = selectedDepId && String(selectedDepId) === String(dep.id) ? 'selected' : '';
          options += `<option value="${dep.id}" ${sel}>${dep.name}</option>`;
        });

        $dep.html(options);

        if (selectedDepId) {
          $dep.val(String(selectedDepId)).trigger('change');
        } else {
          $dep.val('').trigger('change');
        }

        if (typeof onSuccess === 'function') onSuccess();
      },

      error: function (xhr) {
        console.error("Departments AJAX error:", xhr.status, xhr.responseText);
        $dep.html('<option value="">Xatolik yuz berdi</option>').val('').trigger('change');
      }
    });
  }

  // ─── LOAD SIGNATORIES ───────────────────────────────────────────────────────

  function loadSignatories(depId, selectedSenderId = null) {
    const orgId   = $('#organization').val();
    const $sender = $('#sender');

    $sender.html('<option value="">Yuklanmoqda...</option>').trigger('change');

    if (!orgId && !depId) {
      $sender.html('<option value="">Tanlang...</option>').trigger('change');
      return;
    }

    const payload = {};
    if (orgId) payload.organization = orgId;
    if (depId) payload.department   = depId;

    $.ajax({
      url: "{% url 'ajax_dep_signatory' %}",
      method: "GET",
      dataType: "json",
      data: payload,

      success: function (data) {
        let options = '<option value="">Tanlang...</option>';
        (data || []).forEach(function (emp) {
          const sel      = String(selectedSenderId) === String(emp.id) ? 'selected' : '';
          const fullText = emp.rank ? `${emp.full_name} (${emp.rank})` : emp.full_name;
          options += `
            <option value="${emp.id}" ${sel}
                    data-fullname="${emp.full_name || ''}"
                    data-rank="${emp.rank || ''}">
              ${fullText}
            </option>
          `;
        });
        $sender.html(options).trigger('change');
      },

      error: function (xhr) {
        console.error("Signatory AJAX error:", xhr.status, xhr.responseText);
        $sender.html('<option value="">Xatolik</option>').trigger('change');
      }
    });
  }

  // ─── LOAD NEGOTIATORS ───────────────────────────────────────────────────────

  function loadNegotiators(depId, selectedIds = []) {
    const orgId = $('#organization').val();
    const $agr  = $('#agreements');

    $agr.html('').trigger('change');
    if (!orgId && !depId) return;

    const payload = {};
    if (orgId) payload.organization = orgId;
    if (depId) payload.department   = depId;

    $.ajax({
      url: "{% url 'ajax_dep_negotiator' %}",
      method: "GET",
      dataType: "json",
      data: payload,

      success: function (data) {
        const selectedSet = new Set((selectedIds || []).map(String));
        let options = '';

        (data || []).forEach(function (emp) {
          const sel      = selectedSet.has(String(emp.id)) ? 'selected' : '';
          const fullText = emp.rank ? `${emp.full_name} (${emp.rank})` : emp.full_name;
          options += `
            <option value="${emp.id}" ${sel}
                    data-fullname="${emp.full_name || ''}"
                    data-rank="${emp.rank || ''}">
              ${fullText}
            </option>
          `;
        });

        $agr.html(options).trigger('change');
      },

      error: function (xhr) {
        console.error("Negotiators AJAX error:", xhr.status, xhr.responseText);
        $agr.html('').trigger('change');
      }
    });
  }

  // ─── SEARCH MATERIALS ───────────────────────────────────────────────────────

  function searchMaterials() {
    const orgId = $('#organization').val();
    const depId = $('#department').val();
    const date1 = $('#date1').val();
    const date2 = $('#date2').val();

    if (!orgId || !date1 || !date2) {
      alert("Iltimos, tashkilot va sanalarni to'liq tanlang!");
      return;
    }

    updateEditorWithSelections();
    updateDocDate();

    editorSetTbodyRows(`
      <tr>
        <td colspan="11" style="text-align:center;padding:20px;">
          <i>Yuklanmoqda...</i>
        </td>
      </tr>
    `);

    $.ajax({
      url: "{% url 'ajax_akt_materials' %}",
      method: "GET",
      dataType: "json",
      data: { organization: orgId, department: depId, date1: date1, date2: date2 },

      success: function (data) {
        if (!data || !data.length) {
          editorSetTbodyRows(`
            <tr>
              <td colspan="11" style="text-align:center;color:#888;padding:20px;">
                Tanlangan sana oralig'ida ma'lumot topilmadi
              </td>
            </tr>
          `);
          return;
        }

        let rows = '';
        data.forEach(function (item, index) {
          let finishedDate = '-';
          if (item['order__date_finished']) {
            const dt = new Date(item['order__date_finished']);
            if (!isNaN(dt.getTime())) finishedDate = dt.toLocaleDateString('ru-RU');
          }

          rows += `
            <tr>
              <td style="border:1px solid #000;font-size:8pt;text-align:center;">${index + 1}</td>
              <td style="border:1px solid #000;font-size:8pt;text-align:center;">${item['order__technics__name']   || '-'}</td>
              <td style="border:1px solid #000;font-size:8pt;text-align:center;">${item['order__technics__serial'] || '-'}</td>
              <td style="border:1px solid #000;font-size:8pt;text-align:center;">${item['material__name']          || '-'}</td>
              <td style="border:1px solid #000;font-size:8pt;text-align:center;">${formatNumber(item['number'])}</td>
              <td style="border:1px solid #000;font-size:8pt;text-align:center;">${item['material__unit__name']    || '-'}</td>
              <td style="border:1px solid #000;font-size:8pt;text-align:center;">${item['full_name']               || '-'}</td>
              <td style="border:1px solid #000;font-size:8pt;text-align:center;">${item['rank_name']               || '-'}</td>
              <td style="border:1px solid #000;font-size:8pt;text-align:center;">${formatNumber(item['material__price'])}</td>
              <td style="border:1px solid #000;font-size:8pt;text-align:center;">${item['id']                      || '-'}</td>
              <td style="border:1px solid #000;font-size:8pt;text-align:center;">${finishedDate}</td>
            </tr>
          `;
        });

        editorSetTbodyRows(rows);
      },

      error: function (xhr) {
        console.error("Material search error:", xhr.status, xhr.responseText);
        editorSetTbodyRows(`
          <tr>
            <td colspan="11" style="text-align:center;color:red;padding:20px;">
              Xatolik yuz berdi: ${xhr.status} ${xhr.statusText}
            </td>
          </tr>
        `);
      }
    });
  }

  // ─── EVENTS ─────────────────────────────────────────────────────────────────

  $('#organization').on('change', function () {
    const orgId = $(this).val();
    updateEditorWithSelections();
    updateContractText();

    loadDepartments(orgId, userRegion, null, function () {
      const depId = $('#department').val();
      loadSignatories(depId);
      loadNegotiators(depId);
    });
  });

  $('#department').on('change', function () {
    const depId = $(this).val();
    loadSignatories(depId);
    loadNegotiators(depId);
    updateEditorWithSelections();
  });

  $('#sender').on('change', function () {
    updateEditorWithSelections();
  });

  $('#btnSearch').on('click', function () {
    searchMaterials();
  });

  $('form').on('submit', function () {
    const ed = editorGet();
    if (ed) ed.save();
    return true;
  });

  // ─── INITIAL LOAD ────────────────────────────────────────────────────────────

  const initialOrg         = '{{ selected_org|default:"" }}';
  const initialDep         = '{{ selected_dep|default:"" }}';
  const initialSender      = '{{ selected_sender|default:"" }}';
  const initialConsentList = {{ selected_employees|default:"[]"|safe }};

  if (initialOrg) {
    $('#organization').val(initialOrg);

    loadDepartments(initialOrg, userRegion, initialDep, function () {
      if (initialDep) {
        $('#department').val(initialDep).trigger('change');
        loadSignatories(initialDep, initialSender);
        loadNegotiators(initialDep, initialConsentList);
      }
      waitForTinyMCE(function () {
        updateDocDate();
        updateEditorWithSelections();
        updateContractText();
        if (initialSender) {
          $('#sender').val(initialSender).trigger('change');
          updateEditorWithSelections();
        }
      });
    });
  } else {
    waitForTinyMCE(function () {
      updateDocDate();
      updateEditorWithSelections();
      updateContractText();
