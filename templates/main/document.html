{% block content %}

<main id="main" class="main">

  <div class="pagetitle">
    <h1>Dalolatnoma</h1>
  </div>

  <section class="section">
    <form class="row" action="{% url 'document_post' %}" method="post">
      {% csrf_token %}

      <div class="col-lg-4">

        <div class="card">
          <div class="card-body">
            <h5 class="card-title">Filtrlash</h5>

            <div class="row g-3">
              <div class="col-12">
                <label for="organization" class="form-label">Tashkilot :</label>
                <select id="organization" name="organization" class="form-select" required>
                  <option value="">Tanlang...</option>
                  {% for org in organizations %}
                    <option
                      value="{{ org.id }}"
                      data-contract="{{ org.contract|default:'' }}"
                      {% if selected_org == org.id|stringformat:"s" %}selected{% endif %}
                    >
                      {{ org.name }}
                    </option>
                  {% endfor %}
                </select>
              </div>

              <div class="col-12">
                <label for="department" class="form-label">Departament :</label>
                <select id="department" name="department" class="form-select">
                  <option value="">Tanlang...</option>
                  {% for dep in departments %}
                    <option value="{{ dep.id }}" {% if selected_dep == dep.id|stringformat:"s" %}selected{% endif %}>
                      {{ dep.name }}
                    </option>
                  {% endfor %}
                </select>
              </div>

              <div class="col-md-12">
                <label for="rim_id" class="form-label">Chorak:</label>
                <select id="rim_id" name="rim_id" class="form-select" required>

                  <option value="I">I</option>

              </div>

              <div class="col-12">
                <label for="receiver" class="form-label">Tashkilot vakili:</label>

                  {% for emp in emp_bos %}
                    <option value="{{ emp.id }}">{{ emp.full_name }}</option>

              </div>

              <div class="col-12">
                <label for="agreements" class="form-label">Kelishuvchilar :</label>

                  {% for emp in employee %}

              </div>

              <div class="col-12">
                <label for="message" class="form-label">Izox :</label>

              </div>

              <div class="text-center">
                <button type="submit" class="btn btn-primary w-100">Imzolashga yuborish</button>

            </div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script>
(function () {
  if (!window.jQuery) {
    console.error("jQuery yuklanmagan!");
    return;
  }

  $(function () {
    function esc(s) {
      if (s === null || s === undefined) return '';
      return String(s)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function safeInitSelect2() {
      if (typeof window.initSelect2 === "function") {
        window.initSelect2(document);
        return;
      }

      if (!$.fn.select2) return;

      $('#organization, #department, #rim_id, #sender, #receiver, #agreements').each(function () {
        const $el = $(this);
        if ($el.data('select2')) return;

        $el.select2({
          width: '100%',
          placeholder: 'Tanlang...',
          allowClear: true,
          closeOnSelect: !$el.prop('multiple')
        });
      });
    }

    safeInitSelect2();

    function getEditor() {
      if (!window.tinymce) return null;
      const ed = tinymce.get('body');
      if (!ed) return null;

      try {
        const body = ed.getBody();
        if (!body) return null;
      } catch (e) {
        return null;
      }

      return ed;
    }

    function setInEditor(selector, text) {
      const ed = getEditor();
      if (!ed) return false;

      try {
        const root = ed.getBody();
        if (!root) return false;

        const el = root.querySelector(selector);
        if (!el) return false;

        el.textContent = text;
        ed.nodeChanged();
        return true;
      } catch (e) {
        console.log('setInEditor xatosi:', e);
        return false;
      }
    }

    function setAllInEditor(selector, text) {
      const ed = getEditor();
      if (!ed) return false;

      try {
        const root = ed.getBody();
        if (!root) return false;

        const els = root.querySelectorAll(selector);
        if (!els.length) return false;

        els.forEach(function (el) {
          el.textContent = text;
        });

        ed.nodeChanged();
        return true;
      } catch (e) {
        console.log('setAllInEditor xatosi:', e);
        return false;
      }
    }

    function setTbodyHtml(tbodyId, html) {
      const ed = getEditor();
      if (!ed) return false;

      try {
        const root = ed.getBody();
        if (!root) return false;

        const tb = root.querySelector('#' + tbodyId);
        if (!tb) return false;

        tb.innerHTML = html;
        ed.nodeChanged();
        return true;
      } catch (e) {
        console.log('setTbodyHtml xatosi:', e);
        return false;
      }
    }

    function todayStr() {
      const now = new Date();
      const dd = String(now.getDate()).padStart(2, '0');
      const mm = String(now.getMonth() + 1).padStart(2, '0');
      const yyyy = now.getFullYear();
      return `${dd}.${mm}.${yyyy} y`;
    }

    function applyTodayDate() {
      const d = todayStr();
      setAllInEditor('#doc_date, #doc_date2', d);
    }

    function waitEditorReady(callback) {
      let tries = 0;
      const timer = setInterval(function () {
        tries++;
        const ed = getEditor();

        if (ed || tries > 100) {
          clearInterval(timer);
          if (ed && typeof callback === 'function') {
            callback();
          }
        }
      }, 150);
    }

    function applyOrgToEditor(orgText) {
      if (!orgText || orgText === 'Tanlang...') orgText = 'Tashkilot';
      setAllInEditor('.org_id', orgText);
    }

    function applyDepToEditor(depText, orgText) {
      const cleanDep = (!depText || depText === 'Tanlang...') ? '' : depText;
      const cleanOrg = (!orgText || orgText === 'Tanlang...') ? '' : orgText;
      const finalText = cleanDep || cleanOrg || 'Tashkilot / Departament';

      setInEditor('#dep_id', finalText);
      setInEditor('#dep_id2', finalText);
      setAllInEditor('.dep_name_text', finalText);
      setAllInEditor('.dep_name', finalText);
    }

    function applyChorakToEditor(q) {
      setInEditor('#chorak', q || '');
    }

    function applyContractToEditor(contractText) {
      if (!contractText || !String(contractText).trim()) {
        contractText = 'Shartnoma ma’lumoti kiritilmagan';
      }
      setInEditor('#date_contract', contractText);
    }

    function syncEditorTexts() {
      const orgText = $('#organization option:selected').text() || '';
      const depText = $('#department option:selected').text() || '';
      const chorak = $('#rim_id').val() || '';
      const contractText = $('#organization option:selected').attr('data-contract') || '';

      applyTodayDate();
      applyOrgToEditor(orgText);
      applyDepToEditor(depText, orgText);
      applyChorakToEditor(chorak);
      applyContractToEditor(contractText);
    }

    function loadDepartments(orgId, selectedDepId = null) {
      const $dep = $('#department');
      const $receiver = $('#receiver');
      const $agr = $('#agreements');

      $dep.html('<option value="">Yuklanmoqda...</option>').val('').trigger('change');
      $receiver.html('<option value="">Tanlang...</option>').val('').trigger('change');
      $agr.html('').trigger('change');

      if (!orgId) {
        $dep.html('<option value="">Tanlang...</option>').val('').trigger('change');
        return;
      }

      $.ajax({
        url: "{% url 'ajax_load_departments' %}",
        method: "GET",
        dataType: "json",
        data: { organization: orgId },
        success: function (data) {
          const list = Array.isArray(data) ? data : (data.departments || data.results || []);
          let options = '<option value="">Tanlang...</option>';

          list.forEach(function (dep) {
            const selected = selectedDepId && String(selectedDepId) === String(dep.id) ? 'selected' : '';
            options += `<option value="${dep.id}" ${selected}>${esc(dep.name)}</option>`;
          });

          $dep.html(options).trigger('change');
          safeInitSelect2();
        },
        error: function (xhr) {
          console.error('Departments AJAX error:', xhr.status, xhr.responseText);
          $dep.html('<option value="">Xatolik yuz berdi</option>').trigger('change');
        }
      });
    }

    function fillEmployeeSelect($sel, list, selectedId = null, allowEmpty = true, keepSelected = false) {
      let currentSelected = [];
      if (keepSelected) {
        currentSelected = ($sel.val() || []).map(String);
      }

      let html = allowEmpty ? '<option value="">Tanlang...</option>' : '';

      (list || []).forEach(function (emp) {
        const idStr = String(emp.id);
        const selectedSingle = selectedId && String(selectedId) === idStr;
        const selectedKeep = keepSelected && currentSelected.includes(idStr);
        const label = emp.rank ? `${emp.full_name} (${emp.rank})` : emp.full_name;

        html += `<option value="${esc(emp.id)}" ${(selectedSingle || selectedKeep) ? 'selected' : ''}>${esc(label)}</option>`;
      });

      $sel.html(html).trigger('change');
      safeInitSelect2();
    }

    function loadReceiverByDepartment(depId, selectedId = null) {
      const $receiver = $('#receiver');
      const orgId = $('#organization').val();

      $receiver.html('<option value="">Yuklanmoqda...</option>').trigger('change');

      if (!orgId && !depId) {
        $receiver.html('<option value="">Tanlang...</option>').trigger('change');
        return;
      }

      const payload = {};
      if (orgId) payload.organization = orgId;
      if (depId) payload.department = depId;

      $.ajax({
        url: "{% url 'ajax_dep_signatory' %}",
        method: "GET",
        dataType: "json",
        data: payload,
        success: function (list) {
          fillEmployeeSelect($receiver, list, selectedId, true, false);
        },
        error: function (xhr) {
          console.log('receiver ajax error:', xhr.status, xhr.responseText);
          $receiver.html('<option value="">Xatolik</option>').trigger('change');
        }
      });
    }

    function loadAgreementsByDepartment(depId, selectedIds = []) {
      const $agr = $('#agreements');
      const orgId = $('#organization').val();

      $agr.html('').trigger('change');

      if (!orgId && !depId) return;

      const payload = {};
      if (orgId) payload.organization = orgId;
      if (depId) payload.department = depId;

      $.ajax({
        url: "{% url 'ajax_dep_negotiator' %}",
        method: "GET",
        dataType: "json",
        data: payload,
        success: function (list) {
          fillEmployeeSelect($agr, list, null, false, true);

          if (selectedIds && selectedIds.length) {
            $agr.val(selectedIds.map(String)).trigger('change');
          }
        },
        error: function (xhr) {
          console.log('agreements ajax error:', xhr.status, xhr.responseText);
          $agr.html('').trigger('change');
        }
      });
    }

    function fillPc(items) {
      let rows = `
        <tr>
          <td style="border:1px solid #000;font-size:12pt;text-align:center;">№</td>
          <td style="border:1px solid #000;font-size:12pt;text-align:center;">Rusumi</td>
          <td style="border:1px solid #000;font-size:12pt;text-align:center;">Kompyuter SR</td>
          <td style="border:1px solid #000;font-size:12pt;text-align:center;">Monitor SR</td>
        </tr>
      `;

      if (!items || !items.length) {
        rows += `<tr><td colspan="4" style="border:1px solid #000;text-align:center;color:#777;">Ma'lumot topilmadi</td></tr>`;
        setTbodyHtml('tbody1', rows);
        return;
      }

      items.forEach(function (x, i) {
        rows += `
          <tr>
            <td style="border:1px solid #000;text-align:center;">${i + 1}</td>
            <td style="border:1px solid #000;">${esc(x.name || '')}</td>
            <td style="border:1px solid #000;">${esc(x.serial || '')}</td>
            <td style="border:1px solid #000;">${esc((x.extra_serials || []).join(', '))}</td>
          </tr>
        `;
      });

      setTbodyHtml('tbody1', rows);
    }

    function fillGeneric(tbodyId, items, serialTitle) {
      let rows = `
        <tr>
          <td style="border:1px solid #000;font-size:12pt;text-align:center;">№</td>
          <td style="border:1px solid #000;font-size:12pt;text-align:center;">Rusumi</td>
          <td style="border:1px solid #000;font-size:12pt;text-align:center;">${serialTitle}</td>
        </tr>
      `;

      if (!items || !items.length) {
        rows += `<tr><td colspan="3" style="border:1px solid #000;text-align:center;color:#777;">Ma'lumot topilmadi</td></tr>`;
        setTbodyHtml(tbodyId, rows);
        return;
      }

      items.forEach(function (x, i) {
        rows += `
          <tr>
            <td style="border:1px solid #000;text-align:center;">${i + 1}</td>
            <td style="border:1px solid #000;">${esc(x.name || '')}</td>
            <td style="border:1px solid #000;">${esc(x.serial || '')}</td>
          </tr>
        `;
      });

      setTbodyHtml(tbodyId, rows);
    }

    function loadTechnicsToEditor(depId) {
      const orgId = $('#organization').val();

      syncEditorTexts();

      if (!orgId && !depId) {
        setInEditor('#komp_count', '_');
        setInEditor('#prin4_count', '_');
        setInEditor('#prin3_count', '_');
        setInEditor('#scan_count', '_');
        fillPc([]);
        fillGeneric('tbody3', [], 'Printer SR');
        fillGeneric('tbody4', [], 'Printer SR');
        fillGeneric('tbody6', [], 'Skaner SR');
        return;
      }

      setTbodyHtml('tbody1', `
        <tr><td colspan="4" style="border:1px solid #000;text-align:center;color:#777;">Yuklanmoqda...</td></tr>
      `);

      setTbodyHtml('tbody3', `
        <tr><td colspan="3" style="border:1px solid #000;text-align:center;color:#777;">Yuklanmoqda...</td></tr>
      `);

      setTbodyHtml('tbody4', `
        <tr><td colspan="3" style="border:1px solid #000;text-align:center;color:#777;">Yuklanmoqda...</td></tr>
      `);

      setTbodyHtml('tbody6', `
        <tr><td colspan="3" style="border:1px solid #000;text-align:center;color:#777;">Yuklanmoqda...</td></tr>
      `);

      const payload = {};
      if (orgId) payload.organization = orgId;
      if (depId) payload.department = depId;

      $.ajax({
        url: "{% url 'ajax_document_preview' %}",
        method: "GET",
        dataType: "json",
        data: payload,
        success: function (res) {
          setInEditor('#komp_count', String(res.contrac1_count ?? 0));
          setInEditor('#prin4_count', String(res.contrac2_count ?? 0));
          setInEditor('#prin3_count', String(res.contrac3_count ?? 0));
          setInEditor('#scan_count', String(res.contrac4_count ?? 0));

          fillPc(res.contrac1 || []);
          fillGeneric('tbody3', res.contrac2 || [], 'Printer SR');
          fillGeneric('tbody4', res.contrac3 || [], 'Printer SR');
          fillGeneric('tbody6', res.contrac4 || [], 'Skaner SR');
        },
        error: function (xhr) {
          let msg = "Xatolik yuz berdi";

          try {
            if (xhr.responseJSON && xhr.responseJSON.error) {
              msg = xhr.responseJSON.error;
            }
          } catch (e) {}

          setInEditor('#komp_count', '_');
          setInEditor('#prin4_count', '_');
          setInEditor('#prin3_count', '_');
          setInEditor('#scan_count', '_');

          setTbodyHtml('tbody1', `<tr><td colspan="4" style="border:1px solid #000;text-align:center;color:red;">${esc(msg)}</td></tr>`);
          setTbodyHtml('tbody3', `<tr><td colspan="3" style="border:1px solid #000;text-align:center;color:red;">${esc(msg)}</td></tr>`);
          setTbodyHtml('tbody4', `<tr><td colspan="3" style="border:1px solid #000;text-align:center;color:red;">${esc(msg)}</td></tr>`);
          setTbodyHtml('tbody6', `<tr><td colspan="3" style="border:1px solid #000;text-align:center;color:red;">${esc(msg)}</td></tr>`);
        }
      });
    }

    $('#organization').on('change', function () {
      const orgId = $(this).val();

      syncEditorTexts();
      loadDepartments(orgId);

      const depId = $('#department').val();
      loadReceiverByDepartment(depId);
      loadAgreementsByDepartment(depId);
    });

    $('#department').on('change', function () {
      const depId = $(this).val();

      syncEditorTexts();
      loadReceiverByDepartment(depId);
      loadAgreementsByDepartment(depId);
    });

    $('#rim_id').on('change', function () {
      syncEditorTexts();
    });

    $('#btnSearch').on('click', function (e) {
      e.preventDefault();
      loadTechnicsToEditor($('#department').val());
    });

    $('form').on('submit', function () {
      const ed = getEditor();
      if (ed) ed.save();
      return true;
    });

    waitEditorReady(function () {
      syncEditorTexts();
    });

    const initialOrg = '{{ selected_org|default:"" }}';
    const initialDep = '{{ selected_dep|default:"" }}';

    if (initialOrg) {
      loadDepartments(initialOrg, initialDep);

      setTimeout(function () {
        $('#organization').val(initialOrg).trigger('change');

        if (initialDep) {
          setTimeout(function () {
            $('#department').val(initialDep).trigger('change');
          }, 300);
        }
      }, 100);
    }
  });
})();
</script>
