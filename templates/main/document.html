{% extends 'base.html' %}
{% load static %}

{% block title %}
    <title>Hisobot</title>
{% endblock title %}

{% block css %}
<style>
.text-justify{
  text-align: justify;
  text-justify: inter-word;
}
</style>
{% endblock css %}

{% block content %}

<main id="main" class="main">

  <div class="pagetitle">
    <h1>Dalolatnoma</h1>
  </div>

  <section class="section">
    <form class="row" action="{% url 'document_post' %}" method="post">{% csrf_token %}

      <div class="col-lg-4">

          <div class="card">
            <div class="card-body">
              <h5 class="card-title">Filtrlash</h5>

              <div class="row g-3">
                <div class="col-12">
                  <label for="organization" class="form-label">Tashkilot :</label>
                  <select id="organization" name="organization" class="form-select" required>
                    <option value="">Tanlang...</option>
                    {% for org in organizations %}
                      <option value="{{ org.id }}" {% if selected_org == org.id|stringformat:"s" %}selected{% endif %}>
                        {{ org.name }}
                      </option>
                    {% endfor %}
                  </select>
                </div>

                <div class="col-12">
                  <label for="department" class="form-label">Departament :</label>
                  <select id="department" name="department" class="form-select" required>
                    <option value="">Tanlang...</option>
                    {% for dep in departments %}
                      <option value="{{ dep.id }}" {% if selected_dep == dep.id|stringformat:"s" %}selected{% endif %}>
                        {{ dep.name }}
                      </option>
                    {% endfor %}
                  </select>
                </div>

                <div class="col-md-12">
                  <label for="rim_id" class="form-label">Chorak:</label>
                  <select id="rim_id" name="rim_id" class="form-select" required>
                    <option value="">Tanlang...</option>
                    <option value="I">I</option>
                    <option value="II">II</option>
                    <option value="III">III</option>
                    <option value="IV">IV</option>
                  </select>
                </div>

                <div class="text-center">
                  <button type="button" id="btnSearch" class="btn btn-primary w-100">Qidirish</button>
                </div>
              </div>
            </div>
          </div>

          <div class="card">
            <div class="card-body">
              <h5 class="card-title">Imzolashga yuborish</h5>

              <div class="row g-3">

                <div class="col-12">
                  <label for="sender" class="form-label">Xizmat ko'rsatuvchining vakili</label>
                  <select id="sender" name="sender" class="form-select" required>
                    <option value="">Tanlang...</option>
                    {% for emp in emp_bos_sender %}
                      <option value="{{ emp.id }}">{{ emp.full_name }}</option>
                    {% endfor %}
                  </select>
                </div>

                <div class="col-12">
                  <label for="receiver" class="form-label">Tashkilot vakili:</label>
                  <select id="receiver" name="receiver" class="form-select" required>
                    <option value="">Tanlang...</option>
                    {% for emp in emp_bos %}
                      <option value="{{ emp.id }}">{{ emp.full_name }}</option>
                    {% endfor %}
                  </select>
                </div>

                <div class="col-12">
                  <label for="agreements" class="form-label">Kelishuvchilar :</label>
                  <select id="agreements" name="agreements[]" class="form-select" multiple>
                    {% for emp in employee %}
                      <option value="{{ emp.id }}">{{ emp.full_name }}</option>
                    {% endfor %}
                  </select>
                </div>

                <div class="col-12">
                  <label for="message" class="form-label">Izox :</label>
                  <textarea class="form-control" name="message" rows="4" placeholder="Izoh yozing..."></textarea>
                </div>

                <div class="text-center">
                  <button type="submit" class="btn btn-primary w-100">Imzolashga yuborish</button>
                </div>

              </div>
            </div>
          </div>

      </div>

      <div class="col-lg-8">
          <div class="card">
            <div class="card-body">
              <h5 class="card-title">TinyMCE Editor</h5>

              <textarea id="body" name="body" class="tinymce-editor">
                <div style="text-align:center;">
                  <b>DALOLATNOMA</b>
                </div>
                <div style="text-align:right;">
                  <span id="doc_date">12.02.2026 y</span>
                </div>
                <div style="text-align: justify;">
                  <span>
                  Biz quyida imzo chekuvchilar, O‘zbekiston Respublikasi <span id="org_id">Iqtisodiyot va moliya vazirligi</span>
                  <span id="dep_id">Davlat byudjeti siyosati departamenti</span> direktori <b>Sh.Muxamedov</b>, va O‘zbekiston Respublikasi Iqtisodiyot
                  va moliya vazirligi huzuridagi Axborot texnologiyalari markazi direktori vazifasini vaqtincha bajaruvchi
                  <b>F.Xujamqulov</b>: O‘zbekiston Respublikasi <span id="org_id">Iqtisodiyot va moliya vazirligi</span> hamda O‘zbekiston Respublikasi
                  Iqtisodiyot va moliya vazirligi huzuridagi Axborot texnologiyalari markazlari tomonidan <b>2025 yil 4-martda
                  tuzilgan 1-sonli</b> shartnomaga asosan <span id="dep_id2">Davlat byudjeti siyosati departamenti</span> bo‘yicha 2026 yil
                  <span id="chorak">I</span> chorak uchun
                  quyidagi ishlar va xizmatlar bajarildi. Ishlar texnologik xaritaga muvofiq amalga oshirildi.
                  </span>
                </div>
                <div></div>
                <div style="text-align:left;">
                  <b>1. Kompyuter va boshqa elektron qurilmalarga texnik va tizimli xizmat ko‘rsatish:</b>
                </div>
                <div></div>
                <div style="text-align:left;">
                  <span><b>1.1.</b> Biriktirilgan kompyuterlarga xizmat ko‘rsatish – <b id="komp_count">_</b> dona</span>
                </div>
                <div style="text-align:left;">
                  <span><b>1.4.</b> A3 formatli printerlarga xizmat ko‘rsatish – <b id="prin_count">_</b> dona.</span>
                </div>
                <div></div>
                <div>
                  <table style="border-collapse:collapse;width:100%;">
                    <colgroup>
                      <col style="width:50%;">
                      <col style="width:50%;">
                    </colgroup>
                    <tbody>
                      <tr>
                        <td style="border:1px solid #fff;text-align:center;">
                          <b>O‘zbekiston Respublikasi Iqtisodiyot va moliya vazirligi Davlat byudjeti siyosati departamenti</b><br><br>
                          <b>Sh.Muxamedov</b>
                        </td>
                        <td style="border:1px solid #fff;text-align:center;">
                          <b>O‘zbekiston Respublikasi Iqtisodiyot va moliya vazirligi huzuridagi ATM direktori v.v.b.</b><br><br>
                          <b>F.Xujamqulov</b>
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>

                <div style="page-break-after: always;"></div>

                <div style="text-align:right;">
                  <span id="doc_date2">12.02.2026 y</span>
                </div>
                <div style="text-align:center;">
                  <b>Kompyuter va printer texnikalariga tizimli va texnik xizmat ko‘rsatishni amalga oshirish hisoboti</b>
                </div>
                <div style="text-align:center;">
                  <b>DALOLATNOMA</b></br>
                  <span style="text-align:center;font-size:8pt;">(boshqarma nomi)</span>
                </div>
                <div style="text-align:center;">
                  <b>Biz, <u>Tankoz E.E. bosh mutaxassis, Jumayev U.O. 2-toifali mutaxassis</u></b></br>
                  <span style="text-align:center;font-size:8pt;">(F.I.Sh.) (lavozimi)</span>
                </div>
                <div style="text-align:left;">
                  <b>Xizmat ko‘rsatilyotgan texnikalarni rusumi seriya raqami:</b>
                </div>
                <div style="text-align:left;">
                  <b>Kompyuterlar (PC/Noutbuk/Planshet/Info-kiosk)</b>
                </div>
                <div>
                  <table style="border-collapse:collapse;width:100%;" border="1">
                    <colgroup>
                      <col style="width:10%;">
                      <col style="width:30%;">
                      <col style="width:30%;">
                      <col style="width:30%;">
                    </colgroup>
                    <tbody id="pc_tbody">
                      <tr>
                        <td style="border:1px solid #000;font-size:12pt;text-align:center;">№</td>
                        <td style="border:1px solid #000;font-size:12pt;text-align:center;">Rusumi</td>
                        <td style="border:1px solid #000;font-size:12pt;text-align:center;">Kompyuter SR:</td>
                        <td style="border:1px solid #000;font-size:12pt;text-align:center;">Inventar raqami:</td>
                      </tr>
                    </tbody>
                  </table>
                </div></br>
                <div style="text-align:left;">
                  <b>Printerlar (A4/A3/Skanner)</b>
                </div>
                <div>
                  <table style="border-collapse:collapse;width:100%;" border="1">
                    <colgroup>
                      <col style="width:20%;">
                      <col style="width:40%;">
                      <col style="width:40%;">
                    </colgroup>
                    <tbody id="pr_tbody">
                      <tr>
                        <td style="border:1px solid #000;font-size:12pt;text-align:center;">№</td>
                        <td style="border:1px solid #000;font-size:12pt;text-align:center;">Rusumi</td>
                        <td style="border:1px solid #000;font-size:12pt;text-align:center;">Kompyuter SR:</td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </textarea>

            </div>
          </div>

        </div>

    </form>
  </section>

</main>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script>
$(function () {

  // -------------------- ESCAPE --------------------
  function esc(s){
    if (s === null || s === undefined) return '';
    return String(s)
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');
  }

  // -------------------- SELECT2 --------------------
  function initSelect2(){
    if (!$.fn.select2) return;
    $('select.form-select').each(function(){
      const $el = $(this);
      if ($el.data('select2')) return;
      $el.select2({
        width: '100%',
        placeholder: 'Tanlang...',
        allowClear: true
      });
    });
  }
  initSelect2();

  // -------------------- TINYMCE SAFE --------------------
  function getEditor(){
    if (!window.tinymce) return null;
    const ed = tinymce.get('body');
    if (!ed) return null;
    try { ed.getBody(); } catch(e){ return null; }
    return ed;
  }

  function setInEditor(selector, text){
    const ed = getEditor();
    if (!ed) return false;
    const root = ed.getBody();
    const el = root.querySelector(selector);
    if (!el) return false;
    el.textContent = text;
    ed.nodeChanged();
    return true;
  }

  function setAllInEditor(selector, text){
    const ed = getEditor();
    if (!ed) return false;
    const root = ed.getBody();
    const els = root.querySelectorAll(selector);
    if (!els || !els.length) return false;
    els.forEach(el => el.textContent = text);
    ed.nodeChanged();
    return true;
  }

  function setTbodyHtml(tbodyId, html){
    const ed = getEditor();
    if (!ed) return false;
    const root = ed.getBody();
    const tb = root.querySelector('#' + tbodyId);
    if (!tb) return false;
    tb.innerHTML = html;
    ed.nodeChanged();
    return true;
  }

  // -------------------- BUGUNGI SANA --------------------
  function todayStr(){
    const now = new Date();
    const dd = String(now.getDate()).padStart(2,'0');
    const mm = String(now.getMonth()+1).padStart(2,'0');
    const yyyy = now.getFullYear();
    return `${dd}.${mm}.${yyyy} y`;
  }

  function applyTodayDate(){
    const d = todayStr();
    // TinyMCE ichida
    setAllInEditor('#doc_date, #doc_date2', d);
  }

  // editor tayyor bo‘lganda sanani yozish
  (function waitEditorAndSetDate(){
    let tries = 0;
    const t = setInterval(function(){
      tries++;
      if (getEditor() || tries > 50){ // ~5s
        clearInterval(t);
        applyTodayDate();
      }
    }, 100);
  })();

  // -------------------- ORG/DEP/CHORAK -> TINYMCE --------------------
  function applyOrgToEditor(orgText){
    // sizda org_id 2 marta ishlatilgan (HTML invalid), shuning uchun hammasini yangilaymiz:
    const ed = getEditor();
    if (!ed) return;
    const root = ed.getBody();
    root.querySelectorAll('#org_id').forEach(el => el.textContent = orgText);
    ed.nodeChanged();
  }

  function applyDepToEditor(depText){
    setInEditor('#dep_id', depText);
    setInEditor('#dep_id2', depText);
  }

  function applyChorakToEditor(q){
    setInEditor('#chorak', q || '');
  }

  // -------------------- ORG -> DEP --------------------
  function loadDepartments(orgId, selectedDepId=null){
    const $dep = $('#department');

    $dep.html('<option value="">Yuklanmoqda...</option>').trigger('change.select2');
    initSelect2();

    if(!orgId){
      $dep.html('<option value="">Tanlang...</option>').trigger('change.select2');
      initSelect2();
      return;
    }

    $.ajax({
      url: "{% url 'ajax_load_departments' %}",
      method: "GET",
      dataType: "json",
      data: { organization: orgId },
      success: function(deps){
        let opt = '<option value="">Tanlang...</option>';
        (deps || []).forEach(d => {
          const sel = (selectedDepId && String(d.id) === String(selectedDepId)) ? 'selected' : '';
          opt += `<option value="${d.id}" ${sel}>${esc(d.name)}</option>`;
        });
        $dep.html(opt).trigger('change.select2');
        initSelect2();

        // dep nomini editorga (agar selected bo‘lsa)
        if (selectedDepId){
          const depText = $dep.find('option:selected').text() || '';
          if (depText && depText !== 'Tanlang...') applyDepToEditor(depText);
        }
      },
      error: function(){
        $dep.html('<option value="">Xatolik (dep yuklanmadi)</option>').trigger('change.select2');
        initSelect2();
      }
    });
  }

  // -------------------- DEP -> EMPLOYEES (SENDER/RECEIVER/AGREEMENTS) --------------------
  function fillEmployeeSelect($sel, list, selectedId=null, allowEmpty=true){
    let opt = allowEmpty ? '<option value="">Tanlang...</option>' : '';
    (list || []).forEach(emp => {
      const sel = (selectedId && String(emp.id) === String(selectedId)) ? 'selected' : '';
      // rank ham kelayotgan bo‘lsa: "F.I.Sh (Lavozim)"
      const label = emp.rank ? `${emp.full_name} (${emp.rank})` : emp.full_name;
      opt += `<option value="${emp.id}" ${sel}>${esc(label)}</option>`;
    });
    $sel.html(opt).trigger('change.select2');
    initSelect2();
  }

  function loadSignatories(depId){
    const $sender = $('#sender');
    const $receiver = $('#receiver');

    $sender.html('<option value="">Yuklanmoqda...</option>').trigger('change.select2');
    $receiver.html('<option value="">Yuklanmoqda...</option>').trigger('change.select2');
    initSelect2();

    if(!depId){
      $sender.html('<option value="">Tanlang...</option>').trigger('change.select2');
      $receiver.html('<option value="">Tanlang...</option>').trigger('change.select2');
      initSelect2();
      return;
    }

    $.ajax({
      url: "{% url 'ajax_dep_signatory' %}",
      method: "GET",
      dataType: "json",
      data: { department: depId },
      success: function(list){
        fillEmployeeSelect($sender, list, null, true);
        fillEmployeeSelect($receiver, list, null, true);
      },
      error: function(xhr){
        console.log("signatory ajax error:", xhr.status, xhr.responseText);
        $sender.html('<option value="">Xatolik</option>').trigger('change.select2');
        $receiver.html('<option value="">Xatolik</option>').trigger('change.select2');
        initSelect2();
      }
    });
  }

  function loadAgreements(depId){
    const $agr = $('#agreements');

    $agr.html('').trigger('change.select2');
    initSelect2();

    if(!depId){
      $agr.html('').trigger('change.select2');
      initSelect2();
      return;
    }

    $.ajax({
      url: "{% url 'ajax_dep_negotiator' %}",
      method: "GET",
      dataType: "json",
      data: { department: depId },
      success: function(list){
        let opt = '';
        (list || []).forEach(emp => {
          const label = emp.rank ? `${emp.full_name} (${emp.rank})` : emp.full_name;
          opt += `<option value="${emp.id}">${esc(label)}</option>`;
        });
        $agr.html(opt).trigger('change.select2');
        initSelect2();
      },
      error: function(xhr){
        console.log("agreements ajax error:", xhr.status, xhr.responseText);
        $agr.html('').trigger('change.select2');
        initSelect2();
      }
    });
  }

  // -------------------- TEXNIKALAR -> TINYMCE JADVAL --------------------
  function fillPc(items){
    // header rowni saqlab qolamiz (sizning template'da header ham pc_tbody ichida)
    let rows = `
      <tr>
        <td style="border:1px solid #000;font-size:12pt;text-align:center;">№</td>
        <td style="border:1px solid #000;font-size:12pt;text-align:center;">Rusumi</td>
        <td style="border:1px solid #000;font-size:12pt;text-align:center;">Kompyuter SR:</td>
        <td style="border:1px solid #000;font-size:12pt;text-align:center;">Inventar raqami:</td>
      </tr>
    `;

    if(!items || !items.length){
      rows += `<tr><td colspan="4" style="text-align:center;color:#777;">Ma'lumot topilmadi</td></tr>`;
      setTbodyHtml('pc_tbody', rows);
      return;
    }

    items.forEach((x,i) => {
      rows += `
        <tr>
          <td style="border:1px solid #000;text-align:center;">${i+1}</td>
          <td style="border:1px solid #000;">${esc(x.name)}</td>
          <td style="border:1px solid #000;">${esc(x.serial)}</td>
          <td style="border:1px solid #000;">${esc(x.inventory)}</td>
        </tr>`;
    });

    setTbodyHtml('pc_tbody', rows);
  }

  function fillPr(items){
    let rows = `
      <tr>
        <td style="border:1px solid #000;font-size:12pt;text-align:center;">№</td>
        <td style="border:1px solid #000;font-size:12pt;text-align:center;">Rusumi</td>
        <td style="border:1px solid #000;font-size:12pt;text-align:center;">Kompyuter SR:</td>
      </tr>
    `;

    if(!items || !items.length){
      rows += `<tr><td colspan="3" style="text-align:center;color:#777;">Ma'lumot topilmadi</td></tr>`;
      setTbodyHtml('pr_tbody', rows);
      return;
    }

    items.forEach((x,i) => {
      rows += `
        <tr>
          <td style="border:1px solid #000;text-align:center;">${i+1}</td>
          <td style="border:1px solid #000;">${esc(x.name)}</td>
          <td style="border:1px solid #000;">${esc(x.serial)}</td>
        </tr>`;
    });

    setTbodyHtml('pr_tbody', rows);
  }

  function loadTechnicsToEditor(depId){
    if(!depId){
      setInEditor('#komp_count', '_');
      setInEditor('#prin_count', '_');
      fillPc([]);
      fillPr([]);
      return;
    }

    // loading
    setTbodyHtml('pc_tbody', `<tr><td colspan="4" style="text-align:center;color:#777;">Yuklanmoqda...</td></tr>`);
    setTbodyHtml('pr_tbody', `<tr><td colspan="3" style="text-align:center;color:#777;">Yuklanmoqda...</td></tr>`);

    $.ajax({
      url: "{% url 'ajax_document_preview' %}",
      method: "GET",
      dataType: "json",
      data: { department: depId },
      success: function(res){
        setInEditor('#komp_count', String(res.komp_count ?? 0));
        setInEditor('#prin_count', String(res.prin_count ?? 0));
        fillPc(res.kompyuterlar || []);
        fillPr(res.printerlar || []);
      },
      error: function(xhr){
        let msg = "Xatolik yuz berdi";
        try { if (xhr.responseJSON && xhr.responseJSON.error) msg = xhr.responseJSON.error; } catch(e){}
        setTbodyHtml('pc_tbody', `<tr><td colspan="4" style="text-align:center;color:red;">${esc(msg)}</td></tr>`);
        setTbodyHtml('pr_tbody', `<tr><td colspan="3" style="text-align:center;color:red;">${esc(msg)}</td></tr>`);
      }
    });
  }

  // -------------------- EVENTLAR --------------------
  $('#organization').on('change', function(){
    const orgId = $(this).val();
    const orgText = $('#organization option:selected').text() || '';

    loadDepartments(orgId);

    // editorga org nomi
    if (orgText && orgText !== 'Tanlang...') applyOrgToEditor(orgText);

    // reset
    $('#sender').html('<option value="">Tanlang...</option>').trigger('change.select2');
    $('#receiver').html('<option value="">Tanlang...</option>').trigger('change.select2');
    $('#agreements').html('').trigger('change.select2');
    initSelect2();

    setInEditor('#komp_count', '_');
    setInEditor('#prin_count', '_');
    fillPc([]);
    fillPr([]);
  });

  $('#department').on('change', function(){
    const depId = $(this).val();
    const depText = $('#department option:selected').text() || '';

    // editorga dep nomi
    if (depText && depText !== 'Tanlang...') applyDepToEditor(depText);

    loadSignatories(depId);
    loadAgreements(depId);
    loadTechnicsToEditor(depId);
  });

  $('#rim_id').on('change', function(){
    const q = $(this).val(); // I / II / III / IV
    applyChorakToEditor(q);
  });

  $('#btnSearch').on('click', function(){
    const depId = $('#department').val();
    if(!depId){ alert("Departmentni tanlang!"); return; }
    loadTechnicsToEditor(depId);
  });

  // -------------------- RESTORE (serverdan kelgan selected) --------------------
  const initialOrg = '{{ selected_org|default:"" }}';
  const initialDep = '{{ selected_dep|default:"" }}';

  if (initialOrg){
    $('#organization').val(initialOrg).trigger('change');

    // dep larni yuklab, initialDep ni tanlab beramiz
    loadDepartments(initialOrg, initialDep);

    if (initialDep){
      setTimeout(function(){
        $('#department').val(initialDep).trigger('change');
      }, 300);
    }
  }

});
</script>


{% endblock content %}

{% block js %}
{% endblock js %}
