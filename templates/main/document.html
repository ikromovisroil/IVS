{% extends 'base.html' %}
{% load static %}

{% block title %}
    <title>Hisobot</title>
{% endblock title %}

{% block css %}{% endblock css %}

{% block content %}
<main id="main" class="main">

  <div class="pagetitle">
    <h1>Dalolatnoma</h1>
  </div>

  <section class="section">
    <form class="row" action="{% url 'document_post' %}" method="post">
      {% csrf_token %}

      <!-- ══════════════════ CHAP PANEL ══════════════════ -->
      <div class="col-lg-4">

        <div class="card">
          <div class="card-body">
            <h5 class="card-title">Filtrlash</h5>
            <div class="row g-3">

              <div class="col-12">
                <label for="organization" class="form-label">Tashkilot :</label>
                <select id="organization" name="organization" class="form-select" required>
                  <option value="">Tanlang...</option>
                  {% for org in organizations %}
                    <option
                      value="{{ org.id }}"
                      data-contract="{{ org.contract|default:'' }}"
                      {% if selected_org == org.id|stringformat:"s" %}selected{% endif %}
                    >{{ org.name }}</option>
                  {% endfor %}
                </select>
              </div>

              <div class="col-12">
                <label for="region" class="form-label">Hududlar :</label>
                <select id="region" name="region" class="form-select" required>
                  {% if has_full_region %}
                    <option value="">Tanlang...</option>
                  {% endif %}
                  {% for reg in regions %}
                    <option value="{{ reg.id }}"
                      {% if selected_region == reg.id|stringformat:"s" %}selected{% endif %}
                    >{{ reg.name }}</option>
                  {% endfor %}
                </select>
              </div>

              <div class="col-12">
                <label for="department" class="form-label">Departament :</label>
                <select id="department" name="department" class="form-select">
                  <option value="">Avval tashkilot va hududni tanlang</option>
                  {% for dep in departments %}
                    <option value="{{ dep.id }}"
                      {% if selected_dep == dep.id|stringformat:"s" %}selected{% endif %}
                    >{{ dep.name }}</option>
                  {% endfor %}
                </select>
              </div>

              <div class="col-md-12">
                <label for="rim_id" class="form-label">Chorak:</label>
                <select id="rim_id" name="rim_id" class="form-select" required>
                  <option value="">Tanlang...</option>
                  <option value="I">I</option>
                  <option value="II">II</option>
                  <option value="III">III</option>
                  <option value="IV">IV</option>
                </select>
              </div>

              <div class="text-center">
                <button type="button" id="btnSearch" class="btn btn-primary w-100">
                  Qidirish
                </button>
              </div>

              <div class="text-center">
                <button type="button" id="btnDownloadPdf" class="btn btn-secondary w-100">
                  <i class="bi bi-download"></i> PDF yuklab olish
                </button>
              </div>

            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-body">
            <h5 class="card-title">Imzolashga yuborish</h5>
            <div class="row g-3">

              <div class="col-12">
                <label for="sender" class="form-label">Xizmat ko'rsatuvchining vakili</label>
                <select id="sender" name="sender" class="form-select" required>
                  <option value="">Tanlang...</option>
                  {% for emp in emp_bos_sender %}
                    <option value="{{ emp.id }}">{{ emp.full_name }}</option>
                  {% endfor %}
                </select>
              </div>

              <div class="col-12">
                <label for="receiver" class="form-label">Tashkilot vakili:</label>
                <select id="receiver" name="receiver" class="form-select" required>
                  <option value="">Tanlang...</option>
                  {% for emp in emp_bos %}
                    <option value="{{ emp.id }}">{{ emp.full_name }}</option>
                  {% endfor %}
                </select>
              </div>

              <div class="col-12">
                <label for="agreements" class="form-label">Kelishuvchilar :</label>
                <select id="agreements" name="agreements[]" class="form-select" multiple>
                  {% for emp in employee %}
                    <option value="{{ emp.id }}">{{ emp.full_name }}</option>
                  {% endfor %}
                </select>
              </div>

              <div class="col-12">
                <label for="message" class="form-label">Izox :</label>
                <textarea class="form-control" id="message" name="message"
                          rows="4" placeholder="Izoh yozing..."></textarea>
              </div>

              <div class="text-center">
                <button type="submit" class="btn btn-primary w-100"
                  onclick="return confirm('Imzolashga yuborishni tasdiqlang?')">
                  Imzolashga yuborish
                </button>
              </div>

            </div>
          </div>
        </div>

      </div><!-- /col-lg-4 -->

      <!-- ══════════════════ O'NG PANEL — EDITOR ══════════════════ -->
      <div class="col-lg-8">
        <div class="card">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-center">
              <h5 class="card-title mb-0">TinyMCE Editor</h5>
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="editBodyToggle">
                <label class="form-check-label" for="editBodyToggle">Qo'lda tahrirlash</label>
              </div>
            </div>

            <textarea id="body" name="body" class="tinymce-editor">
             <div style="font-size:10pt;">
              <!-- ─── 1-SAHIFA: DALOLATNOMA ─── -->
              <div style="text-align:center;"><b>DALOLATNOMA</b></div>

              <div style="text-align:right;">
                <span id="doc_date">__.__.____  y</span>
              </div>

              <div style="text-align:justify;">&nbsp; &nbsp; &nbsp; &nbsp;
                Biz quyida imzo chekuvchilar, O'zbekiston Respublikasi
                <span class="org_id">___</span>
                <span id="dep_id">___</span> boshlig'i
                <b class="receiver_name">__</b>,
                va O'zbekiston Respublikasi Iqtisodiyot va moliya vazirligi
                huzuridagi Axborot texnologiyalari markazi direktori
                <b class="sender_name">__</b>:
                O'zbekiston Respublikasi <span class="org_id">___</span> hamda
                O'zbekiston Respublikasi Iqtisodiyot va moliya vazirligi
                huzuridagi Axborot texnologiyalari markazlari tomonidan
                <b><span id="date_contract">___</span>ga asosan</b>
                <span id="dep_id2">___</span> bo'yicha
                2026 yil <span id="chorak">__</span> chorak uchun quyidagi
                ishlar va xizmatlar bajarildi.
                Ishlar texnologik xaritaga muvofiq amalga oshirildi.
              </div>

              <div></div>

              <div style="text-align:left;">
                <b>1. Kompyuter va boshqa elektron qurilmalarga texnik va
                tizimli xizmat ko'rsatish:</b>
              </div>

              <div></div>

              <!-- ✅ DINAMIK: JS orqali to'ldiriladi -->
              <div id="liable_page1"></div>

              <div></div>

              <!-- Imzo jadvali -->
              <div>
                <table style="border-collapse:collapse;width:100%;">
                  <colgroup>
                    <col style="width:50%;"><col style="width:50%;">
                  </colgroup>
                  <tbody>
                    <tr>
                      <td style="border:1px solid #fff;text-align:center;">
                        <b>O'zbekiston Respublikasi Iqtisodiyot va moliya vazirligi
                        <span class="dep_name_text">___</span> boshlig'i</b><br><br>
                        <b class="receiver_name">__</b>
                      </td>
                      <td style="border:1px solid #fff;text-align:center;">
                        <b>O'zbekiston Respublikasi Iqtisodiyot va moliya vazirligi
                        huzuridagi ATM direktori</b><br><br>
                        <b class="sender_name">__</b>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>

              <div style="page-break-after:always;"></div>

              <!-- ─── 2-SAHIFA: TEXNIKALAR JADVALI ─── -->
              <div style="text-align:center;">
                <b>DALOLATNOMA</b><br>
              </div>

              <div style="text-align:right;">
                <span id="doc_date2">__.__.____  y</span>
              </div>

              <div style="text-align:center;">
                <b>Kompyuter va printer texnikalariga tizimli va texnik xizmat
                ko'rsatishni amalga oshirish hisoboti</b>
              </div>

              <div style="text-align:center;">
                <b><u class="dep_name">_</u></b><br>
                <span>(boshqarma nomi)</span>
              </div>

              <div style="text-align:left;">
                <b>Xizmat ko'rsatilayotgan texnikalarning rusumi va seriya raqami:</b>
              </div>

              <!-- ✅ DINAMIK: JS orqali to'ldiriladi. SKIP qilingan
                   (hide_page2=true) shartnomalar bu yerda CHIQMAYDI. -->
              <div id="liable_page2"></div>
             </div>
            </textarea>
          </div>
        </div>
      </div><!-- /col-lg-8 -->

    </form>
  </section>
</main>

<script>
(function () {
  if (!window.jQuery) { console.error("jQuery yuklanmagan!"); return; }

  $(function () {
    // ── Qo'lda tahrirlash checkbox — TinyMCE'ni standart holatda
    // faqat-o'qish (readonly) rejimida ushlab turadi, avtomatik
    // to'ldirilgan matnni tasodifan o'zgartirib qo'ymaslik uchun.
    // Checkbox belgilansa — tahrirlash ochiladi (design rejimi).
    (function () {
      const toggle = document.getElementById("editBodyToggle");
      if (!toggle) return;

      function applyEditMode() {
        const ed = getEditor();
        if (!ed) return;
        try {
          ed.mode.set(toggle.checked ? "design" : "readonly");
        } catch (e) {
          if (typeof ed.setMode === "function") {
            ed.setMode(toggle.checked ? "design" : "readonly");
          }
        }
      }

      toggle.addEventListener("change", applyEditMode);

      const waitEditor = setInterval(function () {
        const ed = getEditor();
        if (ed) {
          clearInterval(waitEditor);
          applyEditMode();
        }
      }, 300);
    })();


    // ══════════════════════════════════════════════════════
    // HELPERS
    // ══════════════════════════════════════════════════════

    function esc(s) {
      if (s === null || s === undefined) return '';
      return String(s)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function safeInitSelect2() {
      if (typeof window.initSelect2 === "function") {
        window.initSelect2(document); return;
      }
      if (!$.fn.select2) return;
      $('#organization,#region,#department,#rim_id,#sender,#receiver,#agreements').each(function () {
        const $el = $(this);
        if ($el.data('select2')) return;
        $el.select2({
          width: '100%', placeholder: 'Tanlang...',
          allowClear: true, closeOnSelect: !$el.prop('multiple')
        });
      });
    }
    safeInitSelect2();

    // Agar #region da faqat bitta variant bo'lsa (to'liq hudud ruxsati
    // yo'q holatida), uni avtomatik tanlab qo'yamiz — foydalanuvchi
    // qo'lda tanlashi shart emas.
    if ($('#region option').length === 1) {
      $('#region').val($('#region option').first().val()).trigger('change.select2');
    }

    // ══════════════════════════════════════════════════════
    // EDITOR UTILITIES
    // ══════════════════════════════════════════════════════

    function getEditor() {
      if (!window.tinymce) return null;
      const ed = tinymce.get('body');
      if (!ed) return null;
      try { if (!ed.getBody()) return null; } catch (e) { return null; }
      return ed;
    }

    function setInEditor(selector, text) {
      const ed = getEditor(); if (!ed) return false;
      try {
        const el = ed.getBody().querySelector(selector);
        if (!el) return false;
        el.textContent = text; ed.nodeChanged(); return true;
      } catch (e) { return false; }
    }

    function setAllInEditor(selector, text) {
      const ed = getEditor(); if (!ed) return false;
      try {
        ed.getBody().querySelectorAll(selector)
          .forEach(function (el) { el.textContent = text; });
        ed.nodeChanged(); return true;
      } catch (e) { return false; }
    }

    function waitEditorReady(callback) {
      let tries = 0;
      const timer = setInterval(function () {
        tries++;
        const ed = getEditor();
        if (ed || tries > 100) {
          clearInterval(timer);
          if (ed && typeof callback === 'function') callback();
        }
      }, 150);
    }

    // ══════════════════════════════════════════════════════
    // EDITOR — MATN SINXRONIZATSIYASI
    // ══════════════════════════════════════════════════════

    function todayStr() {
      const n = new Date();
      return `${String(n.getDate()).padStart(2,'0')}.${String(n.getMonth()+1).padStart(2,'0')}.${n.getFullYear()} y`;
    }

    function applyTodayDate()         { setAllInEditor('#doc_date, #doc_date2', todayStr()); }
    function applyChorakToEditor(q)   { setInEditor('#chorak', q || ''); }
    function applyContractToEditor(t) { setInEditor('#date_contract', t || "Shartnoma ma'lumoti kiritilmagan"); }

    function applyDepToEditor(depText, orgText) {
      const orgFinal = (orgText && orgText !== 'Tanlang...') ? orgText : '___';
      setAllInEditor('.org_id', orgFinal);

      const depFinal = (depText && depText !== 'Tanlang...') ? depText : '___';
      setInEditor('#dep_id',           depFinal);
      setInEditor('#dep_id2',          depFinal);
      setAllInEditor('.dep_name_text', depFinal);
      setAllInEditor('.dep_name',      depFinal);
    }

    function applySenderToEditor() {
      let t = $('#sender option:selected').text() || '';
      if (!t || t === 'Tanlang...') t = '__';
      setAllInEditor('.sender_name', t);
    }

    function applyReceiverToEditor() {
      let t = $('#receiver option:selected').attr('data-fullname') || '';
      if (!t || t === 'Tanlang...') t = '__';
      setAllInEditor('.receiver_name', t);
    }

    function syncEditorTexts() {
      const orgText = $('#organization option:selected').text() || '';
      const depText = $('#department option:selected').text()   || '';
      applyTodayDate();
      applyDepToEditor(depText, orgText);
      applyChorakToEditor($('#rim_id').val() || '');
      applyContractToEditor($('#organization option:selected').attr('data-contract') || '');
      applySenderToEditor();
      applyReceiverToEditor();
    }

    // ══════════════════════════════════════════════════════
    // AJAX — DEPARTAMENTLAR, RECEIVER, AGREEMENTS
    // ══════════════════════════════════════════════════════

    // Bo'limlar ro'yxati endi TASHKILOT va HUDUD ikkalasiga qarab yuklanadi
    // — faqat ikkalasi ham tanlanganda AJAX so'rov yuboriladi.
    function loadDepartments(orgId, regionId, selectedDepId, onSuccess) {
      const $dep = $('#department'), $rcv = $('#receiver'), $agr = $('#agreements');
      $dep.html('<option value="">Yuklanmoqda...</option>').trigger('change');
      $rcv.html('<option value="">Tanlang...</option>').trigger('change');
      $agr.html('').trigger('change');

      if (!orgId || !regionId) {
        $dep.html('<option value="">Avval tashkilot va hududni tanlang</option>').trigger('change');
        return;
      }

      $.ajax({
        url: "{% url 'ajax_load_departments' %}", method: "GET", dataType: "json",
        data: { organization: orgId, region: regionId },
        success: function (data) {
          const list = Array.isArray(data) ? data : (data.departments || data.results || []);
          let opts = '<option value="">Tanlang...</option>';
          list.forEach(function (dep) {
            const sel = selectedDepId && String(selectedDepId) === String(dep.id) ? 'selected' : '';
            opts += `<option value="${dep.id}" ${sel}>${esc(dep.name)}</option>`;
          });
          $dep.html(opts).trigger('change');
          safeInitSelect2();
          if (typeof onSuccess === 'function') onSuccess();
        },
        error: function (xhr) {
          console.error('Departments AJAX:', xhr.status);
          $dep.html('<option value="">Xatolik</option>').trigger('change');
        }
      });
    }

    function fillEmployeeSelect($sel, list, selectedId, allowEmpty, keepSelected) {
      let current = keepSelected ? ($sel.val() || []).map(String) : [];
      let html = allowEmpty ? '<option value="">Tanlang...</option>' : '';
      (list || []).forEach(function (emp) {
        const id    = String(emp.id);
        const fn    = emp.full_name || '';
        const rank  = emp.rank || '';
        const label = rank ? `${fn} (${rank})` : fn;
        const sel   = (selectedId && String(selectedId) === id) || current.includes(id);
        html += `<option value="${esc(emp.id)}" ${sel ? 'selected' : ''}
                  data-fullname="${esc(fn)}" data-rank="${esc(rank)}">${esc(label)}</option>`;
      });
      $sel.html(html).trigger('change');
      safeInitSelect2();
    }

    function loadReceiverByDepartment(depId, selectedId) {
      const $rcv  = $('#receiver');
      const orgId = $('#organization').val();
      $rcv.html('<option value="">Yuklanmoqda...</option>').trigger('change');
      if (!orgId && !depId) {
        $rcv.html('<option value="">Tanlang...</option>').trigger('change');
        applyReceiverToEditor(); return;
      }
      const payload = {};
      if (orgId) payload.organization = orgId;
      if (depId) payload.department   = depId;
      $.ajax({
        url: "{% url 'ajax_dep_signatory' %}", method: "GET", dataType: "json", data: payload,
        success: function (list) { fillEmployeeSelect($rcv, list, selectedId, true, false); applyReceiverToEditor(); },
        error:   function ()     { $rcv.html('<option value="">Xatolik</option>').trigger('change'); applyReceiverToEditor(); }
      });
    }

    function loadAgreementsByDepartment(depId, selectedIds) {
      const $agr  = $('#agreements');
      const orgId = $('#organization').val();
      $agr.html('').trigger('change');
      if (!orgId && !depId) return;
      const payload = {};
      if (orgId) payload.organization = orgId;
      if (depId) payload.department   = depId;
      $.ajax({
        url: "{% url 'ajax_dep_negotiator' %}", method: "GET", dataType: "json", data: payload,
        success: function (list) {
          fillEmployeeSelect($agr, list, null, false, true);
          if (selectedIds && selectedIds.length) $agr.val(selectedIds.map(String)).trigger('change');
        },
        error: function () { $agr.html('').trigger('change'); }
      });
    }

    // Tashkilot va hudud ikkalasi ham tanlanganida bo'limlarni yuklaydi,
    // aks holda bo'lim/kelishuvchi/imzolovchi ro'yxatlarini tozalaydi.
    function tryLoadDepartments() {
      const orgId = $('#organization').val();
      const regionId = $('#region').val();

      if (orgId && regionId) {
        loadDepartments(orgId, regionId, null, function () {
          const depId = $('#department').val();
          loadReceiverByDepartment(depId);
          loadAgreementsByDepartment(depId);
        });
      } else {
        $('#department').html('<option value="">Avval tashkilot va hududni tanlang</option>').trigger('change');
        $('#receiver').html('<option value="">Tanlang...</option>').trigger('change');
        $('#agreements').html('').trigger('change');
      }
    }

    // ══════════════════════════════════════════════════════
    // TEXNIKALAR — JADVAL VA BLOK QURILISHI
    // ══════════════════════════════════════════════════════

    function buildRows(contract) {
      const isPC    = (contract.contract_id === 1);
      const colspan = isPC ? 4 : 3;

      let html = '<tr>';
      html += '<td style="border:1px solid #000;font-size:10pt;text-align:center;">№</td>';
      html += '<td style="border:1px solid #000;font-size:10pt;text-align:center;">Rusumi</td>';
      if (isPC) {
        html += '<td style="border:1px solid #000;font-size:10pt;text-align:center;">Kompyuter SR</td>';
        html += '<td style="border:1px solid #000;font-size:10pt;text-align:center;">Monitor SR</td>';
      } else {
        html += '<td style="border:1px solid #000;font-size:10pt;text-align:center;">Seriya raqami</td>';
      }
      html += '</tr>';

      if (!contract.items || !contract.items.length) {
        html += `<tr><td colspan="${colspan}"
          style="border:1px solid #000;text-align:center;color:#777;">
          Ma'lumot topilmadi</td></tr>`;
        return html;
      }

      contract.items.forEach(function (x, i) {
        html += '<tr>';
        html += `<td style="border:1px solid #000;text-align:center;">${i + 1}</td>`;
        html += `<td style="border:1px solid #000;">${esc(x.name)}</td>`;

        if (isPC) {
          html += `<td style="border:1px solid #000;">${esc(x.serial)}</td>`;

          const monitorsHtml = (x.extra_serials || []).map(function (s) {
            const parts = s.split('\n');
            return `<div>${parts.map(function(p){ return esc(p); }).join('<br>')}</div>`;
          }).join('');
          html += `<td style="border:1px solid #000;">${monitorsHtml || ''}</td>`;

        } else {
          html += `<td style="border:1px solid #000;">${esc(x.serial)}</td>`;
        }

        html += '</tr>';
      });

      return html;
    }

    // 1-sahifadagi bitta shartnoma bloki (soni bilan) — HAR DOIM chiqadi,
    // SKIP qilingan (hide_page2=true) shartnomalar ham shu yerda ko'rinadi.
    function buildBlock1(contract) {
      const cid = contract.contract_id;
      return `<div id="block1_c${cid}" style="text-align:left;">
        <b>
          <span>${esc(contract.contract_name)}</span>
          <span id="count_c${cid}">${contract.count}</span> dona.
        </b>
      </div>`;
    }

    // 2-sahifadagi bitta shartnoma bloki (jadval bilan) — faqat
    // hide_page2 = false bo'lganlar uchun chaqiriladi (chaqiruv joyida tekshiriladi).
    function buildBlock2(contract) {
      const cid  = contract.contract_id;
      const isPC = (cid === 1);
      const rows = buildRows(contract);

      let colgroup;
      if (isPC) {
        colgroup = `<col style="width:8%;"><col style="width:30%;">
                    <col style="width:31%;"><col style="width:31%;">`;
      } else {
        colgroup = `<col style="width:8%;"><col style="width:46%;"><col style="width:46%;">`;
      }

      return `<div id="block2_c${cid}">
        <div style="text-align:left;">
          <b>${esc(contract.contract_name)}</b>
        </div>
        <div>
          <table style="border-collapse:collapse;width:100%;" border="1">
            <colgroup>${colgroup}</colgroup>
            <tbody id="tbody_c${cid}">${rows}</tbody>
          </table>
        </div><br>
      </div>`;
    }

    // ══════════════════════════════════════════════════════
    // TEXNIKALAR — AJAX VA EDITOR GA DINAMIK YOZISH
    // ══════════════════════════════════════════════════════

    function loadTechnicsToEditor(depId) {
      const orgId = $('#organization').val();
      const regionId = $('#region').val();
      syncEditorTexts();

      const edCheck = getEditor();
      const p1Check = edCheck ? edCheck.getBody().querySelector('#liable_page1') : null;
      const p2Check = edCheck ? edCheck.getBody().querySelector('#liable_page2') : null;

      if (!orgId && !depId) {
        if (p1Check) p1Check.innerHTML = '';
        if (p2Check) p2Check.innerHTML = '';
        if (edCheck) edCheck.nodeChanged();
        return;
      }

      const payload = {};
      if (orgId) payload.organization = orgId;
      if (depId) payload.department   = depId;
      if (regionId) payload.region    = regionId;

      $.ajax({
        url: "{% url 'ajax_document_preview' %}",
        method: "GET",
        dataType: "json",
        data: payload,
        success: function (res) {
          const contracts = res.contracts || {};
          const ed = getEditor();
          if (!ed) return;

          const p1 = ed.getBody().querySelector('#liable_page1');
          const p2 = ed.getBody().querySelector('#liable_page2');
          if (!p1 || !p2) return;

          // contract_id bo'yicha o'sish tartibida saralaymiz
          const sortedContracts = Object.values(contracts).sort(function (a, b) {
            return a.contract_id - b.contract_id;
          });

          let html1 = '';
          let html2 = '';

          sortedContracts.forEach(function (contract) {
            // 1-sahifa — HAMMASI chiqadi (SKIP qilinganlar ham, nomi bilan)
            html1 += buildBlock1(contract);

            // 2-sahifa — faqat hide_page2 belgilanmagan shartnomalar chiqadi
            if (!contract.hide_page2) {
              html2 += buildBlock2(contract);
            }
          });

          // Har safar qidiruvda to'liq qayta quramiz (eski holat qolib ketmasin)
          p1.innerHTML = html1;
          p2.innerHTML = html2;

          ed.nodeChanged();
        },
        error: function (xhr) {
          let msg = "Xatolik yuz berdi";
          try {
            if (xhr.responseJSON && xhr.responseJSON.error) msg = xhr.responseJSON.error;
          } catch (e) {}
          console.error('ajax_document_preview xatosi:', msg);
        }
      });
    }

    // ══════════════════════════════════════════════════════
    // PDF YUKLAB OLISH
    // ══════════════════════════════════════════════════════

    function downloadCurrentEditorAsPdf() {
      const ed = getEditor();
      if (!ed) {
        alert("Hujjat hali tayyor emas, birozdan so'ng qayta urinib ko'ring.");
        return;
      }

      ed.save(); // TinyMCE joriy HTML kontentini textarea#body ga yozadi
      const rawBody = $('#body').val() || '';

      if (!rawBody.trim()) {
        alert('Hujjat matni bo\'sh — avval "Qidirish" tugmasini bosing.');
        return;
      }

      const $btn = $('#btnDownloadPdf');
      const originalHtml = $btn.html();
      $btn.prop('disabled', true).text('Tayyorlanmoqda...');

      const csrfToken = $('form input[name="csrfmiddlewaretoken"]').val();

      fetch("{% url 'download_pdf' %}", {
        method: 'POST',
        headers: {
          'X-CSRFToken': csrfToken,
          'X-Requested-With': 'XMLHttpRequest',
        },
        body: new URLSearchParams({
          body_html: rawBody,
          orientation: 'Portrait',
          filename: 'dalolatnoma',
        }),
      })
        .then(function (response) {
          const contentType = response.headers.get('content-type') || '';

          if (!response.ok) {
            if (contentType.includes('application/json')) {
              return response.json().then(function (data) {
                throw new Error(data.error || 'PDF yuklab olishda xatolik');
              });
            }
            return response.text().then(function (text) {
              console.error('Server javobi (HTML/text):', text.substring(0, 500));
              throw new Error(`Server xatoligi: ${response.status} ${response.statusText}`);
            });
          }

          if (!contentType.includes('application/pdf')) {
            return response.text().then(function (text) {
              console.error('Kutilmagan javob turi:', contentType, text.substring(0, 500));
              throw new Error('Server PDF o\'rniga boshqa formatda javob qaytardi');
            });
          }

          return response.blob();
        })
        .then(function (blob) {
          const url = window.URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `dalolatnoma_${Date.now()}.pdf`;
          document.body.appendChild(a);
          a.click();
          a.remove();
          window.URL.revokeObjectURL(url);
        })
        .catch(function (err) {
          console.error(err);
          alert(err.message || 'PDF yuklab olishda xatolik yuz berdi');
        })
        .finally(function () {
          $btn.prop('disabled', false).html(originalHtml);
        });
    }

    // ══════════════════════════════════════════════════════
    // EVENTLAR
    // ══════════════════════════════════════════════════════

    $('#organization').on('change', function () {
      syncEditorTexts();
      tryLoadDepartments();
    });

    $('#region').on('change', function () {
      syncEditorTexts();
      tryLoadDepartments();
    });

    $('#department').on('change', function () {
      const depId = $(this).val();
      syncEditorTexts();
      loadReceiverByDepartment(depId);
      loadAgreementsByDepartment(depId);
    });

    $('#rim_id').on('change', syncEditorTexts);
    $('#sender').on('change', applySenderToEditor);
    $('#receiver').on('change', applyReceiverToEditor);

    $('#btnSearch').on('click', function (e) {
      e.preventDefault();
      loadTechnicsToEditor($('#department').val());
    });

    $('#btnDownloadPdf').on('click', function (e) {
      e.preventDefault();
      downloadCurrentEditorAsPdf();
    });

    // ── FORM SUBMIT: body ni Base64 qilib yuboramiz (WAF/firewall'ni chetlab o'tish uchun) ──

    $('form').on('submit', function (e) {
      e.preventDefault();

      const $form = $(this);

      // Tugma bir necha marta bosilishi (shoshilib bosish) tufayli
      // forma bir necha marta yuborilib, bir xil hujjat qayta-qayta
      // yaratilib qolishining oldini olish uchun qulflash.
      if ($form.data("locked")) {
        return false;
      }
      $form.data("locked", true);
      $form.find('button[type="submit"]').prop("disabled", true);

      const ed = getEditor();
      if (ed) ed.save(); // TinyMCE joriy HTML kontentini textarea#body ga yozadi

      const rawBody = $('#body').val() || '';

      // UTF-8 (o'zbekcha/kirilcha belgilar) uchun xavfsiz Base64 kodlash
      const encoded = btoa(unescape(encodeURIComponent(rawBody)));

      // yashirin maydonga joylaymiz
      let $hidden = $(this).find('input[name="body_encoded"]');
      if ($hidden.length === 0) {
        $hidden = $('<input type="hidden" name="body_encoded">').appendTo(this);
      }
      $hidden.val(encoded);

      // asl 'body' maydonini yuborilishdan chiqarib tashlaymiz
      $('#body').removeAttr('name');

      // haqiqiy (native) yuborish
      this.submit();
    });

    // ══════════════════════════════════════════════════════
    // BOSHLANG'ICH YUKLASH
    // ══════════════════════════════════════════════════════

    const initialOrg    = '{{ selected_org|default:"" }}';
    const initialDep    = '{{ selected_dep|default:"" }}';
    const initialRegion = '{{ selected_region|default:"" }}';

    if (initialOrg) {
      $('#organization').val(initialOrg);
    }
    if (initialRegion) {
      $('#region').val(initialRegion);
    }

    if (initialOrg && $('#region').val()) {
      loadDepartments(initialOrg, $('#region').val(), initialDep, function () {
        if (initialDep) {
          $('#department').val(initialDep).trigger('change');
          loadReceiverByDepartment(initialDep);
          loadAgreementsByDepartment(initialDep);
        }
        waitEditorReady(function () { syncEditorTexts(); });
      });
    } else {
      waitEditorReady(function () { syncEditorTexts(); });
    }

  });
})();
</script>
