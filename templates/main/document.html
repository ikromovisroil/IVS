{% extends 'base.html' %}
{% load static %}

{% block title %}

{% block css %}

{% block content %}

<main id="main" class="main">

  <div class="pagetitle">
    <h1>Dalolatnoma</h1>

  <section class="section">
    <form class="row" action="{% url 'document_post' %}" method="post">{% csrf_token %}

      <div class="col-lg-4">

          <div class="card">
            <div class="card-body">
              <h5 class="card-title">Filtrlash</h5>

              <div class="row g-3">
                <div class="col-12">

                  <select id="organization" name="organization" class="form-select" required>

                    {% for org in organizations %}

                    {% endfor %}

                </div>

                <div class="col-12">
                  <label for="department" class="form-label">Departament :</label>

                    <option value="">Tanlang...</option>
                    {% for dep in departments %}
                      <option value="{{ dep.id }}" {% if selected_dep == dep.id|stringformat:"s" %}selected{% endif %}>
                        {{ dep.name }}
                      </option>
                    {% endfor %}
                  </select>
                </div>

                <div class="col-md-12">

            </div>
          </div>

          <div class="card">
            <div class="card-body">

              <div class="row g-3">

                  <select id="sender" name="sender" class="form-select" required>
                    <option value="">Tanlang...</option>
                    {% for emp in emp_bos %}
                      <option value="{{ emp.id }}">{{ emp.full_name }}</option>
                    {% endfor %}
                  </select>
                </div>

                <div class="col-12">
                  <label for="receiver" class="form-label">Tashkilot vakili:</label>
                  <select id="receiver" name="receiver" class="form-select">
                    <option value="">Tanlang...</option>
                    {% for emp in emp_bos %}
                      <option value="{{ emp.id }}">{{ emp.full_name }}</option>
                    {% endfor %}
                  </select>
                </div>

                <div class="col-12">
                  <label for="agreements" class="form-label">Kelishuvchilar :</label>
                  <select id="agreements" name="agreements[]" class="form-select" multiple>
                    {% for emp in deedconsent %}
                      <option value="{{ emp.id }}">{{ emp.full_name }}</option>
                    {% endfor %}
                  </select>
                </div>

                <div class="col-12">
                  <label for="message" class="form-label">Izox :</label>
                  <textarea class="form-control" name="message" rows="4" placeholder="Izoh yozing..."></textarea>
                </div>

                <div class="text-center">
                  <button type="submit" class="btn btn-primary w-100">Imzolashga yuborish</button>
                </div>

              </div>
            </div>
          </div>

      </div>

      <div class="col-lg-8">
          <div class="card">
            <div class="card-body">
              <h5 class="card-title">TinyMCE Editor</h5>

              <textarea id="body" name="body" class="tinymce-editor">
                <div style="text-align:center;">
                  <b>DALOLATNOMA</b>
                </div>
                <div style="text-align:right;">
                  <span id="doc_date">12.02.2026 y</span>
                </div>
                <div style="text-align: justify;">
                  <span>

                  Davlat byudjeti siyosati departamenti direktori <b>Sh.Muxamedov</b>, va O‘zbekiston Respublikasi Iqtisodiyot
                  va moliya vazirligi huzuridagi Axborot texnologiyalari markazi direktori vazifasini vaqtincha bajaruvchi
                  <b>F.Xujamqulov</b>: O‘zbekiston Respublikasi Iqtisodiyot va moliya vazirligi hamda O‘zbekiston Respublikasi
                  Iqtisodiyot va moliya vazirligi huzuridagi Axborot texnologiyalari markazlari tomonidan <b>2025 yil 4-martda
                  tuzilgan 1-sonli</b> shartnomaga asosan Davlat byudjeti siyosati departamenti bo‘yicha 2025 yil I chorak uchun
                  quyidagi ishlar va xizmatlar bajarildi. Ishlar texnologik xaritaga muvofiq amalga oshirildi.
                  </span>
                </div>

                  <b>1. Kompyuter va boshqa elektron qurilmalarga texnik va tizimli xizmat ko‘rsatish:</b>
                </div>
                <div></div>
                <div style="text-align:left;">
                  <span><b>1.1.</b> Biriktirilgan kompyuterlarga xizmat ko‘rsatish – 52</span>
                </div>
                <div style="text-align:left;">
                  <span><b>1.4.</b> A3 formatli printerlarga xizmat ko‘rsatish – 2 dona.</span>
                </div>
                <div></div>
                <div>
                  <table style="border-collapse:collapse;width:100%;">
                    <colgroup>
                      <col style="width:50%;">
                      <col style="width:50%;">
                    </colgroup>
                    <tbody>
                      <tr>
                        <td style="border:1px solid #fff;text-align:center;">
                          <b>O‘zbekiston Respublikasi Iqtisodiyot va moliya vazirligi Davlat byudjeti siyosati departamenti</b><br><br>
                          <b>Sh.Muxamedov</b>

                        <td style="border:1px solid #fff;text-align:center;">
                          <b>O‘zbekiston Respublikasi Iqtisodiyot va moliya vazirligi huzuridagi ATM direktori v.v.b.</b><br><br>
                          <b>F.Xujamqulov</b>
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>

                <div style="page-break-after: always;"></div>

                <div style="text-align:right;">
                  <span id="doc_date">12.02.2026 y</span>
                </div>
                <div style="text-align:center;">
                  <b>Kompyuter va printer texnikalariga tizimli va texnik xizmat ko‘rsatishni amalga oshirish hisoboti</b>
                </div>
                <div style="text-align:center;">
                  <b>DALOLATNOMA</b></br>
                  <span style="text-align:center;font-size:8pt;">(boshqarma nomi)</span>
                </div>
                <div style="text-align:center;">
                  <b>Biz, <u>Tankoz E.E. bosh mutaxassis, Jumayev U.O. 2-toifali mutaxassis</u></b></br>
                  <span style="text-align:center;font-size:8pt;">(F.I.Sh.) (lavozimi)</span>
                </div>
                <div style="text-align:left;">
                  <b>Xizmat ko‘rsatilyotgan texnikalarni rusumi seriya raqami:</b>
                </div>
                <div style="text-align:left;">
                  <b>Kompyuterlar (PC/Noutbuk/Planshet/Info-kiosk)</b>
                </div>
                <div>
                  <table style="border-collapse:collapse;width:100%;" border="1">
                    <colgroup>
                      <col style="width:10%;">
                      <col style="width:30%;">
                      <col style="width:30%;">
                      <col style="width:30%;">
                    </colgroup>
                    <tbody id="materials_tbody">
                      <tr>
                        <td style="border:1px solid #000;font-size:12pt;text-align:center;">№</td>
                        <td style="border:1px solid #000;font-size:12pt;text-align:center;">Rusumi</td>
                        <td style="border:1px solid #000;font-size:12pt;text-align:center;">Kompyuter SR:</td>
                        <td style="border:1px solid #000;font-size:12pt;text-align:center;">Inventar raqami:</td>
                      </tr>
                    </tbody>
                  </table>
                </div></br>
                <div style="text-align:left;">
                  <b>Printerlar (A4/A3/Skanner)</b>
                </div>
                <div>
                  <table style="border-collapse:collapse;width:100%;" border="1">
                    <colgroup>
                      <col style="width:20%;">
                      <col style="width:40%;">
                      <col style="width:40%;">
                    </colgroup>
                    <tbody id="materials_tbody">
                      <tr>
                        <td style="border:1px solid #000;font-size:12pt;text-align:center;">№</td>
                        <td style="border:1px solid #000;font-size:12pt;text-align:center;">Rusumi</td>
                        <td style="border:1px solid #000;font-size:12pt;text-align:center;">Kompyuter SR:</td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </textarea>

            </div>
          </div>

        </div>

    </form>
  </section>

</main>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script>
$(function () {

  // ----------------- Select2 init -----------------
  function initSelect2All() {
    $('select').each(function () {
      const $el = $(this);
      if ($el.data('select2')) return;
      $el.select2({ width: '100%', placeholder: 'Tanlang...', allowClear: true });
    });
  }
  initSelect2All();

  // ----------------- HTML escape -----------------
  function esc(s){
    return String(s ?? '').replace(/[&<>"']/g, (m) => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
    }[m]));
  }

  // ----------------- Fill tables -----------------
  function fillPcTable(items){
    const $tb = $('#pc_tbody');
    if (!items || !items.length){
      $tb.html(`<tr><td colspan="4" class="text-center text-muted">Ma'lumot topilmadi</td></tr>`);
      return;
    }
    let html = '';
    items.forEach((x, i) => {
      html += `
        <tr>
          <td>${i+1}</td>
          <td>${esc(x.name)}</td>
          <td>${esc(x.serial)}</td>
          <td>${esc(x.inventory)}</td>
        </tr>`;
    });
    $tb.html(html);
  }

  function fillPrTable(items){
    const $tb = $('#pr_tbody');
    if (!items || !items.length){
      $tb.html(`<tr><td colspan="3" class="text-center text-muted">Ma'lumot topilmadi</td></tr>`);
      return;
    }
    let html = '';
    items.forEach((x, i) => {
      html += `
        <tr>
          <td>${i+1}</td>
          <td>${esc(x.name)}</td>
          <td>${esc(x.serial)}</td>
        </tr>`;
    });
    $tb.html(html);
  }

  // ----------------- Org -> Dep AJAX -----------------
  function loadDepartmentsByOrg(orgId, selectedDepId=null){
    const $dep = $('#department');
    $dep.html('<option value="">Yuklanmoqda...</option>').trigger('change');

    if (!orgId){
      $dep.html('<option value="">Tanlang...</option>').trigger('change');
      return;
    }

    $.ajax({
      url: "{% url 'ajax_load_departments' %}",
      method: "GET",
      dataType: "json",
      data: { organization: orgId },
      success: function(deps){
        let opt = '<option value="">Tanlang...</option>';
        (deps || []).forEach(d => {
          const sel = (selectedDepId && String(d.id) === String(selectedDepId)) ? 'selected' : '';
          opt += `<option value="${d.id}" ${sel}>${esc(d.name)}</option>`;
        });
        $dep.html(opt).trigger('change');
      },
      error: function(){
        $dep.html('<option value="">Xatolik (dep yuklanmadi)</option>').trigger('change');
      }
    });
  }

  // ----------------- Dep -> Sender + Agreements AJAX -----------------
  function loadSenderByDep(depId){
    const $sender = $('#sender');
    $sender.html('<option value="">Yuklanmoqda...</option>').trigger('change');

    if(!depId){
      $sender.html('<option value="">Tanlang...</option>').trigger('change');
      return;
    }

    $.ajax({
      url: "{% url 'ajax_dep_signatory' %}",
      method: "GET",
      dataType: "json",
      data: { department: depId },
      success: function(list){
        let opt = '<option value="">Tanlang...</option>';
        (list || []).forEach(emp => {
          opt += `<option value="${emp.id}">${esc(emp.full_name)}</option>`;
        });
        $sender.html(opt).trigger('change');
      },
      error: function(xhr){
        console.log("sender ajax error:", xhr.status, xhr.responseText);
        $sender.html('<option value="">Xatolik</option>').trigger('change');
      }
    });
  }

  function loadAgreementsByDep(depId){
    const $agr = $('#agreements');
    $agr.html('').trigger('change');

    if(!depId){
      $agr.html('').trigger('change');
      return;
    }

    $.ajax({
      url: "{% url 'ajax_dep_negotiator' %}",
      method: "GET",
      dataType: "json",
      data: { department: depId },
      success: function(list){
        let opt = '';
        (list || []).forEach(emp => {
          opt += `<option value="${emp.id}">${esc(emp.full_name)}</option>`;
        });
        $agr.html(opt).trigger('change');
      },
      error: function(xhr){
        console.log("agreements ajax error:", xhr.status, xhr.responseText);
        $agr.html('').trigger('change');
      }
    });
  }

  // ----------------- Eventlar -----------------
  $('#organization').on('change', function(){
    const orgId = $(this).val();
    loadDepartmentsByOrg(orgId);

    // org o‘zgarsa sender/agreements tozalansin
    $('#sender').html('<option value="">Tanlang...</option>').trigger('change');
    $('#agreements').html('').trigger('change');
  });

  $('#department').on('change', function(){
    const depId = $(this).val();
    loadSenderByDep(depId);
    loadAgreementsByDep(depId);
  });

  // ----------------- Preview -----------------
  $('#btnSearch').on('click', function () {
    const depId = $('#department').val();
    if (!depId){
      alert("Departmentni tanlang!");
      return;
    }

    $('#pc_tbody').html(`<tr><td colspan="4" class="text-center text-muted">Yuklanmoqda...</td></tr>`);
    $('#pr_tbody').html(`<tr><td colspan="3" class="text-center text-muted">Yuklanmoqda...</td></tr>`);

    $.ajax({
      url: "{% url 'ajax_document_preview' %}",
      method: "GET",
      dataType: "json",
      data: { department: depId },
      success: function (res) {
        $('#selekt_id_text_1').text(res.department_name || '');
        $('#selekt_id_text_2').text(res.department_name || '');

        $('#techkomp').text(res.komp_count ?? 0);
        $('#techpr').text((res.prin_count ?? 0) + " dona.");

        fillPcTable(res.kompyuterlar || []);
        fillPrTable(res.printerlar || []);
      },
      error: function (xhr) {
        let msg = "Xatolik yuz berdi";
        try { if (xhr.responseJSON && xhr.responseJSON.error) msg = xhr.responseJSON.error; } catch(e){}
        $('#pc_tbody').html(`<tr><td colspan="4" class="text-center text-danger">${esc(msg)}</td></tr>`);
        $('#pr_tbody').html(`<tr><td colspan="3" class="text-center text-danger">${esc(msg)}</td></tr>`);
      }
    });
  });

  // ----------------- Restore -----------------
  const initialOrg = '{{ selected_org|default:"" }}';
  const initialDep = '{{ selected_dep|default:"" }}';

  if (initialOrg){
    $('#organization').val(initialOrg).trigger('change');
    loadDepartmentsByOrg(initialOrg, initialDep);

    if (initialDep){
      setTimeout(function(){
        $('#department').val(initialDep).trigger('change');
        loadSenderByDep(initialDep);
        loadAgreementsByDep(initialDep);
      }, 250);
    }
  }

});
</script>
<script>
  (function () {
    const now = new Date();
    const dd = String(now.getDate()).padStart(2, '0');
    const mm = String(now.getMonth() + 1).padStart(2, '0');
    const yyyy = now.getFullYear();
    document.getElementById('doc_date').textContent = `${dd}.${mm}.${yyyy}`;
    document.getElementById('doc_date2').textContent = `${dd}.${mm}.${yyyy}`;
  })();
</script>
{% endblock content %}
