{% extends 'base.html' %}
{% load static %}

{% block title %}
    <title>Hisobot</title>
{% endblock title %}

{% block css %}{% endblock css %}

{% block content %}
<main id="main" class="main">

  <div class="pagetitle">
    <h1>Dalolatnoma</h1>
  </div>

  <section class="section">
    <form class="row" action="{% url 'document_post' %}" method="post">
      {% csrf_token %}

      <!-- ══════════════════ CHAP PANEL ══════════════════ -->
      <div class="col-lg-4">

        <div class="card">
          <div class="card-body">
            <h5 class="card-title">Filtrlash</h5>
            <div class="row g-3">

              <div class="col-12">
                <label for="organization" class="form-label">Tashkilot :</label>
                <select id="organization" name="organization" class="form-select" required>
                  <option value="">Tanlang...</option>
                  {% for org in organizations %}
                    <option
                      value="{{ org.id }}"
                      data-contract="{{ org.contract|default:'' }}"
                      {% if selected_org == org.id|stringformat:"s" %}selected{% endif %}
                    >{{ org.name }}</option>
                  {% endfor %}
                </select>
              </div>

              <div class="col-12">
                <label for="department" class="form-label">Departament :</label>
                <select id="department" name="department" class="form-select">
                  <option value="">Tanlang...</option>
                  {% for dep in departments %}
                    <option value="{{ dep.id }}"
                      {% if selected_dep == dep.id|stringformat:"s" %}selected{% endif %}
                    >{{ dep.name }}</option>
                  {% endfor %}
                </select>
              </div>

              <div class="col-md-12">
                <label for="rim_id" class="form-label">Chorak:</label>
                <select id="rim_id" name="rim_id" class="form-select" required>
                  <option value="">Tanlang...</option>
                  <option value="I">I</option>
                  <option value="II">II</option>
                  <option value="III">III</option>
                  <option value="IV">IV</option>
                </select>
              </div>

              <div class="text-center">
                <button type="button" id="btnSearch" class="btn btn-primary w-100">
                  Qidirish
                </button>
              </div>

            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-body">
            <h5 class="card-title">Imzolashga yuborish</h5>
            <div class="row g-3">

              <div class="col-12">
                <label for="sender" class="form-label">Xizmat ko'rsatuvchining vakili</label>
                <select id="sender" name="sender" class="form-select" required>
                  <option value="">Tanlang...</option>
                  {% for emp in emp_bos_sender %}
                    <option value="{{ emp.id }}">{{ emp.full_name }}</option>
                  {% endfor %}
                </select>
              </div>

              <div class="col-12">
                <label for="receiver" class="form-label">Tashkilot vakili:</label>
                <select id="receiver" name="receiver" class="form-select" required>
                  <option value="">Tanlang...</option>
                  {% for emp in emp_bos %}
                    <option value="{{ emp.id }}">{{ emp.full_name }}</option>
                  {% endfor %}
                </select>
              </div>

              <div class="col-12">
                <label for="agreements" class="form-label">Kelishuvchilar :</label>
                <select id="agreements" name="agreements[]" class="form-select" multiple>
                  {% for emp in employee %}
                    <option value="{{ emp.id }}">{{ emp.full_name }}</option>
                  {% endfor %}
                </select>
              </div>

              <div class="col-12">
                <label for="message" class="form-label">Izox :</label>
                <textarea class="form-control" id="message" name="message"
                          rows="4" placeholder="Izoh yozing..."></textarea>
              </div>

              <div class="text-center">
                <button type="submit" class="btn btn-primary w-100"
                  onclick="return confirm('Imzolashga yuborishni tasdiqlang?')">
                  Imzolashga yuborish
                </button>
              </div>

            </div>
          </div>
        </div>

      </div><!-- /col-lg-4 -->

      <!-- ══════════════════ O'NG PANEL — EDITOR ══════════════════ -->
      <div class="col-lg-8">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">TinyMCE Editor</h5>

            <textarea id="body" name="body" class="tinymce-editor">

              <!-- ─── 1-SAHIFA: DALOLATNOMA ─── -->
              <div style="text-align:center;"><b>DALOLATNOMA</b></div>

              <div style="text-align:right;">
                <span id="doc_date">__.__.____  y</span>
              </div>

              <div style="text-align:justify;">&nbsp; &nbsp; &nbsp; &nbsp;
                Biz quyida imzo chekuvchilar, O'zbekiston Respublikasi
                <span class="org_id">___</span>
                <span id="dep_id">___</span> boshlig'i
                <b class="receiver_name">__</b>,
                va O'zbekiston Respublikasi Iqtisodiyot va moliya vazirligi
                huzuridagi Axborot texnologiyalari markazi direktori
                <b class="sender_name">__</b>:
                O'zbekiston Respublikasi <span class="org_id">___</span> hamda
                O'zbekiston Respublikasi Iqtisodiyot va moliya vazirligi
                huzuridagi Axborot texnologiyalari markazlari tomonidan
                <b><span id="date_contract">___</span>ga asosan</b>
                <span id="dep_id2">___</span> bo'yicha
                2026 yil <span id="chorak">__</span> chorak uchun quyidagi
                ishlar va xizmatlar bajarildi.
                Ishlar texnologik xaritaga muvofiq amalga oshirildi.
              </div>

              <div></div>

              <div style="text-align:left;">
                <b>1. Kompyuter va boshqa elektron qurilmalarga texnik va
                tizimli xizmat ko'rsatish:</b>
              </div>

              <div></div>

              {% for l in liable %}
                <div style="text-align:left;">
                  <b>
                    <span>{{ l.contract.name }}</span>
                    <span id="count_c{{ l.contract.id }}">_</span> dona.
                  </b>
                </div>
              {% endfor %}

              <div></div>

              <!-- Imzo jadvali -->
              <div>
                <table style="border-collapse:collapse;width:100%;">
                  <colgroup>
                    <col style="width:50%;"><col style="width:50%;">
                  </colgroup>
                  <tbody>
                    <tr>
                      <td style="border:1px solid #fff;text-align:center;">
                        <b>O'zbekiston Respublikasi Iqtisodiyot va moliya vazirligi
                        <span class="dep_name_text">___</span> boshlig'i</b><br><br>
                        <b class="receiver_name">__</b>
                      </td>
                      <td style="border:1px solid #fff;text-align:center;">
                        <b>O'zbekiston Respublikasi Iqtisodiyot va moliya vazirligi
                        huzuridagi ATM direktori</b><br><br>
                        <b class="sender_name">__</b>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>

              <div style="page-break-after:always;"></div>

              <!-- ─── 2-SAHIFA: TEXNIKALAR JADVALI ─── -->
              <div style="text-align:center;">
                <b>DALOLATNOMA</b><br>
              </div>

              <div style="text-align:right;">
                <span id="doc_date2">__.__.____  y</span>
              </div>

              <div style="text-align:center;">
                <b>Kompyuter va printer texnikalariga tizimli va texnik xizmat
                ko'rsatishni amalga oshirish hisoboti</b>
              </div>

              <div style="text-align:center;">
                <b><u class="dep_name">_</u></b><br>
                <span style="font-size:8pt;">(boshqarma nomi)</span>
              </div>

              <div style="text-align:left;">
                <b>Xizmat ko'rsatilayotgan texnikalarning rusumi va seriya raqami:</b>
              </div>

              {% for l in liable %}
                <div style="text-align:left;">
                  <b>{{ l.contract.name }}</b>
                </div>

                {% if l.contract.id == 1 %}
                  <div>
                    <table style="border-collapse:collapse;width:100%;" border="1">
                      <colgroup>
                        <col style="width:8%;">
                        <col style="width:30%;">
                        <col style="width:31%;">
                        <col style="width:31%;">
                      </colgroup>
                      <tbody id="tbody_c{{ l.contract.id }}">
                        <tr>
                          <td style="border:1px solid #000;font-size:12pt;text-align:center;">№</td>
                          <td style="border:1px solid #000;font-size:12pt;text-align:center;">Rusumi</td>
                          <td style="border:1px solid #000;font-size:12pt;text-align:center;">Kompyuter SR</td>
                          <td style="border:1px solid #000;font-size:12pt;text-align:center;">Monitor SR</td>
                        </tr>
                      </tbody>
                    </table>
                  </div><br>
                {% else %}
                  <div>
                    <table style="border-collapse:collapse;width:100%;" border="1">
                      <colgroup>
                        <col style="width:8%;">
                        <col style="width:46%;">
                        <col style="width:46%;">
                      </colgroup>
                      <tbody id="tbody_c{{ l.contract.id }}">
                        <tr>
                          <td style="border:1px solid #000;font-size:12pt;text-align:center;">№</td>
                          <td style="border:1px solid #000;font-size:12pt;text-align:center;">Rusumi</td>
                          <td style="border:1px solid #000;font-size:12pt;text-align:center;">Seriya raqami</td>
                        </tr>
                      </tbody>
                    </table>
                  </div><br>
                {% endif %}
              {% endfor %}

            </textarea>
          </div>
        </div>
      </div><!-- /col-lg-8 -->

    </form>
  </section>
</main>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script>
(function () {
  if (!window.jQuery) { console.error("jQuery yuklanmagan!"); return; }

  $(function () {

    // ══════════════════════════════════════════════════════
    // HELPERS
    // ══════════════════════════════════════════════════════

    function esc(s) {
      if (s === null || s === undefined) return '';
      return String(s)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function safeInitSelect2() {
      if (typeof window.initSelect2 === "function") {
        window.initSelect2(document); return;
      }
      if (!$.fn.select2) return;
      $('#organization,#department,#rim_id,#sender,#receiver,#agreements').each(function () {
        const $el = $(this);
        if ($el.data('select2')) return;
        $el.select2({
          width: '100%', placeholder: 'Tanlang...',
          allowClear: true, closeOnSelect: !$el.prop('multiple')
        });
      });
    }
    safeInitSelect2();

    // ══════════════════════════════════════════════════════
    // EDITOR UTILITIES
    // ══════════════════════════════════════════════════════

    function getEditor() {
      if (!window.tinymce) return null;
      const ed = tinymce.get('body');
      if (!ed) return null;
      try { if (!ed.getBody()) return null; } catch (e) { return null; }
      return ed;
    }

    function setInEditor(selector, text) {
      const ed = getEditor(); if (!ed) return false;
      try {
        const el = ed.getBody().querySelector(selector);
        if (!el) return false;
        el.textContent = text; ed.nodeChanged(); return true;
      } catch (e) { return false; }
    }

    function setAllInEditor(selector, text) {
      const ed = getEditor(); if (!ed) return false;
      try {
        ed.getBody().querySelectorAll(selector)
          .forEach(function (el) { el.textContent = text; });
        ed.nodeChanged(); return true;
      } catch (e) { return false; }
    }

    function setTbodyHtml(tbodyId, html) {
      const ed = getEditor(); if (!ed) return false;
      try {
        const tb = ed.getBody().querySelector('#' + tbodyId);
        if (!tb) return false;
        tb.innerHTML = html; ed.nodeChanged(); return true;
      } catch (e) { return false; }
    }

    function waitEditorReady(callback) {
      let tries = 0;
      const timer = setInterval(function () {
        tries++;
        const ed = getEditor();
        if (ed || tries > 100) {
          clearInterval(timer);
          if (ed && typeof callback === 'function') callback();
        }
      }, 150);
    }

    // ══════════════════════════════════════════════════════
    // EDITOR — MATN SINXRONIZATSIYASI
    // ══════════════════════════════════════════════════════

    function todayStr() {
      const n = new Date();
      return `${String(n.getDate()).padStart(2,'0')}.${String(n.getMonth()+1).padStart(2,'0')}.${n.getFullYear()} y`;
    }

    function applyTodayDate()         { setAllInEditor('#doc_date, #doc_date2', todayStr()); }
    function applyOrgToEditor(t)      { setAllInEditor('.org_id', t || 'Tashkilot'); }
    function applyChorakToEditor(q)   { setInEditor('#chorak', q || ''); }
    function applyContractToEditor(t) { setInEditor('#date_contract', t || "Shartnoma ma'lumoti kiritilmagan"); }

    function applyDepToEditor(depText, orgText) {
      const final = (depText && depText !== 'Tanlang...')
        ? depText
        : (orgText && orgText !== 'Tanlang...' ? orgText : '___');
      setInEditor('#dep_id',           final);
      setInEditor('#dep_id2',          final);
      setAllInEditor('.dep_name_text', final);
      setAllInEditor('.dep_name',      final);
    }

    function applySenderToEditor() {
      let t = $('#sender option:selected').text() || '';
      if (!t || t === 'Tanlang...') t = '__';
      setAllInEditor('.sender_name', t);
    }

    function applyReceiverToEditor() {
      let t = $('#receiver option:selected').attr('data-fullname') || '';
      if (!t || t === 'Tanlang...') t = '__';
      setAllInEditor('.receiver_name', t);
    }

    function syncEditorTexts() {
      const orgText = $('#organization option:selected').text() || '';
      const depText = $('#department option:selected').text()   || '';
      applyTodayDate();
      applyOrgToEditor(orgText);
      applyDepToEditor(depText, orgText);
      applyChorakToEditor($('#rim_id').val() || '');
      applyContractToEditor($('#organization option:selected').attr('data-contract') || '');
      applySenderToEditor();
      applyReceiverToEditor();
    }

    // ══════════════════════════════════════════════════════
    // AJAX — DEPARTAMENTLAR, RECEIVER, AGREEMENTS
    // ══════════════════════════════════════════════════════

    const userRegion = "{{ request.user.employee.region_id|default:'' }}";

    function loadDepartments(orgId, selectedDepId, onSuccess) {
      const $dep = $('#department'), $rcv = $('#receiver'), $agr = $('#agreements');
      $dep.html('<option value="">Yuklanmoqda...</option>').trigger('change');
      $rcv.html('<option value="">Tanlang...</option>').trigger('change');
      $agr.html('').trigger('change');

      if (!orgId) {
        $dep.html('<option value="">Tanlang...</option>').trigger('change');
        return;
      }

      $.ajax({
        url: "{% url 'ajax_load_departments' %}", method: "GET", dataType: "json",
        data: { organization: orgId, region: userRegion },
        success: function (data) {
          const list = Array.isArray(data) ? data : (data.departments || data.results || []);
          let opts = '<option value="">Tanlang...</option>';
          list.forEach(function (dep) {
            const sel = selectedDepId && String(selectedDepId) === String(dep.id) ? 'selected' : '';
            opts += `<option value="${dep.id}" ${sel}>${esc(dep.name)}</option>`;
          });
          $dep.html(opts).trigger('change');
          safeInitSelect2();
          if (typeof onSuccess === 'function') onSuccess();
        },
        error: function (xhr) {
          console.error('Departments AJAX:', xhr.status);
          $dep.html('<option value="">Xatolik</option>').trigger('change');
        }
      });
    }

    function fillEmployeeSelect($sel, list, selectedId, allowEmpty, keepSelected) {
      let current = keepSelected ? ($sel.val() || []).map(String) : [];
      let html = allowEmpty ? '<option value="">Tanlang...</option>' : '';
      (list || []).forEach(function (emp) {
        const id    = String(emp.id);
        const fn    = emp.full_name || '';
        const rank  = emp.rank || '';
        const label = rank ? `${fn} (${rank})` : fn;
        const sel   = (selectedId && String(selectedId) === id) || current.includes(id);
        html += `<option value="${esc(emp.id)}" ${sel ? 'selected' : ''}
                  data-fullname="${esc(fn)}" data-rank="${esc(rank)}">${esc(label)}</option>`;
      });
      $sel.html(html).trigger('change');
      safeInitSelect2();
    }

    function loadReceiverByDepartment(depId, selectedId) {
      const $rcv  = $('#receiver');
      const orgId = $('#organization').val();
      $rcv.html('<option value="">Yuklanmoqda...</option>').trigger('change');
      if (!orgId && !depId) {
        $rcv.html('<option value="">Tanlang...</option>').trigger('change');
        applyReceiverToEditor(); return;
      }
      const payload = {};
      if (orgId) payload.organization = orgId;
      if (depId) payload.department   = depId;
      $.ajax({
        url: "{% url 'ajax_dep_signatory' %}", method: "GET", dataType: "json", data: payload,
        success: function (list) { fillEmployeeSelect($rcv, list, selectedId, true, false); applyReceiverToEditor(); },
        error:   function ()     { $rcv.html('<option value="">Xatolik</option>').trigger('change'); applyReceiverToEditor(); }
      });
    }

    function loadAgreementsByDepartment(depId, selectedIds) {
      const $agr  = $('#agreements');
      const orgId = $('#organization').val();
      $agr.html('').trigger('change');
      if (!orgId && !depId) return;
      const payload = {};
      if (orgId) payload.organization = orgId;
      if (depId) payload.department   = depId;
      $.ajax({
        url: "{% url 'ajax_dep_negotiator' %}", method: "GET", dataType: "json", data: payload,
        success: function (list) {
          fillEmployeeSelect($agr, list, null, false, true);
          if (selectedIds && selectedIds.length) $agr.val(selectedIds.map(String)).trigger('change');
        },
        error: function () { $agr.html('').trigger('change'); }
      });
    }

    // ══════════════════════════════════════════════════════
    // TEXNIKALAR — JADVAL QURILISHI
    // ══════════════════════════════════════════════════════

    function buildRows(contract) {
      const isPC    = (contract.contract_id === 1);
      const colspan = isPC ? 4 : 3;

      let html = '<tr>';
      html += '<td style="border:1px solid #000;font-size:12pt;text-align:center;">№</td>';
      html += '<td style="border:1px solid #000;font-size:12pt;text-align:center;">Rusumi</td>';
      if (isPC) {
        html += '<td style="border:1px solid #000;font-size:12pt;text-align:center;">Kompyuter SR</td>';
        html += '<td style="border:1px solid #000;font-size:12pt;text-align:center;">Monitor SR</td>';
      } else {
        html += '<td style="border:1px solid #000;font-size:12pt;text-align:center;">Seriya raqami</td>';
      }
      html += '</tr>';

      if (!contract.items || !contract.items.length) {
        html += `<tr><td colspan="${colspan}"
          style="border:1px solid #000;text-align:center;color:#777;">
          Ma'lumot topilmadi</td></tr>`;
        return html;
      }

      contract.items.forEach(function (x, i) {
        html += '<tr>';
        html += `<td style="border:1px solid #000;text-align:center;">${i + 1}</td>`;
        html += `<td style="border:1px solid #000;">${esc(x.name)}</td>`;

        if (isPC) {
          html += `<td style="border:1px solid #000;">${esc(x.serial)}</td>`;

          // Monitor nomi va SR — har biri alohida qatorda
          const monitorsHtml = (x.extra_serials || []).map(function (s) {
            const parts = s.split('\n');
            return `<div>${parts.map(function(p){ return esc(p); }).join('<br>')}</div>`;
          }).join('');
          html += `<td style="border:1px solid #000;">${monitorsHtml || ''}</td>`;

        } else {
          html += `<td style="border:1px solid #000;">${esc(x.serial)}</td>`;
        }

        html += '</tr>';
      });

      return html;
    }

    // ══════════════════════════════════════════════════════
    // TEXNIKALAR — AJAX VA EDITOR GA YOZISH
    // ══════════════════════════════════════════════════════

    function loadTechnicsToEditor(depId) {
      const orgId = $('#organization').val();
      syncEditorTexts();

      if (!orgId && !depId) return;

      const payload = {};
      if (orgId) payload.organization = orgId;
      if (depId) payload.department   = depId;

      $.ajax({
        url: "{% url 'ajax_document_preview' %}",
        method: "GET",
        dataType: "json",
        data: payload,
        success: function (res) {
          const contracts = res.contracts || {};
          if (!Object.keys(contracts).length) {
            console.warn("Hech qanday contract ma'lumoti qaytmadi");
            return;
          }
          Object.values(contracts).forEach(function (contract) {
            const cid = String(contract.contract_id);
            setInEditor('#count_c' + cid, String(contract.count));
            setTbodyHtml('tbody_c' + cid, buildRows(contract));
          });
        },
        error: function (xhr) {
          let msg = "Xatolik yuz berdi";
          try {
            if (xhr.responseJSON && xhr.responseJSON.error) msg = xhr.responseJSON.error;
          } catch (e) {}
          console.error('ajax_document_preview xatosi:', msg);
        }
      });
    }

    // ══════════════════════════════════════════════════════
    // EVENTLAR
    // ══════════════════════════════════════════════════════

    $('#organization').on('change', function () {
      syncEditorTexts();
      loadDepartments($(this).val(), null, function () {
        const depId = $('#department').val();
        loadReceiverByDepartment(depId);
        loadAgreementsByDepartment(depId);
      });
    });

    $('#department').on('change', function () {
      const depId = $(this).val();
      syncEditorTexts();
      loadReceiverByDepartment(depId);
      loadAgreementsByDepartment(depId);
    });

    $('#rim_id').on('change', syncEditorTexts);
    $('#sender').on('change', applySenderToEditor);
    $('#receiver').on('change', applyReceiverToEditor);

    $('#btnSearch').on('click', function (e) {
      e.preventDefault();
      loadTechnicsToEditor($('#department').val());
    });

    $('form').on('submit', function () {
      const ed = getEditor();
      if (ed) ed.save();
      return true;
    });

    // ══════════════════════════════════════════════════════
    // BOSHLANG'ICH YUKLASH
    // ══════════════════════════════════════════════════════

    const initialOrg = '{{ selected_org|default:"" }}';
    const initialDep = '{{ selected_dep|default:"" }}';

    if (initialOrg) {
      $('#organization').val(initialOrg);
      loadDepartments(initialOrg, initialDep, function () {
        if (initialDep) {
          $('#department').val(initialDep).trigger('change');
          loadReceiverByDepartment(initialDep);
          loadAgreementsByDepartment(initialDep);
        }
        waitEditorReady(function () { syncEditorTexts(); });
      });
    } else {
      waitEditorReady(function () { syncEditorTexts(); });
    }

  });
})();
</script>
{% endblock content %}

{% block js %}{% endblock js %}
