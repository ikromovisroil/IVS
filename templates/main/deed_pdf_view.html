<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>PDF + QR</title>
  <style>
    body { margin:0; font-family: Arial; }
    .wrap { display:flex; height:100vh; }
    .left { flex:1; overflow:auto; background:#f3f3f3; }
    .right { width:320px; border-left:1px solid #ddd; padding:12px; background:#fff; }
    #pdfContainer { position:relative; width:fit-content; margin:12px auto; }
    canvas { display:block; background:#fff; image-rendering:auto; }

    #qrBox{
      position:absolute; width:120px; height:120px; display:none; cursor:move;
      border:2px dashed #1976d2; background:rgba(25,118,210,0.06);
      align-items:center; justify-content:center; user-select:none;
      touch-action:none; /* pointer drag uchun */
    }
    #qrBox img { width:100%; height:100%; display:block; }

    .btn { width:100%; padding:10px; margin:6px 0; cursor:pointer; }
    .btn-primary { background:#1976d2; color:white; border:none; }
    .btn-success { background:#2e7d32; color:white; border:none; }
    .btn-danger { background:#c62828; color:white; border:none; }
    .btn:disabled { opacity:.5; cursor:not-allowed; }
    select, input { width:100%; padding:8px; margin:6px 0; }
    .warn { color:#c62828; font-weight:bold; }
    .info { font-size:12px; color:#666; }
  </style>
</head>

<body>
{% if error %}
  <div style="padding:20px;color:red">{{ error }}</div>
{% else %}
<div class="wrap">
  <div class="left">
    <div id="pdfContainer">
      <canvas id="pdfCanvas"></canvas>
      <div id="qrBox"><img id="qrImg" alt="QR"></div>
    </div>
  </div>

  <div class="right">
    <h3>QR ({{ role }})</h3>

    {% if qr_locked %}
      <div class="warn">Siz bu hujjatga QR allaqachon qo‘ygansiz (yoki ruxsat yo‘q).</div>
    {% endif %}

    <label>Bet</label>
    <select id="pageSelect"></select>

    <label>QR o‘lcham (px)</label>
    <input id="qrSize" type="number" value="120" min="60" max="400"/>

    <button class="btn btn-primary" id="btnCreate">QR yaratish</button>
    <button class="btn btn-success" id="btnSave">Saqlash</button>
    <button class="btn btn-danger" id="btnHide">Bekor qilish</button>

    <div class="info">QR yarat → PDF ustida drag → Saqlash.</div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
  const pdfUrl   = "{{ pdf_url|escapejs }}";
  const qrLocked = {{ qr_locked|yesno:"true,false" }};
  const nextUrl  = "{{ next_url|default:'/'|escapejs }}";

  // ✅ hack yo‘q
  const stampUrl = "{% url 'deed_stamp_qr' deed_id %}";

  const canvas = document.getElementById("pdfCanvas");
  const ctx = canvas.getContext("2d");
  const pdfContainer = document.getElementById("pdfContainer");

  const qrBox = document.getElementById("qrBox");
  const qrImg = document.getElementById("qrImg");

  const pageSelect = document.getElementById("pageSelect");
  const qrSizeInput = document.getElementById("qrSize");

  const btnCreate = document.getElementById("btnCreate");
  const btnSave = document.getElementById("btnSave");
  const btnHide = document.getElementById("btnHide");

  // ✅ CSRF
  function getCookie(name) {
    const value = `; ${document.cookie}`;
    const parts = value.split(`; ${name}=`);
    if (parts.length === 2) return parts.pop().split(";").shift();
  }
  const csrfToken = getCookie("csrftoken");

  // ✅ boshlang‘ich holat
  btnSave.disabled = true;
  btnHide.disabled = true;

  if (qrLocked) {
    btnCreate.disabled = true;
    btnSave.disabled = true;
    btnHide.disabled = true;
  }

  let pdfDoc = null;
  let currentPage = 1;

  // ✅ tiniq qilish uchun (1.5 ham yetadi, xohlasangiz 2.0 qiling)
  let viewportScale = 1.5;

  let isDragging = false;
  let dragOffsetX = 0;
  let dragOffsetY = 0;

  // QR joylashgan page
  function hasActiveQR() {
    return qrBox.dataset.page && qrBox.style.display !== "none";
  }

  function getQRState() {
      const size = parseInt(qrSizeInput.value || "120", 10);
      const left = parseFloat(qrBox.style.left || "0");
      const top  = parseFloat(qrBox.style.top  || "0");

      // ✅ QR qaysi betda yaratilgan bo‘lsa, o‘sha betga uramiz
      const page = parseInt(qrBox.dataset.page || String(currentPage), 10);

      return { page, x: left, y: top, size, scale: viewportScale };
 }

  // ✅ HiDPI render (xiralik ketadi)
  async function renderPage(pageNum) {
    const page = await pdfDoc.getPage(pageNum);
    const viewport = page.getViewport({ scale: viewportScale });

    const dpr = window.devicePixelRatio || 1;

    canvas.width  = Math.floor(viewport.width * dpr);
    canvas.height = Math.floor(viewport.height * dpr);

    canvas.style.width  = Math.floor(viewport.width) + "px";
    canvas.style.height = Math.floor(viewport.height) + "px";

    pdfContainer.style.width = Math.floor(viewport.width) + "px";

    const transform = dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null;

    await page.render({ canvasContext: ctx, viewport, transform }).promise;

    // QR faqat shu page'da ko‘rinsin
    if (qrBox.dataset.page && parseInt(qrBox.dataset.page, 10) !== pageNum) {
      qrBox.style.display = "none";
    } else if (qrBox.dataset.page) {
      qrBox.style.display = "flex";
    }

    // Agar QR ko‘rinmay qolsa, save'ni o‘chirib qo‘yamiz
    if (!hasActiveQR()) {
      btnSave.disabled = true;
      btnHide.disabled = true;
    }
  }

  async function init() {
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    pdfDoc = await pdfjsLib.getDocument(pdfUrl).promise;

    pageSelect.innerHTML = "";
    for (let i = 1; i <= pdfDoc.numPages; i++) {
      const opt = document.createElement("option");
      opt.value = i;
      opt.textContent = "Bet " + i;
      pageSelect.appendChild(opt);
    }

    pageSelect.value = "1";
    currentPage = 1;
    await renderPage(1);
  }

  pageSelect.addEventListener("change", async (e) => {
      if (hasActiveQR()) {
        alert("Avval QR ni Saqlang yoki Bekor qiling.");
        pageSelect.value = String(currentPage);
        return;
      }
      currentPage = parseInt(e.target.value, 10);
      await renderPage(currentPage);
  });

  btnCreate.addEventListener("click", async () => {
    if (qrLocked) return;

    const size = parseInt(qrSizeInput.value || "120", 10);
    qrBox.style.width = size + "px";
    qrBox.style.height = size + "px";

    const res = await fetch(stampUrl, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-CSRFToken": csrfToken
      },
      credentials: "same-origin",
      body: JSON.stringify({ preview: true, page: currentPage, size })
    });

    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.ok) {
      alert(data.error || "QR preview xato");
      return;
    }

    qrImg.src = data.qr_data_url;

    qrBox.style.left = "40px";
    qrBox.style.top  = "40px";
    qrBox.dataset.page = String(currentPage);
    qrBox.style.display = "flex";

    // ✅ endi saqlash ishlaydi
    btnSave.disabled = false;
    btnHide.disabled = false;
  });

  btnHide.addEventListener("click", () => {
    qrBox.style.display = "none";
    qrBox.dataset.page = "";

    // ✅ yana o‘chadi
    btnSave.disabled = true;
    btnHide.disabled = true;
  });

  // ✅ Drag (pointer events: mobil + desktop)
  qrBox.addEventListener("pointerdown", (e) => {
    if (qrLocked) return;
    if (qrBox.style.display === "none") return;

    e.preventDefault();
    isDragging = true;
    qrBox.setPointerCapture(e.pointerId);

    const rect = qrBox.getBoundingClientRect();
    dragOffsetX = e.clientX - rect.left;
    dragOffsetY = e.clientY - rect.top;
  });

  document.addEventListener("pointermove", (e) => {
    if (!isDragging) return;

    const containerRect = pdfContainer.getBoundingClientRect();
    const x = e.clientX - containerRect.left - dragOffsetX;
    const y = e.clientY - containerRect.top  - dragOffsetY;

    const maxX = parseFloat(canvas.style.width) - qrBox.offsetWidth;
    const maxY = parseFloat(canvas.style.height) - qrBox.offsetHeight;

    qrBox.style.left = Math.max(0, Math.min(x, maxX)) + "px";
    qrBox.style.top  = Math.max(0, Math.min(y, maxY)) + "px";
  });

  document.addEventListener("pointerup", () => { isDragging = false; });

  btnSave.addEventListener("click", async () => {
    if (qrLocked) return;

    if (btnSave.disabled || qrBox.style.display === "none") {
      alert("Avval QR yaratib joylashtiring.");
      return;
    }

    const st = getQRState();

    const res = await fetch(stampUrl, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-CSRFToken": csrfToken
      },
      credentials: "same-origin",
      body: JSON.stringify({
        preview: false,
        page: st.page,
        x: st.x,
        y: st.y,
        size: st.size,
        scale: st.scale,
        redirect_url: nextUrl
      })
    });

    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.ok) {
      alert(data.error || "Saqlash xato");
      return;
    }

    window.location.href = data.redirect_url || nextUrl || "/";
  });

  init();
</script>
{% endif %}
</body>
</html>
