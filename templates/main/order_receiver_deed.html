{% extends 'base.html' %}
{% load static %}

{% block title %}
  <title>Hisobot</title>
{% endblock title %}

{% block css %}
{% endblock css %}

{% block content %}

<main id="main" class="main">

  <div class="pagetitle">
    <h1>Akt</h1>
  </div>

  <section class="section">
    <form class="row" action="{% url 'order_receiver_deed_post' %}" method="post">{% csrf_token %}

      <!-- LEFT: FILTER + SIGN -->
      <div class="col-lg-4">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">Imzolashga yuborish</h5>

            <div class="row g-3">
              <div class="col-12">
                <label for="sender_select" class="form-label">Imzolovchi xodim:</label>
                <select id="sender_select" name="sender" class="form-select" required>
                  <option value="">Tanlang...</option>
                  {% for i in employees %}
                    <option value="{{ i.id }}" data-rank="{{ i.rank.name }}">{{ i.full_name }}</option>
                  {% endfor %}
                </select>
              </div>

              <div class="col-12">
                <label for="message" class="form-label">Izoh:</label>
                <textarea id="message" class="form-control" name="message" rows="4" placeholder="Izoh yozing..."></textarea>
              </div>

              <input name="order" value="{{order.id}}" hidden="">

              <div class="text-center">
                <button type="submit" class="btn btn-primary w-100"
                onclick="return confirm('Imzolashga yuborishni tasdiqlang?')">
                    Imzolashga yuborish
                </button>
              </div>
            </div>

          </div>
        </div>
      </div>

      <!-- RIGHT: TINYMCE -->
      <div class="col-lg-8">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">TinyMCE Editor</h5>

            <textarea id="body" name="body" class="tinymce-editor">
              <div style="text-align:center;">
                <b>Sarf materiallari, ehtiyot qismlar va uskunalarni o‘rnatish ishlari haqida</b>
              </div>
              <div style="text-align:center;">
                <b>DALOLATNOMA № {{ order.id }}</b>
              </div>
              <!-- FIX: sana endi serverda render qilinadi - JS/TinyMCE
                   ishga tushishi shart emas, sahifa yuklanganda darhol
                   to'g'ri ko'rinadi -->
              <div style="text-align:right;">
                <u>{{ today|date:"d.m.Y" }} y</u>
              </div>

              <div style="text-align:center;">
                Biz, quyida imzo chekuvchilar, O‘zbekiston Respublikasi Iqtisodiyot va Moliya vazirligi huzuridagi
                “Axborot texnologiyalari markazi” davlat unitar korxonasining vakillari:
              </div>

              <div style="text-align:center;">
                <b><u>{{ order.receiver.full_name }} ({{ order.receiver.rank.name }})</u></b>
              </div>
              <div style="text-align:center;font-size:8pt;">
                (F.I.Sh., ATM mutaxassisining lavozimi)
              </div>

              <div>
                <table style="border-collapse:collapse;width:100%;">
                  <colgroup>
                    <col style="width:50%;">
                    <col style="width:50%;">
                  </colgroup>
                  <tbody>
                    <tr>
                      <td style="border:1px solid #fff;text-align:center;">
                        <span>O‘zbekiston Respublikasi {{order.sender.organization.name}} tashkiloti vakili:</span><br>
                        <b><u id="sender_name1">__</u></b><br>
                        <span style="text-align:center;font-size:8pt;">(F.I.Sh., lavozimi)</span>
                      </td>
                      <td style="border:1px solid #fff;text-align:center;">
                        <span>{{ order.sender.department.name }}</span><br>
                        <span>ushbu dalolatnoma quyidagi ishlarni bajarilganligi uchun tuzilgan:</span>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>

              <div style="text-align:center;margin-top:12px;">
                <b><u>Quyida ko‘rsatilgan materiallarni o‘rnatish</u></b><br>
                <span style="text-align:center;font-size:8pt;">(ATM mutaxassislari tomonidan bajarilgan ish turlari bo‘yicha tafsilotlar)</span>
              </div>

              <div style="margin-top:10px;">
                <table style="border-collapse:collapse;width:100%;">
                  <colgroup>
                    <col style="width:50%;">
                    <col style="width:50%;">
                  </colgroup>
                  <tbody>
                    <tr>
                      <td style="border:1px solid #fff;text-align:center;">
                        <strong>Iqtisodiyot va Moliya vazirligi huzuridagi ATM tomonidan</strong><br>
                        <strong>quyidagi sarf materiallari, ehtiyot qismlar va uskunalar o‘rnatildi:</strong>
                      </td>
                      <td style="border:1px solid #fff;text-align:center;">
                          <strong>{{ order.sender.organization.contract|default:"_" }}ga muvofiq</strong>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>

              <div>
                <table style="border-collapse:collapse;width:100%;" border="1">
                  <colgroup>
                    <col style="width:3%;">
                    <col style="width:14%;">
                    <col style="width:10%;">
                    <col style="width:22%;">
                    <col style="width:5%;">
                    <col style="width:6%;">
                    <col style="width:14%;">
                    <col style="width:14%;">
                    <col style="width:12%;">
                  </colgroup>

                  <tbody>
                    <tr>
                      <td style="border:1px solid #000;font-size:8pt;text-align:center;" rowspan="2">№</td>
                      <td style="border:1px solid #000;font-size:8pt;text-align:center;" rowspan="2">Ish bajarilgan qurilma nomi</td>
                      <td style="border:1px solid #000;font-size:8pt;text-align:center;" rowspan="2">Qurilma seriya raqami</td>
                      <td style="border:1px solid #000;font-size:8pt;text-align:center;" rowspan="2">Sarf materiallari, ehtiyot qismlar, uskunalar nomi</td>
                      <td style="border:1px solid #000;font-size:8pt;text-align:center;" rowspan="2">Soni</td>
                      <td style="border:1px solid #000;font-size:8pt;text-align:center;" rowspan="2">O‘lchov birligi</td>
                      <td style="border:1px solid #000;font-size:8pt;text-align:center;" colspan="3">
                        Kimga o‘rnatildi yoki o‘rnatilganligini tasdiqlovchi mas’ul shaxs (xarajatlar)
                      </td>
                    </tr>

                    <tr>
                      <td style="border:1px solid #000;font-size:8pt;text-align:center;">F.I.Sh.</td>
                      <td style="border:1px solid #000;font-size:8pt;text-align:center;">Lavozimi</td>
                      <td style="border:1px solid #000;font-size:8pt;text-align:center;">Eslatma*</td>
                    </tr>

                    {% for i in order.materials_all %}
                    <tr>
                      <td style="border:1px solid #000;font-size:8pt;text-align:center;">{{ forloop.counter }}</td>
                      <td style="border:1px solid #000;font-size:8pt;text-align:center;">{{ order.technics.name }}</td>
                      <td style="border:1px solid #000;font-size:8pt;text-align:center;">{{ order.technics.serial }}</td>
                      <td style="border:1px solid #000;font-size:8pt;text-align:center;">{{ i.material.name }}</td>
                      <td style="border:1px solid #000;font-size:8pt;text-align:center;">{{ i.number }}</td>
                      <td style="border:1px solid #000;font-size:8pt;text-align:center;">{{ i.material.unit.name }}</td>
                      <td style="border:1px solid #000;font-size:8pt;text-align:center;">{{ order.sender.full_name }}</td>
                      <td style="border:1px solid #000;font-size:8pt;text-align:center;">{{ order.sender.rank.name }}</td>
                      <td style="border:1px solid #000;font-size:8pt;text-align:center;">{{ i.material.price }}</td>
                    </tr>
                    {% endfor %}
                  </tbody>
                </table>
              </div>

              <div style="text-align:left;">
                <b>Yaroqsiz ehtiyot qismlar foydalanuvchida qoldirildi.</b>
              </div>
              <div style="text-align:left;">
                Izoh: o‘rnatilgan ehtiyot qismlar yoki asbob-uskunalarning birlik narxi buxgalteriya hisobi uchun ko‘rsatiladi.
              </div>

              <div>
                <table style="border-collapse:collapse;width:100%;">
                  <colgroup>
                    <col style="width:50%;">
                    <col style="width:50%;">
                  </colgroup>
                  <tbody>
                    <tr>
                      <td style="border:1px solid #fff;text-align:center;">
                        <b>Xizmat ko‘rsatuvchi vakili:</b><br>
                        <span>{{ order.receiver.full_name }}</span><br>
                        <span style="text-align:center;font-size:8pt;">(F.I.Sh.)</span>
                      </td>
                      <td style="border:1px solid #fff;text-align:center;">
                        <b>O‘zbekiston Respublikasi {{ order.sender.organization.name }} tashkiloti vakili:</b><br>
                        <span id="sender_name2">__</span><br>
                        <span style="text-align:center;font-size:8pt;">(F.I.Sh.)</span>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </textarea>

          </div>
        </div>
      </div>

    </form>
  </section>

</main>

<script>
(function () {

  function getEditorSafe() {
    const ed = window.tinymce?.get?.('body');
    // eng muhim tekshiruv: dom va dom.get bo‘lsin
    if (!ed || !ed.dom || typeof ed.dom.get !== 'function') return null;
    return ed;
  }

  function setInEditor(editor, elementId, text) {
    if (!editor || !editor.dom || typeof editor.dom.get !== 'function') return;

    const el = editor.dom.get(elementId);
    if (el) {
      editor.dom.setHTML(el, text ?? '');
      editor.setDirty(true);
      editor.save();
    }
  }

  function applySenderToDoc(editor) {
    const selected = $('#sender_select option:selected');
    const senderName = (selected.text() || '').trim();
    const senderRank = selected.data('rank');

    if (!senderName || senderName === 'Tanlang...') return;

    const fullText = senderRank ? (senderName + ' (' + senderRank + ')') : senderName;

    setInEditor(editor, 'sender_name1', fullText);
    setInEditor(editor, 'sender_name2', senderName);
  }

  // TinyMCE init bo‘lishini kutamiz (dom ham tayyor bo‘lsin)
  function waitForEditorReady(callback) {
    let tries = 0;
    const timer = setInterval(function () {
      tries++;

      const ed = getEditorSafe();
      if (ed) {
        clearInterval(timer);
        callback(ed);
        return;
      }

      if (tries > 120) {
        clearInterval(timer);
        console.warn("TinyMCE editor topilmadi yoki to‘liq init bo‘lmadi (body).");
      }
    }, 150);
  }

  $(document).ready(function () {

    $('#sender_select').select2({
      width: '100%',
      placeholder: 'Tanlang...',
      allowClear: true
    });

    // FIX: applyTodayDate() olib tashlandi - sana endi shablonda
    // ({{ today|date:"d.m.Y" }}) serverda render qilinadi, JS orqali
    // qo'yish shart emas (avval JS ulgurmasa sana bo'sh qolib ketardi).
    waitForEditorReady(function (editor) {
      applySenderToDoc(editor);

      $('#sender_select').on('change', function () {
        const ed = getEditorSafe();
        if (ed) applySenderToDoc(ed);
      });
    });

    // ── FORM SUBMIT: body ni Base64 qilib yuboramiz (WAF/firewall'ni chetlab o'tish uchun) ──

    $('form').on('submit', function (e) {
      e.preventDefault();

      const ed = getEditorSafe();
      if (ed) ed.save(); // TinyMCE joriy HTML kontentini textarea#body ga yozadi

      const rawBody = $('#body').val() || '';

      // UTF-8 (o'zbekcha/kirilcha belgilar) uchun xavfsiz Base64 kodlash
      const encoded = btoa(unescape(encodeURIComponent(rawBody)));

      // yashirin maydonga joylaymiz
      let $hidden = $(this).find('input[name="body_encoded"]');
      if ($hidden.length === 0) {
        $hidden = $('<input type="hidden" name="body_encoded">').appendTo(this);
      }
      $hidden.val(encoded);

      // asl 'body' maydonini yuborilishdan chiqarib tashlaymiz
      $('#body').removeAttr('name');

      // haqiqiy (native) yuborish
      this.submit();
    });

  });

})();
</script>


{% endblock content %}
