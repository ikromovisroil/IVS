<script>
/* ===================== Helpers ===================== */
function formatNumber(num) {
  if (num === null || num === undefined) return '0';

  // "100 000,50" kabi string bo'lsa ham ishlasin
  let s = String(num).trim();
  if (!s) return '0';
  s = s.replace(/\s+/g, '').replace(',', '.');

  const n = Number(s);
  if (!isFinite(n)) return '0';

  const hasFraction = /[.]\d+/.test(s);
  let [intPart, fracPart] = (hasFraction ? n.toFixed(2) : Math.trunc(n).toString()).split('.');

  const sign = intPart.startsWith('-') ? '-' : '';
  intPart = intPart.replace('-', '');
  intPart = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');

  return hasFraction ? `${sign}${intPart},${fracPart}` : `${sign}${intPart}`;
}

function normalizeOrgName(orgNameRaw){
  const t = (orgNameRaw || '').trim();
  if (!t) return t;

  // faqat "ivs" bo'lsa
  if (t.toLowerCase() === 'Axborot texnologiyalari markazi') {
    return 'Iqtisodiyot va moliya vazirligi huzuridagi Axborot texnologiyalari markazi';
  }
  return t;
}

/* ===================== TinyMCE helpers ===================== */
function editorGet() {
  return (window.tinymce ? tinymce.get('body') : null);
}

function editorSetText(selector, text) {
  const ed = editorGet();
  if (!ed) return false;

  try {
    const node = ed.getBody().querySelector(selector);
    if (node) {
      node.textContent = text;
      ed.nodeChanged();
      return true;
    }
  } catch (e) {
    console.log("editorSetText xatosi:", e);
  }
  return false;
}

function editorSetTbodyRows(rowsHtml) {
  const ed = editorGet();
  if (!ed) return;

  try {
    const body = ed.getBody();
    const tbody = body.querySelector('#materials_tbody');
    if (!tbody) {
      console.log("materials_tbody topilmadi");
      return;
    }

    // ✅ 2 ta header qatorni saqlab qolamiz (sizning jadvalingizda 2 header bor)
    const existingRows = tbody.querySelectorAll('tr');
    let headerHtml = '';

    if (existingRows.length >= 2) {
      headerHtml = existingRows[0].outerHTML + existingRows[1].outerHTML;
    } else {
      headerHtml = tbody.innerHTML; // fallback
    }

    tbody.innerHTML = headerHtml + (rowsHtml || '');
    ed.nodeChanged();
  } catch (e) {
    console.log("editorSetTbodyRows xatosi:", e);
  }
}

/* ===================== Agreements by Org ===================== */
function loadAgreementsByOrg(orgId, selectedIds = []) {
  $('#agreements').html('').trigger('change');
  if (!orgId) return;

  $.ajax({
    url: "{% url 'ajax_agreements_employees' %}",
    method: "GET",
    dataType: "json",
    data: { org_id: orgId },   // ✅ view kutayotgan nom
    success: function (data) {
      let options = '';
      const selectedSet = new Set((selectedIds || []).map(String));

      (data || []).forEach(function(emp) {
        const selected = selectedSet.has(String(emp.id)) ? 'selected' : '';
        options += `<option value="${emp.id}" ${selected}>${emp.full_name}</option>`;
      });

      $('#agreements').html(options).trigger('change');
    },
    error: function () {
      $('#agreements').html('').trigger('change');
    }
  });
}

/* ===================== Main ===================== */
$(function () {

  // Select2
  $('#organization, #sender, #agreements').select2({
    width: '100%',
    placeholder: 'Tanlang...',
    allowClear: true
  });

  // Default date1/date2
  const today = new Date();
  const todayStr = today.toISOString().split('T')[0];
  const monthAgo = new Date();
  monthAgo.setMonth(monthAgo.getMonth() - 1);
  const monthAgoStr = monthAgo.toISOString().split('T')[0];

  if (!$('#date1').val()) $('#date1').val(monthAgoStr);
  if (!$('#date2').val()) $('#date2').val(todayStr);

  // TinyMCE ready wait
  let tinymceReady = false;
  const timer = setInterval(function () {
    if (editorGet()) {
      tinymceReady = true;
      clearInterval(timer);

      // start: org_id yozish
      updateEditorWithSelections();

      // start: org bo'lsa agreements ham yuklansin
      const initialOrgId = $('#organization').val();
      if (initialOrgId) loadAgreementsByOrg(initialOrgId);
    }
  }, 200);

  // Faqat org yozish (sana/oy yo'q!)
  function updateEditorWithSelections() {
    if (!tinymceReady) return;

    const orgNameRaw = $('#organization option:selected').text();
    const orgName = normalizeOrgName(orgNameRaw);

    if (orgName && orgName !== 'Tanlang...') {
      // ✅ REESTR tinymce ichida qaysi id bo'lsa shuni ishlating:
      // siz yozganingiz: #org_id
      editorSetText('#org_id', orgName);

      // agar reestrda 2 joy bo'lsa (masalan #org_id_1 #org_id_2)
      // editorSetText('#org_id_1', orgName);
      // editorSetText('#org_id_2', orgName);
    }
  }

  // Materials search
  function searchMaterials() {
    const orgId = $('#organization').val();
    const date1 = $('#date1').val();
    const date2 = $('#date2').val();

    if (!orgId || !date1 || !date2) {
      alert("Iltimos, tashkilot va sanalarni to'liq tanlang!");
      return;
    }

    updateEditorWithSelections();

    // Loading...
    editorSetTbodyRows(`
      <tr>
        <td colspan="15" style="border:1px solid #000; text-align:center; padding:14px; font-size:10pt;">
          <i>Yuklanmoqda...</i>
        </td>
      </tr>
    `);

    $.ajax({
      url: "{% url 'ajax_reestr_materials' %}",
      method: "GET",
      dataType: "json",
      data: { organization: orgId, date1: date1, date2: date2 },

      success: function (data) {
        if (!Array.isArray(data) || data.length === 0) {
          editorSetTbodyRows(`
            <tr>
              <td colspan="15" style="border:1px solid #000; text-align:center; color:#888; padding:14px; font-size:10pt;">
                Tanlangan sana oralig'ida ma'lumot topilmadi
              </td>
            </tr>
          `);
          return;
        }

        let rows = "";
        let totalSum = 0;
        let index = 1;

        data.forEach(function (item) {
          const quantity = parseFloat(item.number) || 0;
          const price = parseFloat(item.material__price) || 0;
          const sum = parseFloat(item.total_sum) || 0;
          totalSum += sum;

          rows += `
            <tr>
              <td style="border:1px solid #000; font-size:8pt; text-align:center;">${index++}</td>
              <td style="border:1px solid #000; font-size:8pt; text-align:center;">${item.technics_name || ''}</td>
              <td style="border:1px solid #000; font-size:8pt; text-align:center;">${item.technics_serial || ''}</td>
              <td style="border:1px solid #000; font-size:8pt; text-align:center;">${item.material_name || ''}</td>
              <td style="border:1px solid #000; font-size:8pt; text-align:center;">${formatNumber(quantity)}</td>
              <td style="border:1px solid #000; font-size:8pt; text-align:center;">${formatNumber(price)}</td>
              <td style="border:1px solid #000; font-size:8pt; text-align:center;">${formatNumber(sum)}</td>
              <td style="border:1px solid #000; font-size:8pt; text-align:center;">${item.sender || ''}</td>
              <td style="border:1px solid #000; font-size:8pt; text-align:center;">${item.sender_rank || ''}</td>
              <td style="border:1px solid #000; font-size:8pt; text-align:center;">${item.department || ''}</td>
              <td style="border:1px solid #000; font-size:8pt; text-align:center;">${item.receiver || ''}</td>
              <td style="border:1px solid #000; font-size:8pt; text-align:center;">${item.date_finished || ''}</td>
              <td style="border:1px solid #000; font-size:8pt; text-align:center;">${item.order_id || ''}</td>
              <td style="border:1px solid #000; font-size:8pt; text-align:center;">${item.date_creat || ''}</td>
              <td style="border:1px solid #000; font-size:8pt; text-align:center;">${item.material_code || ''}</td>
            </tr>
          `;
        });

        // JAMI
        rows += `
          <tr>
            <td colspan="6" style="border:1px solid #000; font-size:8pt; text-align:right; font-weight:bold;">JAMI:</td>
            <td style="border:1px solid #000; font-size:8pt; text-align:center; font-weight:bold;">${formatNumber(totalSum)}</td>
            <td colspan="8" style="border:1px solid #000;"></td>
          </tr>
        `;

        editorSetTbodyRows(rows);
      },

      error: function (xhr, status, error) {
        console.error("Xatolik:", error);
        console.error("Status:", status);
        console.error("Response:", xhr.responseText);

        let errorMessage = "Xatolik yuz berdi";
        if (xhr.status === 404) errorMessage = "So'rov yo'li topilmadi (404)";
        else if (xhr.status === 500) errorMessage = "Server xatoligi (500)";
        else if (xhr.status === 403) errorMessage = "Ruxsat yo'q (403)";
        else if (xhr.status === 400) errorMessage = "Noto'g'ri so'rov (400)";

        editorSetTbodyRows(`
          <tr>
            <td colspan="15" style="border:1px solid #000; text-align:center; color:red; padding:14px; font-size:10pt;">
              ${errorMessage}. Batafsil: ${xhr.status} ${xhr.statusText}
            </td>
          </tr>
        `);
      }
    });
  }

  /* ===================== Events ===================== */
  $('#organization').on('change', function () {
    updateEditorWithSelections();
    loadAgreementsByOrg($(this).val());
  });

  $('#btnGenerate').on('click', function (e) {
    e.preventDefault();
    searchMaterials();
  });

  // Submit oldidan TinyMCE -> textarea
  $('form').on('submit', function () {
    const ed = editorGet();
    if (ed) ed.save();
    return true;
  });

  /* ===================== Django selected restore ===================== */
  {% if selected_org %}
    $('#organization').val('{{ selected_org }}').trigger('change');
  {% endif %}

  // agar oldin tanlangan agreements bo'lsa:
  // const initialAgreementIds = {{ selected_employees|default:"[]"|safe }};
  // const orgId = $('#organization').val();
  // if (orgId) loadAgreementsByOrg(orgId, initialAgreementIds);

});
</script>
