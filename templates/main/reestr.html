<script>
function formatNumber(num) {
  if (num === null || num === undefined || isNaN(num)) return '0';
  let numStr = num.toString();
  if (numStr.includes('.')) {
    let [intPart, fracPart] = numStr.split('.');
    intPart = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    if (fracPart.length === 1)    fracPart = fracPart + '0';
    else if (fracPart.length > 2) fracPart = fracPart.substring(0, 2);
    return intPart + ',' + fracPart;
  }
  return numStr.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
}

function escapeHtml(value) {
  if (value === null || value === undefined) return '';
  return String(value)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}

function formatMonthYear() {
  const months = [
    'yanvar', 'fevral', 'mart', 'aprel', 'may', 'iyun',
    'iyul', 'avgust', 'sentabr', 'oktabr', 'noyabr', 'dekabr'
  ];
  const d = new Date();
  return `${d.getFullYear()} yil ${months[d.getMonth()]} oyi uchun`;
}

// ─── EDITOR ───────────────────────────────────────────────────────────────────

function editorGet() {
  if (!window.tinymce) return null;
  const ed = tinymce.get('body');
  if (!ed) return null;
  try { if (!ed.getBody()) return null; } catch (e) { return null; }
  return ed;
}

function editorSetText(selector, text) {
  const ed = editorGet();
  if (!ed) return false;
  try {
    const node = ed.getBody().querySelector(selector);
    if (node) { node.textContent = text; ed.nodeChanged(); return true; }
  } catch (e) { console.log('editorSetText xatosi:', e); }
  return false;
}

function editorSetTbodyRows(rowsHtml) {
  const ed = editorGet();
  if (!ed) return;
  try {
    const tbody = ed.getBody().querySelector('#materials_tbody');
    if (!tbody) { console.log('materials_tbody topilmadi'); return; }
    tbody.innerHTML = rowsHtml;
    ed.nodeChanged();
  } catch (e) { console.log('editorSetTbodyRows xatosi:', e); }
}

function editorSetServiceEmployeesRows(rowsHtml) {
  const ed = editorGet();
  if (!ed) return;
  try {
    const tbody = ed.getBody().querySelector('#service_employees_tbody');
    if (!tbody) { console.log('service_employees_tbody topilmadi'); return; }
    tbody.innerHTML = rowsHtml;
    ed.nodeChanged();
  } catch (e) { console.log('editorSetServiceEmployeesRows xatosi:', e); }
}

function waitForTinyMCE(callback, tries = 0) {
  const ed = editorGet();
  if (ed) { callback(); return; }
  if (tries > 50) { console.log('TinyMCE topilmadi'); return; }
  setTimeout(function () { waitForTinyMCE(callback, tries + 1); }, 200);
}

// ─── EDITOR UPDATE ────────────────────────────────────────────────────────────

function updateEditorWithSelections() {
  const $opt         = $('#organization option:selected');

  editorSetText('#org_id',        (orgName && orgName !== 'Tanlang...') ? orgName : 'Tashkilot');
  editorSetText('#date_contract', contractText.trim() ? contractText : '_');
  editorSetText('#report_period', formatMonthYear());
}

// ─── JADVAL QATORINI QURISH ───────────────────────────────────────────────────

function buildMaterialRow(item, index) {
  const quantity = parseFloat(item.number          || 0) || 0;
  const price    = parseFloat(item.material__price || 0) || 0;
  const sum      = parseFloat(item.total_sum        || 0) || 0;

  return `
    <tr>
      <td style="border:1px solid #000;font-size:8pt;text-align:center;">${index}</td>
      <td style="border:1px solid #000;font-size:8pt;text-align:center;">${escapeHtml(item.technics_name   || '')}</td>
      <td style="border:1px solid #000;font-size:8pt;text-align:center;">${escapeHtml(item.technics_serial || '')}</td>
      <td style="border:1px solid #000;font-size:8pt;text-align:center;">${escapeHtml(item.material_name   || '')}</td>
      <td style="border:1px solid #000;font-size:8pt;text-align:center;">${formatNumber(quantity)}</td>
      <td style="border:1px solid #000;font-size:8pt;text-align:center;">${formatNumber(price)}</td>
      <td style="border:1px solid #000;font-size:8pt;text-align:center;">${formatNumber(sum)}</td>
      <td style="border:1px solid #000;font-size:8pt;text-align:center;">${escapeHtml(item.sender        || '')}</td>
      <td style="border:1px solid #000;font-size:8pt;text-align:center;">${escapeHtml(item.sender_rank   || '')}</td>
      <td style="border:1px solid #000;font-size:8pt;text-align:center;">${escapeHtml(item.department    || '')}</td>
      <td style="border:1px solid #000;font-size:8pt;text-align:center;">${escapeHtml(item.receiver      || '')}</td>
      <td style="border:1px solid #000;font-size:8pt;text-align:center;">${escapeHtml(item.date_finished || '')}</td>
      <td style="border:1px solid #000;font-size:8pt;text-align:center;">${escapeHtml(item.order_id      || '')}</td>
      <td style="border:1px solid #000;font-size:8pt;text-align:center;">${escapeHtml(item.date_creat    || '')}</td>
      <td style="border:1px solid #000;font-size:8pt;text-align:center;">${escapeHtml(item.material_code || '')}</td>
    </tr>
  `;
}

function buildGroupHeaderRow(deptName) {
  return `
    <tr>
      <td colspan="15" style="border:1px solid #000;font-size:9pt;text-align:center;font-weight:bold;padding:4px;">
        ${escapeHtml(deptName)}
      </td>
    </tr>
  `;
}

function buildServiceEmployeeRow(rank, fullName) {
  return `
    <tr>
      <td style="border:1px solid #fff;text-align:left;">
        <b>${escapeHtml(rank)}</b><br>
      </td>
      <td style="border:1px solid #fff;text-align:left;">
        <b>${escapeHtml(fullName)}</b><br>
      </td>
    </tr>
  `;
}

function buildGroupTotalRow(label, sum) {
  return `
    <tr>
      <td colspan="6" style="border:1px solid #000;font-size:8pt;text-align:right;font-weight:bold;background-color:rgb(251,238,184);">${escapeHtml(label)}</td>
      <td style="border:1px solid #000;font-size:8pt;text-align:center;font-weight:bold;background-color:rgb(251,238,184);">${formatNumber(sum)}</td>
      <td colspan="8" style="border:1px solid #000;background-color:rgb(251,238,184);"></td>
    </tr>
  `;
}

// ─── AJAX: MATERIALLARNI QIDIRISH ─────────────────────────────────────────────

function searchMaterials() {
  const orgId = $('#organization').val();
  const date1 = $('#date1').val();
  const date2 = $('#date2').val();

  if (!orgId || !date1 || !date2) {
    alert("Iltimos, tashkilot va sanalarni to'liq tanlang!");
    return;
  }

  updateEditorWithSelections();

  editorSetTbodyRows(`
    <tr>
      <td colspan="15" style="border:1px solid #000;text-align:center;padding:14px;font-size:10pt;">
        <i>Yuklanmoqda...</i>
      </td>
    </tr>
  `);

  $.ajax({
    url: "{% url 'ajax_reestr_materials' %}",
    method: 'GET',
    dataType: 'json',
    data: { organization: orgId, date1: date1, date2: date2 },

    success: function (data) {
      if (!Array.isArray(data) || !data.length) {
        editorSetTbodyRows(`
          <tr>
            <td colspan="15" style="border:1px solid #000;text-align:center;color:#888;padding:14px;font-size:10pt;">
              Tanlangan sana oralig'ida ma'lumot topilmadi
            </td>
          </tr>
        `);
        editorSetServiceEmployeesRows('');
        return;
      }

      // ── Bo'lim (boshqarma) bo'yicha guruhlash, birinchi uchragan tartibda ──
      const groups = [];
      const groupIndexByName = {};

      data.forEach(function (item) {
        const deptName = (item.department || '').trim() || "Bo'lim ko'rsatilmagan";
        if (!(deptName in groupIndexByName)) {
          groupIndexByName[deptName] = groups.length;
          groups.push({ name: deptName, items: [] });
        }
        groups[groupIndexByName[deptName]].items.push(item);
      });

      let rows       = '';
      let grandTotal = 0;

      groups.forEach(function (group) {
        rows += buildGroupHeaderRow(group.name);

        let rowIndex = 1;
        let groupSum = 0;

        group.items.forEach(function (item) {
          rows += buildMaterialRow(item, rowIndex++);
          groupSum += parseFloat(item.total_sum || 0) || 0;
        });

        grandTotal += groupSum;
        rows += buildGroupTotalRow(`JAMI BOSHQARMA: ${group.name}`, groupSum);
      });

      // Barcha bo'limlar bo'yicha umumiy jami
      rows += buildGroupTotalRow('JAMI:', grandTotal);

      editorSetTbodyRows(rows);

      // ── Xizmat ko'rsatgan xodimlar (receiver) — har bir xodim faqat 1 marta ──
      // Joriy foydalanuvchi (yuqoridagi statik blokda ko'rsatilgan) takrorlanmasligi uchun
      // uni oldindan "ko'rilgan" ro'yxatga qo'shib qo'yamiz.
      const currentUserFullName = "{{ request.user.employee.full_name|default:''|escapejs }}".trim();
      const seenReceivers = new Set();
      if (currentUserFullName) seenReceivers.add(currentUserFullName);

      let serviceRows = '';

      data.forEach(function (item) {
        const receiverName = (item.receiver || '').trim();
        if (!receiverName || seenReceivers.has(receiverName)) return;
        seenReceivers.add(receiverName);
        serviceRows += buildServiceEmployeeRow(item.receiver_rank || '', receiverName);
      });

      editorSetServiceEmployeesRows(serviceRows);
    },

    error: function (xhr) {
      const msg = {
        404: "So'rov yo'li topilmadi (404)",
        500: "Server xatoligi (500)",
        403: "Ruxsat yo'q (403)",
        400: "Noto'g'ri so'rov (400)",
      }[xhr.status] || "Xatolik yuz berdi";

      editorSetTbodyRows(`
        <tr>
          <td colspan="15" style="border:1px solid #000;text-align:center;color:red;padding:14px;font-size:10pt;">
            ${msg}. Batafsil: ${xhr.status} ${xhr.statusText}
          </td>
        </tr>
      `);
    }
  });
}

// ─── PDF YUKLAB OLISH ──────────────────────────────────────────────────────────

function downloadReestrPdf() {
  const ed = editorGet();
  if (ed) ed.save(); // TinyMCE joriy HTML kontentini textarea#body ga yozadi

  const rawBody = ($('#body').val() || '').trim();

  if (!rawBody) {
    alert('Avval "Qidirish" tugmasini bosib, jadvalni shakllantiring!');
    return;
  }

  // UTF-8 (o'zbekcha/kirilcha belgilar) uchun xavfsiz Base64 kodlash
  const encoded = btoa(unescape(encodeURIComponent(rawBody)));

  const $btn = $('#btnDownloadPdf');
  const originalText = $btn.text();
  $btn.prop('disabled', true).text('Yuklanmoqda...');

  fetch("{% url 'reestr_pdf_download' %}", {
    method: 'POST',
    headers: {
      'X-CSRFToken': $('input[name=csrfmiddlewaretoken]').val(),
    },
    body: new URLSearchParams({ body_encoded: encoded }),
  })
    .then(function (response) {
      if (!response.ok) {
        return response.text().then(function (text) {
          throw new Error(text || `Server xatoligi (${response.status})`);
        });
      }
      return response.blob();
    })
    .then(function (blob) {
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'reestr.pdf';
      document.body.appendChild(a);
      a.click();
      a.remove();
      window.URL.revokeObjectURL(url);
    })
    .catch(function (err) {
      console.error('PDF yuklab olishda xatolik:', err);
      alert('PDF yuklab olishda xatolik yuz berdi: ' + err.message);
    })
    .finally(function () {
      $btn.prop('disabled', false).text(originalText);
    });
}

// ─── JQUERY READY ─────────────────────────────────────────────────────────────

$(function () {
  if ($.fn.select2) {
    $('#organization').select2({
      width: '100%',
      placeholder: 'Tanlang...',
      allowClear: true
    });
  }

  const today    = new Date();
  const monthAgo = new Date();
  monthAgo.setMonth(monthAgo.getMonth() - 1);

  if (!$('#date1').val()) $('#date1').val(monthAgo.toISOString().split('T')[0]);
  if (!$('#date2').val()) $('#date2').val(today.toISOString().split('T')[0]);

  // ─── EVENTS ───────────────────────────────────────────────────────────────

  $('#organization').on('change', function () {
    updateEditorWithSelections();
  });

  $('#btnGenerate').on('click', function (e) {
    e.preventDefault();
    searchMaterials();
  });

  $('#btnDownloadPdf').on('click', function (e) {
    e.preventDefault();
    downloadReestrPdf();
  });

  // ─── INITIAL LOAD ─────────────────────────────────────────────────────────

  const initialOrg = '{{ selected_org|default:"" }}';

  if (initialOrg) {
    $('#organization').val(initialOrg);
  }

  waitForTinyMCE(function () {
    updateEditorWithSelections();
  });

});
</script>
