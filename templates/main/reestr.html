<script>
$(function() {

  // default: oy boshidan bugungacha
  function pad2(n){ return (n<10?'0':'')+n; }
  function setDefaultDates() {
    const now = new Date();
    const first = new Date(now.getFullYear(), now.getMonth(), 1);

    $('#date1').val(`${first.getFullYear()}-${pad2(first.getMonth()+1)}-${pad2(first.getDate())}`);
    $('#date2').val(`${now.getFullYear()}-${pad2(now.getMonth()+1)}-${pad2(now.getDate())}`);
  }
  setDefaultDates();

  $('#btnGenerate').on('click', generateReport);

  // Enter bosilganda ham ishlasin (form ichida)
  $('form input').on('keypress', function(e){
    if(e.which === 13){
      e.preventDefault();
      generateReport();
    }
  });

  function generateReport() {
    const orgId = $('#organization').val();
    const date1 = $('#date1').val();
    const date2 = $('#date2').val();

    if (!orgId || !date1 || !date2) {
      alert("Iltimos, tashkilot va sanalarni to‘ldiring!");
      return;
    }
    if (new Date(date1) > new Date(date2)) {
      alert("Boshlanish sanasi tugash sanasidan keyin bo‘lishi mumkin emas!");
      return;
    }

    $('#resultsBody').html(`
      <tr>
        <td colspan="15" class="text-center">
          <div class="spinner-border text-primary" role="status"></div>
          <div class="mt-2">Hisobot yuklanmoqda...</div>
        </td>
      </tr>
    `);

    $.ajax({
      url: "{% url 'ajax_reestr_materials' %}",
      method: 'GET',
      data: { organization: orgId, date1: date1, date2: date2 },
      success: function(rows) {
        renderTable(rows || []);
      },
      error: function(xhr) {
        $('#resultsBody').html(`
          <tr>
            <td colspan="15" class="text-center text-danger">
              Xatolik: ${xhr.responseJSON?.error || xhr.status}
            </td>
          </tr>
        `);
      }
    });
  }

  function renderTable(rows){
    if(!rows.length){
      $('#resultsBody').html(`
        <tr><td colspan="15" class="text-center text-muted">Ma’lumot topilmadi</td></tr>
      `);
      return;
    }

    let html = "";
    let total = 0;

    rows.forEach((r, idx) => {
      const sum = parseFloat(r.total_sum) || 0;
      total += sum;

      html += `
        <tr>
          <td>${idx + 1}</td>
          <td>${r.technics_name || ""}</td>
          <td>${r.technics_serial || ""}</td>
          <td>${r.material_name || ""}</td>
          <td class="text-end">${r.number ?? ""}</td>
          <td class="text-end">${r.material_price ?? ""}</td>
          <td class="text-end">${r.total_sum ?? ""}</td>

          <!-- Qurilmadan foydalanuvchi -->
          <td>${r.receiver || ""}</td>
          <td>${r.receiver_rank || ""}</td>

          <!-- Tashkilot/bo‘lim -->
          <td>${r.department || ""}</td>

          <!-- Kim tomonidan o‘rnatilgan -->
          <td>${r.sender || ""}</td>

          <!-- O‘rnatish / so‘rov -->
          <td>${r.date_finished || ""}</td>
          <td>${r.order_id || ""}</td>
          <td>${r.date_creat || ""}</td>
          <td>${r.material_code || ""}</td>
        </tr>
      `;
    });

    // JAMI qator
    html += `
      <tr>
        <td colspan="6" class="text-end"><b>JAMI:</b></td>
        <td class="text-end"><b>${total.toLocaleString('uz-UZ')}</b></td>
        <td colspan="8"></td>
      </tr>
    `;

    $('#resultsBody').html(html);
  }

});
</script>

<script>
$(function () {

  function initSelect2All() {
    $('select').each(function () {
      const $el = $(this);
      if ($el.data('select2')) return;

      $el.select2({
        width: '100%',
        placeholder: 'Tanlang...',
        allowClear: true
      });
    });
  }

  initSelect2All();
});
