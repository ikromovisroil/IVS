{% load static %}
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>DOCX Editor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body { height: 100%; margin: 0; }
    #editor { height: 100vh; width: 100vw; }
    .topbar {
      position: fixed; top: 10px; left: 10px; z-index: 9999;
      display: flex; gap: 8px;
      background: rgba(255,255,255,.85);
      padding: 6px 8px;
      border-radius: 10px;
    }
  </style>

  <script src="{{ docserver }}/web-apps/apps/api/documents/api.js"></script>
</head>
<body>

  <div class="topbar">
    <button type="button" onclick="window.history.back()">⬅ Ortga</button>
    <button type="button" id="btnSave">💾 Save</button>
  </div>

  <div id="editor"></div>

  <script>
    window.ONLYOFFICE_CONFIG = {{ config_json|safe }};
    window.ONLYOFFICE_TOKEN = "{{ token }}";
  </script>
  <script src="{% static 'js/docs_integration.js' %}"></script>
</body>
</html>
