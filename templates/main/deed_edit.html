{% extends 'base.html' %}
{% load static %}

{% block title %}
  <title>Hisobot</title>
{% endblock title %}

{% block css %}
{% endblock css %}

{% block content %}

<main id="main" class="main">

  <div class="pagetitle">
    <h1>Tahrirlash</h1>
  </div>

  <section class="section">
    <form class="row" method="post">{% csrf_token %}

      <!-- LEFT -->
      <div class="col-lg-4">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">Tahrirlash</h5>

            <div class="row g-3">

              <!-- SENDER -->
              <div class="col-12">
                <label for="sender" class="form-label">Imzolovchi xodim:</label>
                <select id="sender" name="sender" class="form-select" required>
                  {% for emp in sender %}
                    <option value="{{ emp.id }}" {% if deed.sender_id == emp.id %}selected{% endif %}>
                      {{ emp.last_name }} {{ emp.first_name }} {{ emp.father_name }} ({{emp.rank.name}})
                    </option>
                  {% endfor %}
                </select>
              </div>

              <!-- RECEIVER -->
              {% if receiver %}
              <div class="col-12">
                <label for="receiver" class="form-label">Qabul qiluvchi:</label>
                <select id="receiver" name="receiver" class="form-select" {% if deed.receiver_id %}required{% endif %}>
                  {% for emp in receiver %}
                    <option value="{{ emp.id }}" {% if deed.receiver_id == emp.id %}selected{% endif %}>
                      {{ emp.last_name }} {{ emp.first_name }} {{ emp.father_name }} ({{emp.rank.name}})
                    </option>
                  {% endfor %}
                </select>
              </div>
              {% endif %}

              <!-- AGREEMENTS -->
              <div class="col-12">
                <label for="agreements" class="form-label">Kelishuvchilar:</label>
                <select id="agreements" name="agreements[]" class="form-select" multiple>
                  {% for emp in employee %}
                    <option value="{{ emp.id }}" {% if emp.id in selected_agreement_ids %}selected{% endif %}>
                      {{ emp.last_name }} {{ emp.first_name }} {{ emp.father_name }} ({{emp.rank.name}})
                    </option>
                  {% endfor %}
                </select>
              </div>

              <div class="text-center">
                <button type="submit" class="btn btn-primary w-100"
                onclick="return confirm('Yangilanishlarni saqlashga rozimisiz?')">
                    Saqlash
                </button>
              </div>

            </div>
          </div>
        </div>
      </div>

      <!-- RIGHT: TINYMCE -->
      <div class="col-lg-8">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">TinyMCE Editor</h5>
            <textarea id="body" name="body" class="tinymce-editor">{{ deed.body }}</textarea>
          </div>
        </div>
      </div>

    </form>
  </section>

</main>

<script>
(function () {

  function getEditorSafe() {
    const ed = window.tinymce?.get?.('body');
    if (!ed || !ed.dom || typeof ed.dom.get !== 'function') return null;
    return ed;
  }

  $(document).ready(function () {

    // Tugma bir necha marta bosilishi (shoshilib bosish) tufayli forma
    // bir necha marta yuborilib, bir xil hujjat qayta-qayta tahrirlanib
    // (PDF qayta yaratilib) qolishining oldini olish uchun qulflash.

    $('form').on('submit', function (e) {
      e.preventDefault();

      const $form = $(this);

      if ($form.data("locked")) {
        return false;
      }
      $form.data("locked", true);
      $form.find('button[type="submit"]').prop("disabled", true);

      const ed = getEditorSafe();
      if (ed) ed.save(); // TinyMCE joriy HTML kontentini textarea#body ga yozadi

      const rawBody = $('#body').val() || '';

      // UTF-8 (o'zbekcha/kirilcha belgilar) uchun xavfsiz Base64 kodlash
      const encoded = btoa(unescape(encodeURIComponent(rawBody)));

      // yashirin maydonga joylaymiz
      let $hidden = $(this).find('input[name="body_encoded"]');
      if ($hidden.length === 0) {
        $hidden = $('<input type="hidden" name="body_encoded">').appendTo(this);
      }
      $hidden.val(encoded);

      // asl 'body' maydonini yuborilishdan chiqarib tashlaymiz
      $('#body').removeAttr('name');

      // haqiqiy (native) yuborish
      this.submit();
    });

  });

})();
</script>

{% endblock content %}
