<script>
// ----------------- Helper funksiyalar -----------------
function todayDmy() {
  const d = new Date();
  const dd = String(d.getDate()).padStart(2, '0');
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const yy = d.getFullYear();
  return `${dd}.${mm}.${yy}`;
}

function ymdToDmy(ymd) {
  if (!ymd) return '';
  const [y, m, d] = ymd.split('-');
  return `${d}.${m}.${y}`;
}

function formatNumber(num) {
  // Sonni formatlash
  // Misol: 1000 -> "1 000"
  // Misol: 1000.5 -> "1 000,50"
  if (num === null || num === undefined || isNaN(num)) return '0';

  // Sonni butun va kasr qismlarga ajratish
  let numStr = num.toString();

  // Agar nuqta bo'lsa (float son)
  if (numStr.includes('.')) {
    let parts = numStr.split('.');
    let integerPart = parts[0];
    let fractionalPart = parts[1];

    // Butun qismni mingliklarda bo'lish
    integerPart = integerPart.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');

    // Kasr qismni 2 xonaga to'ldirish
    if (fractionalPart.length === 1) {
      fractionalPart = fractionalPart + '0';
    } else if (fractionalPart.length > 2) {
      fractionalPart = fractionalPart.substring(0, 2);
    }

    return integerPart + ',' + fractionalPart;
  }
  // Agar butun son bo'lsa
  else {
    // Butun qismni mingliklarda bo'lish
    return numStr.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  }
}

// ----------------- TinyMCE ga yozish funksiyalari -----------------
function editorGet() {
  return tinymce.get('body');
}

function editorSetText(selector, text) {
  const ed = editorGet();
  if (!ed) return false;

  try {
    const node = ed.getBody().querySelector(selector);
    if (node) {
      node.textContent = text;
      ed.nodeChanged();
      return true;
    }
  } catch(e) {
    console.log("EditorSetText xatosi:", e);
  }
  return false;
}

function editorSetTbodyRows(rowsHtml) {
  const ed = editorGet();
  if (!ed) return;

  try {
    const body = ed.getBody();
    const tbody = body.querySelector('#materials_tbody');
    if (!tbody) {
      console.log("materials_tbody topilmadi");
      return;
    }

    // Header qatorini saqlash (TinyMCE ichidagi mavjud header)
    const existingRows = tbody.querySelectorAll('tr');
    let headerRow = '';

    // Agar header qatori mavjud bo'lsa, uni saqlaymiz
    if (existingRows.length > 0) {
      headerRow = existingRows[0].outerHTML;
    }

    // Header + yangi ma'lumotlar
    tbody.innerHTML = headerRow + rowsHtml;
    ed.nodeChanged();
  } catch(e) {
    console.log("EditorSetTbodyRows xatosi:", e);
  }
}

// ----------------- jQuery va Select2 -----------------
$(function () {
  // TinyMCE initial bo'lishini kutish
  let tinymceReady = false;
  const tinymceCheckInterval = setInterval(function() {
    if (tinymce.get('body')) {
      tinymceReady = true;
      clearInterval(tinymceCheckInterval);

      // Boshlang'ich sanani o'rnatish
      const bugungiSana = todayDmy() + ' y';
      editorSetText('#doc_date', bugungiSana);

      // Tashkilot nomini o'rnatish (agar tanlangan bo'lsa)
      const orgName = $('#organization option:selected').text();
      if (orgName && orgName !== 'Tanlang...') {
        editorSetText('#org_id', orgName);
      }
    }
  }, 500);

  // Select2 ni ishga tushirish
  $('#organization, #sender, #agreements').select2({
    width: '100%',
    placeholder: 'Tanlang...',
    allowClear: true
  });

  // Boshlang'ich sanalarni o'rnatish
  const today = new Date();
  const todayStr = today.toISOString().split('T')[0];
  const monthAgo = new Date();
  monthAgo.setMonth(monthAgo.getMonth() - 1);
  const monthAgoStr = monthAgo.toISOString().split('T')[0];

  if (!$('#date1').val()) $('#date1').val(monthAgoStr);
  if (!$('#date2').val()) $('#date2').val(todayStr);

  // ----------------- Tanlangan malumotlarni TinyMCE ga yozish -----------------
  function updateEditorWithSelections() {
    if (!tinymceReady) return;

    const orgName = $('#organization option:selected').text();
    if (orgName && orgName !== 'Tanlang...') {
      editorSetText('#org_id', orgName);
    }

    const date1 = $('#date1').val();
    if (date1) {
      const monthYear = new Date(date1).toLocaleDateString('uz-UZ', {
        year: 'numeric',
        month: 'long'
      });
      editorSetText('#date', `${monthYear} oyi uchun`);
    }
  }

  // ----------------- Materiallarni qidirish -----------------
  function searchMaterials() {
    const orgId = $('#organization').val();
    const date1 = $('#date1').val();
    const date2 = $('#date2').val();

    if (!orgId || !date1 || !date2) {
      alert("Iltimos, tashkilot va sanalarni to'liq tanlang!");
      return;
    }

    // Tanlangan ma'lumotlarni editorga yozish
    updateEditorWithSelections();

    // Yuklanmoqda xabarini ko'rsatish
    editorSetTbodyRows(`
      <tr>
        <td colspan="8" style="text-align:center; padding:20px;">
          <i>Yuklanmoqda...</i>
        </td>
      </tr>
    `);

    // Materiallarni yuklash
    $.ajax({
      url: "{% url 'ajax_svod_materials' %}",
      method: "GET",
      data: {
        organization: orgId,
        date1: date1,
        date2: date2
      },
      success: function(data) {
        if (!data || data.length === 0) {
          editorSetTbodyRows(`
            <tr>
              <td colspan="8" style="text-align:center; color:#888; padding:20px;">
                Tanlangan sana oralig'ida ma'lumot topilmadi
              </td>
            </tr>
          `);
          return;
        }

        let rows = "";
        let totalSum = 0;
        let index = 1;

        // Ma'lumotlar qatorlari (header YO'Q, faqat ma'lumotlar)
        data.forEach(function(item) {
          const quantity = parseFloat(item.total_number) || 0;
          const price = parseFloat(item.material__price) || 0;
          const sum = parseFloat(item.total_sum) || 0;

          totalSum += sum;

          rows += `
            <tr>
              <td style="border:1px solid #000;font-size:8pt;text-align:center;">${index++}</td>
              <td style="border:1px solid #000;font-size:8pt;text-align:center;">${item.material__name || ''}</td>
              <td style="border:1px solid #000;font-size:8pt;text-align:center;">${item.material__unit__name || ''}</td>
              <td style="border:1px solid #000;font-size:8pt;text-align:center;">${formatNumber(quantity)}</td>
              <td style="border:1px solid #000;font-size:8pt;text-align:center;">${formatNumber(price)}</td>
              <td style="border:1px solid #000;font-size:8pt;text-align:center;">${formatNumber(sum)}</td>
              <td style="border:1px solid #000;font-size:8pt;text-align:center;">${item.order_info || ''}</td>
              <td style="border:1px solid #000;font-size:8pt;text-align:center;">${item.material__code || ''}</td>
            </tr>
          `;
        });

        // Jami qator
        rows += `
          <tr>
            <td colspan="5" style="border:1px solid #000;font-size:8pt;text-align:right;"><b>JAMI:</b></td>
            <td style="border:1px solid #000;font-size:8pt;text-align:right;"><b>${formatNumber(totalSum)}</b></td>
            <td colspan="2" style="border:1px solid #000;font-size:8pt;text-align:right;"></td>
          </tr>
        `;

        editorSetTbodyRows(rows);
      },
      error: function(xhr) {
        console.error("Xatolik:", xhr);
        editorSetTbodyRows(`
          <tr>
            <td colspan="8" style="text-align:center; color:red; padding:20px;">
              Xatolik yuz berdi: ${xhr.status} ${xhr.statusText}
            </td>
          </tr>
        `);
      }
    });
  }

  // ----------------- Event listeners -----------------
  $('#organization').on('change', function() {
    updateEditorWithSelections();
  });

  $('#date1, #date2').on('change', function() {
    updateEditorWithSelections();
  });

  $('#btnGenerate').on('click', function(e) {
    e.preventDefault();
    searchMaterials();
  });

  // ----------------- Form submit ni to'g'irlash -----------------
  $('form').on('submit', function(e) {
    // Agar TinyMCE ishga tushmagan bo'lsa, davom etish
    if (!tinymceReady) return true;

    // TinyMCE content ni textarea ga yozish
    const ed = tinymce.get('body');
    if (ed) {
      ed.save();
    }

    return true; // Formani yuborish
  });

  // ----------------- Initial load -----------------
  // Agar Django dan kelgan ma'lumotlar bo'lsa
  {% if selected_org %}
    $('#organization').val('{{ selected_org }}').trigger('change');
  {% endif %}

  {% if selected_sender %}
    // Sender ni o'rnatish uchun AJAX so'rov kerak
    // Bu yerda sizning logikangiz bo'yicha
  {% endif %}
});
</script>
<script>
function loadAgreementsByOrg(orgId, selectedIds = []) {
  $('#agreements').html('').trigger('change');
  if (!orgId) return;

  $.ajax({
    url: "{% url 'ajax_agreements_employees' %}",
    data: { org_id: orgId },   // ✅ view kutayotgan nom
    success: function (data) {
      let options = '';
      const selectedSet = new Set((selectedIds || []).map(String));

      data.forEach(function(emp) {
        const selected = selectedSet.has(String(emp.id)) ? 'selected' : '';
        options += `<option value="${emp.id}" ${selected}>${emp.full_name}</option>`;
      });

      $('#agreements').html(options).trigger('change');
    },
    error: function () {
      $('#agreements').html('').trigger('change');
    }
  });
}

$(function () {
  $('#organization').on('change', function () {
    loadAgreementsByOrg($(this).val());
  });

  const initialOrg = $('#organization').val();
  if (initialOrg) loadAgreementsByOrg(initialOrg);
});
</script>
