<script>
$(function() {

  // default: oy boshidan bugungacha
  function pad2(n){ return (n<10?'0':'')+n; }
  function setDefaultDates() {
    const now = new Date();
    const first = new Date(now.getFullYear(), now.getMonth(), 1);

    if (!$('#date1').val()) $('#date1').val(`${first.getFullYear()}-${pad2(first.getMonth()+1)}-${pad2(first.getDate())}`);
    if (!$('#date2').val()) $('#date2').val(`${now.getFullYear()}-${pad2(now.getMonth()+1)}-${pad2(now.getDate())}`);
  }
  setDefaultDates();

  $('#btnGenerate').on('click', generateReport);

  function generateReport() {
    const orgId = $('#organization').val();
    const date1 = $('#date1').val();
    const date2 = $('#date2').val();

    if (!orgId || !date1 || !date2) {
      alert("Iltimos, tashkilot va sanalarni to‘ldiring!");
      return;
    }
    if (new Date(date1) > new Date(date2)) {
      alert("Boshlanish sanasi tugash sanasidan keyin bo‘lishi mumkin emas!");
      return;
    }

    $('#resultsBody').html(`
      <tr>
        <td colspan="8" class="text-center">
          <div class="spinner-border text-primary" role="status"></div>
          <div class="mt-2">Hisobot yuklanmoqda...</div>
        </td>
      </tr>
    `);

    $.ajax({
      url: "{% url 'ajax_svod_materials' %}",
      method: 'GET',
      data: { organization: orgId, date1: date1, date2: date2 },
      success: function(rows) {
        renderTable(rows || []);
      },
      error: function(xhr) {
        $('#resultsBody').html(`
          <tr>
            <td colspan="8" class="text-center text-danger">
              Xatolik: ${(xhr.responseJSON && xhr.responseJSON.error) ? xhr.responseJSON.error : xhr.status}
            </td>
          </tr>
        `);
        console.log(xhr.responseText);
      }
    });
  }

  function renderTable(rows){
    if(!rows.length){
      $('#resultsBody').html(`<tr><td colspan="8" class="text-center text-muted">Ma’lumot topilmadi</td></tr>`);
      return;
    }

    let html = "";
    let total = 0;

    rows.forEach((r, idx) => {
      const sum = parseFloat(r.total_sum) || 0;
      total += sum;

      html += `
        <tr>
          <td>${idx + 1}</td>
          <td>${r.material__name || ''}</td>
          <td>${r.material__unit__name || ''}</td>
          <td class="text-end">${(r.total_number ?? '')}</td>
          <td class="text-end">${(r.material__price ?? '')}</td>
          <td class="text-end">${(r.total_sum ?? '')}</td>
          <td>${r.order_info || ''}</td>
          <td>${r.material__code || ''}</td>
        </tr>
      `;
    });

    html += `
      <tr>
        <td colspan="5" class="text-end"><b>JAMI:</b></td>
        <td class="text-end"><b>${total.toLocaleString('uz-UZ')}</b></td>
        <td colspan="2"></td>
      </tr>
    `;

    $('#resultsBody').html(html);
  }

});
</script>
<script>
