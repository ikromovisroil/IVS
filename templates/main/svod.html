<script>
/* ===================== Helper funcs ===================== */
function todayDmy() {
  const d = new Date();
  const dd = String(d.getDate()).padStart(2, '0');
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const yy = d.getFullYear();
  return `${dd}.${mm}.${yy}`;
}

function formatNumber(value) {
  if (value === null || value === undefined) return '0';

  let s = String(value).trim();
  if (!s) return '0';

  // bo'shliqlarni olib tashlaymiz: "100 000,50"
  s = s.replace(/\s+/g, '');

  // "," -> "." qilib parse
  const normalized = s.replace(',', '.');
  const num = Number(normalized);
  if (!isFinite(num)) return '0';

  const hasFraction = /[,.]\d+/.test(s);
  let [intPart, fracPart] = (hasFraction ? num.toFixed(2) : Math.trunc(num).toString()).split('.');

  const sign = intPart.startsWith('-') ? '-' : '';
  intPart = intPart.replace('-', '');
  intPart = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');

  return hasFraction ? `${sign}${intPart},${fracPart}` : `${sign}${intPart}`;
}

/* ===================== ORG normalize (SVOD) ===================== */
function normalizeOrgName(orgNameRaw){
  const t = (orgNameRaw || '').trim();
  if (!t) return t;

  // aynan "ivs" bo'lsa (xohlasangiz includes('ivs') ham qilib beraman)
  if (t.toLowerCase() === 'Axborot texnologiyalari markazi') {
    return 'Iqtisodiyot va moliya vazirligi huzuridagi Axborot texnologiyalari markazi';
  }
  return t;
}

/* ===================== TinyMCE helpers ===================== */
function editorGet() {
  if (!window.tinymce) return null;
  return tinymce.get('body');
}

function editorSetText(selector, text) {
  const ed = editorGet();
  if (!ed) return false;

  try {
    const node = ed.getBody().querySelector(selector);
    if (node) {
      node.textContent = text;
      ed.nodeChanged();
      return true;
    }
  } catch(e) {
    console.log("editorSetText xatosi:", e);
  }
  return false;
}

function editorSetTbodyRows(tbodySelector, rowsHtml) {
  const ed = editorGet();
  if (!ed) return;

  try {
    const body = ed.getBody();
    const tbody = body.querySelector(tbodySelector);
    if (!tbody) {
      console.log("tbody topilmadi:", tbodySelector);
      return;
    }

    // SVODda siz 1ta header saqlayapsiz (1-tr)
    const existingRows = tbody.querySelectorAll('tr');
    const headerRow = existingRows[0] ? existingRows[0].outerHTML : '';

    tbody.innerHTML = headerRow + (rowsHtml || '');
    ed.nodeChanged();
  } catch(e) {
    console.log("editorSetTbodyRows xatosi:", e);
  }
}

/* ===================== Main ===================== */
$(function () {

  /* ---------- Select2 ---------- */
  $('#organization, #sender, #agreements').select2({
    width: '100%',
    placeholder: 'Tanlang...',
    allowClear: true
  });

  /* ---------- Date defaults ---------- */
  const today = new Date();
  const todayStr = today.toISOString().split('T')[0];
  const monthAgo = new Date();
  monthAgo.setMonth(monthAgo.getMonth() - 1);
  const monthAgoStr = monthAgo.toISOString().split('T')[0];

  if (!$('#date1').val()) $('#date1').val(monthAgoStr);
  if (!$('#date2').val()) $('#date2').val(todayStr);

  /* ---------- TinyMCE ready wait ---------- */
  let tinymceReady = false;

  (function waitTinymce(){
    let tries = 0;
    const t = setInterval(function(){
      tries++;
      if (editorGet() || tries > 60) { // ~30s max (0.5s interval)
        clearInterval(t);
        tinymceReady = !!editorGet();

        if (tinymceReady) {
          // doc_date bugungi sana
          editorSetText('#doc_date', todayDmy() + ' y');

          // org_id startda ham yozilsin
          updateEditorWithSelections();

          // agreements startda ham yuklansin
          const orgId = $('#organization').val();
          if (orgId) loadAgreementsByOrg(orgId);
        }
      }
    }, 500);
  })();

  /* ===================== update editor header ===================== */
  function updateEditorWithSelections() {
    if (!tinymceReady) return;

    const orgNameRaw = ($('#organization option:selected').text() || '').trim();
    const orgName = normalizeOrgName(orgNameRaw);

    if (orgName && orgName !== 'Tanlang...') {
      editorSetText('#org_id', orgName);
    }

    const date1 = $('#date1').val();
    if (date1) {
      // oy-yil (uz) -> "2026 yil февраль" kabi chiqishi mumkin,
      // shuning uchun faqat ".... oyi uchun" qo'shamiz
      const dt = new Date(date1);
      const monthYear = dt.toLocaleDateString('uz-UZ', { year: 'numeric', month: 'long' });
      editorSetText('#date', `${monthYear} oyi uchun`);
    }
  }

  /* ===================== Agreements (org bo'yicha) ===================== */
  function loadAgreementsByOrg(orgId, selectedIds = []) {
    $('#agreements').html('').trigger('change');
    if (!orgId) return;

    $.ajax({
      url: "{% url 'ajax_agreements_employees' %}",
      method: "GET",
      dataType: "json",
      data: { org_id: orgId },  // ✅ view kutayotgan nom
      success: function (data) {
        let options = '';
        const selectedSet = new Set((selectedIds || []).map(String));

        (data || []).forEach(function(emp) {
          const selected = selectedSet.has(String(emp.id)) ? 'selected' : '';
          options += `<option value="${emp.id}" ${selected}>${emp.full_name}</option>`;
        });

        $('#agreements').html(options).trigger('change');
      },
      error: function () {
        $('#agreements').html('').trigger('change');
      }
    });
  }

  /* ===================== SVOD materials ===================== */
  function searchMaterials() {
    const orgId = $('#organization').val();
    const date1 = $('#date1').val();
    const date2 = $('#date2').val();

    if (!orgId || !date1 || !date2) {
      alert("Iltimos, tashkilot va sanalarni to'liq tanlang!");
      return;
    }

    updateEditorWithSelections();

    // loading
    editorSetTbodyRows('#materials_tbody', `
      <tr>
        <td colspan="8" style="text-align:center; padding:20px;">
          <i>Yuklanmoqda...</i>
        </td>
      </tr>
    `);

    $.ajax({
      url: "{% url 'ajax_svod_materials' %}",
      method: "GET",
      dataType: "json",
      data: { organization: orgId, date1: date1, date2: date2 },
      success: function(data) {
        if (!data || data.length === 0) {
          editorSetTbodyRows('#materials_tbody', `
            <tr>
              <td colspan="8" style="text-align:center; color:#888; padding:20px;">
                Tanlangan sana oralig'ida ma'lumot topilmadi
              </td>
            </tr>
          `);
          return;
        }

        let rows = "";
        let totalSum = 0;
        let index = 1;

        (data || []).forEach(function(item) {
          const quantity = parseFloat(item.total_number) || 0;
          const price = parseFloat(item.material__price) || 0;
          const sum = parseFloat(item.total_sum) || (quantity * price) || 0;

          totalSum += sum;

          rows += `
            <tr>
              <td style="border:1px solid #000;font-size:8pt;text-align:center;">${index++}</td>
              <td style="border:1px solid #000;font-size:8pt;text-align:center;">${item.material__name || ''}</td>
              <td style="border:1px solid #000;font-size:8pt;text-align:center;">${item.material__unit__name || ''}</td>
              <td style="border:1px solid #000;font-size:8pt;text-align:center;">${formatNumber(quantity)}</td>
              <td style="border:1px solid #000;font-size:8pt;text-align:center;">${formatNumber(price)}</td>
              <td style="border:1px solid #000;font-size:8pt;text-align:center;">${formatNumber(sum)}</td>
              <td style="border:1px solid #000;font-size:8pt;text-align:center;">${item.order_info || ''}</td>
              <td style="border:1px solid #000;font-size:8pt;text-align:center;">${item.material__code || ''}</td>
            </tr>
          `;
        });

        rows += `
          <tr>
            <td colspan="5" style="border:1px solid #000;font-size:8pt;text-align:right;"><b>JAMI:</b></td>
            <td style="border:1px solid #000;font-size:8pt;text-align:right;"><b>${formatNumber(totalSum)}</b></td>
            <td colspan="2" style="border:1px solid #000;font-size:8pt;text-align:right;"></td>
          </tr>
        `;

        editorSetTbodyRows('#materials_tbody', rows);
      },
      error: function(xhr) {
        console.error("Xatolik:", xhr);
        editorSetTbodyRows('#materials_tbody', `
          <tr>
            <td colspan="8" style="text-align:center; color:red; padding:20px;">
              Xatolik yuz berdi: ${xhr.status} ${xhr.statusText}
            </td>
          </tr>
        `);
      }
    });
  }

  /* ===================== Events ===================== */
  $('#organization').on('change', function() {
    updateEditorWithSelections();
    loadAgreementsByOrg($(this).val());
  });

  $('#date1, #date2').on('change', function() {
    updateEditorWithSelections();
  });

  // sizda tugma id: btnGenerate (svodda shunaqa bo'lsa)
  $('#btnGenerate').on('click', function(e) {
    e.preventDefault();
    searchMaterials();
  });

  /* ===================== Form submit ===================== */
  $('form').on('submit', function() {
    const ed = editorGet();
    if (ed) ed.save();
    return true;
  });

  /* ===================== Initial restore ===================== */
  {% if selected_org %}
    $('#organization').val('{{ selected_org }}').trigger('change');
  {% endif %}

});
</script>
