<script>
function formatNumber(num) {
  if (num === null || num === undefined || isNaN(num)) return '0';
  let numStr = num.toString();
  if (numStr.includes('.')) {
    let [intPart, fracPart] = numStr.split('.');
    intPart = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    if (fracPart.length === 1)    fracPart = fracPart + '0';
    else if (fracPart.length > 2) fracPart = fracPart.substring(0, 2);
    return intPart + ',' + fracPart;
  }
  return numStr.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
}

function todayDmy() {
  const d  = new Date();
  const dd = String(d.getDate()).padStart(2, '0');
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const yy = d.getFullYear();
  return `${dd}.${mm}.${yy} y`;
}

function formatMonthYear() {
  const months = [
    'yanvar', 'fevral', 'mart', 'aprel', 'may', 'iyun',
    'iyul', 'avgust', 'sentabr', 'oktabr', 'noyabr', 'dekabr'
  ];
  const d = new Date();
  return `${d.getFullYear()} yil ${months[d.getMonth()]} oyi uchun`;
}

function escapeHtml(value) {
  if (value === null || value === undefined) return '';
  return String(value)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}

// ─── EDITOR ───────────────────────────────────────────────────────────────────

function editorGet() {
  if (!window.tinymce) return null;
  const ed = tinymce.get('body');
  if (!ed) return null;
  try { if (!ed.getBody()) return null; } catch (e) { return null; }
  return ed;
}

function editorSetText(selector, text) {
  const ed = editorGet();
  if (!ed) return false;
  try {
    const node = ed.getBody().querySelector(selector);
    if (node) { node.textContent = text; ed.nodeChanged(); return true; }
  } catch (e) { console.log('editorSetText xatosi:', e); }
  return false;
}

function editorSetTbodyRows(rowsHtml) {
  const ed = editorGet();
  if (!ed) return;
  try {
    const tbody = ed.getBody().querySelector('#materials_tbody');
    if (!tbody) { console.log('materials_tbody topilmadi'); return; }
    tbody.innerHTML = rowsHtml;
    ed.nodeChanged();
  } catch (e) { console.log('editorSetTbodyRows xatosi:', e); }
}

function waitForTinyMCE(callback, tries = 0) {
  const ed = editorGet();
  if (ed) { callback(); return; }
  if (tries > 50) { console.log('TinyMCE topilmadi'); return; }
  setTimeout(function () { waitForTinyMCE(callback, tries + 1); }, 200);
}

// ─── EDITOR UPDATE ────────────────────────────────────────────────────────────

function updateEditorWithSelections() {
  const $opt         = $('#organization option:selected');
  const orgName      = $opt.text().trim();
  const contractText = $opt.attr('data-contract') || '';

  editorSetText('#org_id',        (orgName && orgName !== 'Tanlang...') ? orgName : 'Tashkilot');
  editorSetText('#date_contract', contractText.trim() ? contractText : '_');
  editorSetText('#doc_date',      todayDmy());
  editorSetText('#report_period', formatMonthYear());
}

// ─── AJAX ─────────────────────────────────────────────────────────────────────

function loadAgreementsByOrg(orgId, selectedIds = []) {
  const $agr = $('#agreements');
  $agr.html('').trigger('change');

  if (!orgId) return;

  $.ajax({
    url: "{% url 'ajax_agreements_employees' %}",
    method: 'GET',
    dataType: 'json',
    data: { org_id: orgId },

    success: function (data) {
      const selectedSet = new Set((selectedIds || []).map(String));
      let options = '';

      (data || []).forEach(function (emp) {
        const sel      = selectedSet.has(String(emp.id)) ? 'selected' : '';
        const fullName = emp.full_name || '';
        const rank     = emp.rank     || '';
        const fullText = rank ? `${fullName} (${rank})` : fullName;

        options += `
          <option value="${escapeHtml(emp.id)}" ${sel}
                  data-fullname="${escapeHtml(fullName)}"
                  data-rank="${escapeHtml(rank)}">
            ${escapeHtml(fullText)}
          </option>
        `;
      });

      $agr.html(options).trigger('change');
    },

    error: function (xhr) {
      console.error('Kelishuvchilar AJAX xatosi:', xhr.status, xhr.responseText);
      $agr.html('').trigger('change');
    }
  });
}

function searchMaterials() {
  const orgId = $('#organization').val();
  const date1 = $('#date1').val();
  const date2 = $('#date2').val();

  if (!orgId || !date1 || !date2) {
    alert("Iltimos, tashkilot va sanalarni to'liq tanlang!");
    return;
  }

  updateEditorWithSelections();

  editorSetTbodyRows(`
    <tr>
      <td colspan="8" style="border:1px solid #000;text-align:center;padding:14px;font-size:10pt;">
        <i>Yuklanmoqda...</i>
      </td>
    </tr>
  `);

  $.ajax({
    url: "{% url 'ajax_svod_materials' %}",
    method: 'GET',
    dataType: 'json',
    data: { organization: orgId, date1: date1, date2: date2 },

    success: function (data) {
      if (!Array.isArray(data) || !data.length) {
        editorSetTbodyRows(`
          <tr>
            <td colspan="8" style="border:1px solid #000;text-align:center;color:#888;padding:14px;font-size:10pt;">
              Tanlangan sana oralig'ida ma'lumot topilmadi
            </td>
          </tr>
        `);
        return;
      }

      let rows     = '';
      let totalSum = 0;
      let index    = 1;

      data.forEach(function (item) {
        const qty   = parseFloat(item.total_number   || 0) || 0;
        const price = parseFloat(item.material__price || 0) || 0;
        const sum   = parseFloat(item.total_sum       || 0) || 0;
        totalSum += sum;

        rows += `
          <tr>
            <td style="border:1px solid #000;font-size:8pt;text-align:center;">${index++}</td>
            <td style="border:1px solid #000;font-size:8pt;text-align:center;">${escapeHtml(item.material__name       || '')}</td>
            <td style="border:1px solid #000;font-size:8pt;text-align:center;">${escapeHtml(item.material__unit__name || 'dona')}</td>
            <td style="border:1px solid #000;font-size:8pt;text-align:center;">${formatNumber(qty)}</td>
            <td style="border:1px solid #000;font-size:8pt;text-align:center;">${formatNumber(price)}</td>
            <td style="border:1px solid #000;font-size:8pt;text-align:center;">${formatNumber(sum)}</td>
            <td style="border:1px solid #000;font-size:8pt;text-align:center;">${escapeHtml(item.order_info          || '')}</td>
            <td style="border:1px solid #000;font-size:8pt;text-align:center;">${escapeHtml(item.material__code      || '')}</td>
          </tr>
        `;
      });

      rows += `
        <tr>
          <td colspan="5" style="border:1px solid #000;font-size:8pt;text-align:right;font-weight:bold;background-color:rgb(251,238,184);">JAMI:</td>
          <td style="border:1px solid #000;font-size:8pt;text-align:center;font-weight:bold;background-color:rgb(251,238,184);">${formatNumber(totalSum)}</td>
          <td colspan="2" style="border:1px solid #000;background-color:rgb(251,238,184);"></td>
        </tr>
      `;

      editorSetTbodyRows(rows);
    },

    error: function (xhr) {
      const msg = {
        404: "So'rov yo'li topilmadi (404)",
        500: "Server xatoligi (500)",
        403: "Ruxsat yo'q (403)",
        400: "Noto'g'ri so'rov (400)",
      }[xhr.status] || "Xatolik yuz berdi";

      editorSetTbodyRows(`
        <tr>
          <td colspan="8" style="border:1px solid #000;text-align:center;color:red;padding:14px;font-size:10pt;">
            ${msg}. Batafsil: ${xhr.status} ${xhr.statusText}
          </td>
        </tr>
      `);
    }
  });
}

// ─── JQUERY READY ─────────────────────────────────────────────────────────────

$(function () {
  if ($.fn.select2) {
    $('#organization, #sender, #agreements').select2({
      width: '100%',
      placeholder: 'Tanlang...',
      allowClear: true
    });
  }

  const today    = new Date();
  const monthAgo = new Date();
  monthAgo.setMonth(monthAgo.getMonth() - 1);

  if (!$('#date1').val()) $('#date1').val(monthAgo.toISOString().split('T')[0]);
  if (!$('#date2').val()) $('#date2').val(today.toISOString().split('T')[0]);

  // ─── EVENTS ───────────────────────────────────────────────────────────────

  $('#organization').on('change', function () {
    const orgId = $(this).val();
    updateEditorWithSelections();
    if (!orgId) {
      $('#agreements').html('').trigger('change');
      return;
    }
    loadAgreementsByOrg(orgId);
  });

  $('#date1, #date2').on('change', function () {
    updateEditorWithSelections();
  });

  $('#btnGenerate').on('click', function (e) {
    e.preventDefault();
    searchMaterials();
  });

  // ─── FORM SUBMIT: body ni Base64 qilib yuboramiz (WAF/firewall'ni chetlab o'tish uchun) ─────

  $('form').on('submit', function (e) {
    e.preventDefault();

    const ed = editorGet();
    if (ed) ed.save(); // TinyMCE joriy HTML kontentini textarea#body ga yozadi

    const rawBody = $('#body').val() || '';

    // UTF-8 (o'zbekcha/kirilcha belgilar) uchun xavfsiz Base64 kodlash
    const encoded = btoa(unescape(encodeURIComponent(rawBody)));

    // yashirin maydonga joylaymiz
    let $hidden = $(this).find('input[name="body_encoded"]');
    if ($hidden.length === 0) {
      $hidden = $('<input type="hidden" name="body_encoded">').appendTo(this);
    }
    $hidden.val(encoded);

    // asl 'body' maydonini yuborilishdan chiqarib tashlaymiz
    $('#body').removeAttr('name');

    // haqiqiy (native) yuborish
    this.submit();
  });

  // ─── INITIAL LOAD ─────────────────────────────────────────────────────────

  const initialOrg = '{{ selected_org|default:"" }}';

  if (initialOrg) {
    $('#organization').val(initialOrg);
    loadAgreementsByOrg(initialOrg);
  }

  waitForTinyMCE(function () {
    updateEditorWithSelections();
  });

});
</script>
