<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script>
function formatNumber(num) {
  if (num === null || num === undefined || isNaN(num)) return '0';

  let numStr = num.toString();

  if (numStr.includes('.')) {
    let parts = numStr.split('.');
    let integerPart = parts[0];
    let fractionalPart = parts[1];

    integerPart = integerPart.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');

    if (fractionalPart.length === 1) fractionalPart = fractionalPart + '0';
    else if (fractionalPart.length > 2) fractionalPart = fractionalPart.substring(0, 2);

    return integerPart + ',' + fractionalPart;
  } else {
    return numStr.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  }
}

function todayDmy() {
  const d = new Date();
  const dd = String(d.getDate()).padStart(2, '0');
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const yy = d.getFullYear();
  return `${dd}.${mm}.${yy} y`;
}

function formatMonthYear(dateStr) {
  if (!dateStr) return '';

  const months = [
    'yanvar', 'fevral', 'mart', 'aprel', 'may', 'iyun',
    'iyul', 'avgust', 'sentabr', 'oktabr', 'noyabr', 'dekabr'
  ];

  const d = new Date(dateStr);
  if (isNaN(d.getTime())) return '';

  return `${d.getFullYear()} yil ${months[d.getMonth()]} oyi uchun`;
}

function escapeHtml(value) {
  if (value === null || value === undefined) return '';
  return String(value)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}

function editorGet() {
  return window.tinymce ? tinymce.get('body') : null;
}

function editorSetText(selector, text) {
  const ed = editorGet();
  if (!ed) return false;

  try {
    const node = ed.getBody().querySelector(selector);
    if (node) {
      node.textContent = text;
      ed.nodeChanged();
      return true;
    }
  } catch (e) {
    console.log('editorSetText xatosi:', e);
  }
  return false;
}

function editorSetTbodyRows(rowsHtml) {
  const ed = editorGet();
  if (!ed) return;

  try {
    const body = ed.getBody();
    const tbody = body.querySelector('#materials_tbody');

    if (!tbody) {
      console.log('materials_tbody topilmadi');
      return;
    }

    const existingRows = tbody.querySelectorAll('tr');
    let headerHtml = '';

    if (existingRows.length >= 1) {
      headerHtml = existingRows[0].outerHTML;
    } else {
      headerHtml = tbody.innerHTML;
    }

    tbody.innerHTML = headerHtml + rowsHtml;
    ed.nodeChanged();
  } catch (e) {
    console.log('editorSetTbodyRows xatosi:', e);
  }
}

function updateEditorWithSelections() {
  const ed = editorGet();
  if (!ed) return;

  const selectedOption = $('#organization option:selected');
  const orgName = selectedOption.text().trim();
  const contractText = selectedOption.attr('data-contract') || '';
  const date1 = $('#date1').val();

  if (orgName && orgName !== 'Tanlang...') {
    editorSetText('#org_id', orgName);
  } else {
    editorSetText('#org_id', 'Tashkilot');
  }

  if (contractText && contractText.trim() !== '') {
    editorSetText('#date_contract', contractText);
  } else {
    editorSetText('#date_contract', '_');
  }

  editorSetText('#doc_date', todayDmy());

  const periodText = formatMonthYear(date1);
  if (periodText) {
    editorSetText('#report_period', periodText);
  } else {
    editorSetText('#report_period', '');
  }
}

function loadAgreementsByOrg(orgId, selectedIds = []) {
  const $agreements = $('#agreements');

  $agreements.html('').trigger('change');

  if (!orgId) {
    return;
  }

  $.ajax({
    url: "{% url 'ajax_agreements_employees' %}",
    method: 'GET',
    dataType: 'json',
    data: { org_id: orgId },

    success: function (data) {
      let options = '';
      const selectedSet = new Set((selectedIds || []).map(String));

      (data || []).forEach(function (emp) {
        const selected = selectedSet.has(String(emp.id)) ? 'selected' : '';
        const fullName = emp.full_name || '';
        const rank = emp.rank || '';
        const fullText = rank ? `${fullName} (${rank})` : fullName;

        options += `
          <option value="${escapeHtml(emp.id)}" ${selected}
                  data-fullname="${escapeHtml(fullName)}"
                  data-rank="${escapeHtml(rank)}">
            ${escapeHtml(fullText)}
          </option>
        `;
      });

      $agreements.html(options).trigger('change');
    },

    error: function (xhr) {
      console.error('Kelishuvchilar AJAX xatosi:', xhr.status, xhr.statusText, xhr.responseText);
      $agreements.html('').trigger('change');
    }
  });
}

function searchMaterials() {
  const orgId = $('#organization').val();
  const date1 = $('#date1').val();
  const date2 = $('#date2').val();

  if (!orgId || !date1 || !date2) {
    alert("Iltimos, tashkilot va sanalarni to'liq tanlang!");
    return;
  }

  updateEditorWithSelections();

  editorSetTbodyRows(`
    <tr>
      <td colspan="8" style="border:1px solid #000; text-align:center; padding:14px; font-size:10pt;">
        <i>Yuklanmoqda...</i>
      </td>
    </tr>
  `);

  $.ajax({
    url: "{% url 'ajax_svod_materials' %}",
    method: 'GET',
    dataType: 'json',
    data: {
      organization: orgId,
      date1: date1,
      date2: date2
    },

    success: function (data) {
      if (!Array.isArray(data) || data.length === 0) {
        editorSetTbodyRows(`
          <tr>
            <td colspan="8" style="border:1px solid #000; text-align:center; color:#888; padding:14px; font-size:10pt;">
              Tanlangan sana oralig'ida ma'lumot topilmadi
            </td>
          </tr>
        `);
        return;
      }

      let rows = '';
      let totalQty = 0;
      let totalSum = 0;
      let index = 1;

      data.forEach(function(item) {
        const materialName = item.material_name || item.title || item.name || '';
        const unit = item.unit || item.material_unit || item.size || 'dona';
        const qty = parseFloat(item.number || item.quantity || item.total_number || 0) || 0;
        const price = parseFloat(item.price || item.material_price || item.material__price || 0) || 0;
        const sum = parseFloat(item.total_sum || item.summa || item.total || (qty * price) || 0) || 0;
        const note = item.note || item.eslatma || item.comment || '';
        const code = item.material_code || item.code || item.one_c_code || '';

        totalQty += qty;
        totalSum += sum;

        rows += `
          <tr>
            <td style="border:1px solid #000; font-size:8pt; text-align:center;">${index++}</td>
            <td style="border:1px solid #000; font-size:8pt; text-align:left;">${escapeHtml(materialName)}</td>
            <td style="border:1px solid #000; font-size:8pt; text-align:center;">${escapeHtml(unit)}</td>
            <td style="border:1px solid #000; font-size:8pt; text-align:center;">${formatNumber(qty)}</td>
            <td style="border:1px solid #000; font-size:8pt; text-align:center;">${formatNumber(price)}</td>
            <td style="border:1px solid #000; font-size:8pt; text-align:center;">${formatNumber(sum)}</td>
            <td style="border:1px solid #000; font-size:8pt; text-align:left;">${escapeHtml(note)}</td>
            <td style="border:1px solid #000; font-size:8pt; text-align:center;">${escapeHtml(code)}</td>
          </tr>
        `;
      });

      rows += `
        <tr>
          <td colspan="3" style="border:1px solid #000; font-size:8pt; text-align:right; font-weight:bold;">JAMI:</td>
          <td style="border:1px solid #000; font-size:8pt; text-align:center; font-weight:bold;">${formatNumber(totalQty)}</td>
          <td style="border:1px solid #000;"></td>
          <td style="border:1px solid #000; font-size:8pt; text-align:center; font-weight:bold;">${formatNumber(totalSum)}</td>
          <td colspan="2" style="border:1px solid #000;"></td>
        </tr>
      `;

      editorSetTbodyRows(rows);
    },

    error: function(xhr, status, error) {
      console.error('Xatolik:', error);
      console.error('Status:', status);
      console.error('Response:', xhr.responseText);

      let errorMessage = "Xatolik yuz berdi";
      if (xhr.status === 404) errorMessage = "So'rov yo'li topilmadi (404)";
      else if (xhr.status === 500) errorMessage = "Server xatoligi (500)";
      else if (xhr.status === 403) errorMessage = "Ruxsat yo'q (403)";
      else if (xhr.status === 400) errorMessage = "Noto'g'ri so'rov (400)";

      editorSetTbodyRows(`
        <tr>
          <td colspan="8" style="border:1px solid #000; text-align:center; color:red; padding:14px; font-size:10pt;">
            ${errorMessage}. Batafsil: ${xhr.status} ${xhr.statusText}
          </td>
        </tr>
      `);
    }
  });
}

$(function () {
  if ($.fn.select2) {
    $('#organization, #sender, #agreements').select2({
      width: '100%',
      placeholder: 'Tanlang...',
      allowClear: true
    });
  }

  const today = new Date();
  const todayStr = today.toISOString().split('T')[0];

  const monthAgo = new Date();
  monthAgo.setMonth(monthAgo.getMonth() - 1);
  const monthAgoStr = monthAgo.toISOString().split('T')[0];

  if (!$('#date1').val()) $('#date1').val(monthAgoStr);
  if (!$('#date2').val()) $('#date2').val(todayStr);

  const timer = setInterval(function () {
    if (editorGet()) {
      clearInterval(timer);
      updateEditorWithSelections();
    }
  }, 300);

  $('#organization').on('change', function () {
    const orgId = $(this).val();

    updateEditorWithSelections();

    if (!orgId) {
      $('#agreements').html('').trigger('change');
      return;
    }

    loadAgreementsByOrg(orgId);
  });

  $('#date1, #date2').on('change', function () {
    updateEditorWithSelections();
  });

  $('#btnGenerate').on('click', function (e) {
    e.preventDefault();
    searchMaterials();
  });

  $('form').on('submit', function () {
    const ed = editorGet();
    if (ed) ed.save();
    return true;
  });

  {% if selected_org %}
    $('#organization').val('{{ selected_org }}').trigger('change');
  {% else %}
    $('#agreements').html('').trigger('change');
    updateEditorWithSelections();
  {% endif %}
});
</script>
