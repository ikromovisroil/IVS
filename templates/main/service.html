<script>
function todayDmy() {
  const d  = new Date();
  const dd = String(d.getDate()).padStart(2, '0');
  const mm = String(d.getMonth() + 1).padStart(2, '0');
  const yy = d.getFullYear();
  return `${dd}.${mm}.${yy}`;
}

function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}

// ─── SUMMA SO'Z BILAN ──────────────────────────────────────────────────────────
// 16980445.02 -> "JAMI SO‘Z BILAN: O‘n olti million to‘qqiz yuz sakson ming to‘rt yuz qirq besh so‘m nol ikki tiyin"
const UZ_ONES = ['', 'bir', 'ikki', 'uch', 'to‘rt', 'besh', 'olti', 'yetti', 'sakkiz', 'to‘qqiz'];
const UZ_TENS = ['', 'o‘n', 'yigirma', 'o‘ttiz', 'qirq', 'ellik', 'oltmish', 'yetmish', 'sakson', 'to‘qson'];
const UZ_SCALES = ['', 'ming', 'million', 'milliard', 'trillion'];

function uzWordsBelowThousand(n) {
  const parts = [];
  const hundreds = Math.floor(n / 100);
  const tens = Math.floor((n % 100) / 10);
  const ones = n % 10;
  if (hundreds) parts.push(UZ_ONES[hundreds] + ' yuz');
  if (tens) parts.push(UZ_TENS[tens]);
  if (ones) parts.push(UZ_ONES[ones]);
  return parts.join(' ');
}

function uzNumberWords(n) {          // n: butun son >= 0
  if (n === 0) return 'nol';
  const parts = [];
  let scale = 0;
  while (n > 0 && scale < UZ_SCALES.length) {
    const group = n % 1000;
    if (group) parts.unshift(uzWordsBelowThousand(group) + (UZ_SCALES[scale] ? ' ' + UZ_SCALES[scale] : ''));
    n = Math.floor(n / 1000);
    scale++;
  }
  return parts.join(' ');
}

function amountInWords(total) {
  const cents = Math.max(0, Math.round((Number(total) || 0) * 100));
  const som = Math.floor(cents / 100);
  const tiyin = cents % 100;
  // tiyin ikki xonali o'qiladi: 02 -> "nol ikki", 00 -> "nol nol", 45 -> "qirq besh"
  const tiyinWords = tiyin < 10 ? 'nol ' + (tiyin === 0 ? 'nol' : UZ_ONES[tiyin]) : uzNumberWords(tiyin);
  const text = uzNumberWords(som) + ' so‘m ' + tiyinWords + ' tiyin';
  return 'JAMI SO‘Z BILAN: ' + text.charAt(0).toUpperCase() + text.slice(1);
}

// Pul summasi: doim ikki xonali tiyin bilan, minglar probel bilan: 15000 -> "15 000,00", 1234.5 -> "1 234,50"
function formatMoney(num) {
  const n = Number(num);
  const cents = Math.round((isFinite(n) ? n : 0) * 100);
  const sign = cents < 0 ? '-' : '';
  const abs = Math.abs(cents);
  const intPart = String(Math.floor(abs / 100)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  return sign + intPart + ',' + String(abs % 100).padStart(2, '0');
}

function formatNumber(num) {
  if (num === null || num === undefined || num === '' || isNaN(num)) return '0';
  let numStr = num.toString();
  if (numStr.includes('.')) {
    let [intPart, fracPart] = numStr.split('.');
    intPart = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
    if (fracPart.length === 1)    fracPart = fracPart + '0';
    else if (fracPart.length > 2) fracPart = fracPart.substring(0, 2);
    return intPart + ',' + fracPart;
  }
  return numStr.replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
}

// ─── EDITOR HELPERS ───────────────────────────────────────────────────────────

function editorGet() {
  if (!window.tinymce) return null;
  const ed = tinymce.get('body');
  if (!ed) return null;
  try { if (!ed.getBody()) return null; } catch (e) { return null; }
  return ed;
}

function editorSetText(selector, text) {
  const ed = editorGet();
  if (!ed) return false;
  try {
    const node = ed.getBody().querySelector(selector);
    if (node) { node.textContent = text; ed.nodeChanged(); return true; }
  } catch (e) { console.log("editorSetText xatosi:", e); }
  return false;
}

function editorSetTbodyRows(rowsHtml) {
  const ed = editorGet();
  if (!ed) return;
  try {
    const tbody = ed.getBody().querySelector('#materials_tbody');
    if (!tbody) return;
    tbody.innerHTML = rowsHtml || '';
    ed.nodeChanged();
  } catch (e) { console.log("editorSetTbodyRows xatosi:", e); }
}

function editorSetHTML(selector, html) {
  const ed = editorGet();
  if (!ed) return false;
  try {
    const node = ed.getBody().querySelector(selector);
    if (node) { node.innerHTML = html; ed.nodeChanged(); return true; }
  } catch (e) { console.log("editorSetHTML xatosi:", e); }
  return false;
}

// "Narzullayev Anvar Shuhrat o'g'li" -> "A.Narzullayev" (ism bosh harfi, nuqta, familiya)
function formatInitialSurname(fullname) {
  const parts = (fullname || '').trim().split(/\s+/).filter(Boolean);
  if (!parts.length) return '';
  const surname = parts[0];
  const first = parts[1] ? parts[1].charAt(0).toUpperCase() : '';
  return first ? `${first}.${surname}` : surname;
}

// "Narzullayev Anvar Shuhrat o'g'li" -> "A. Narzullayev" (matn ichida: ism bosh harfi, nuqta, probel, familiya)
function formatInitialSpaceSurname(fullname) {
  const parts = (fullname || '').trim().split(/\s+/).filter(Boolean);
  if (!parts.length) return '';
  const surname = parts[0];
  const first = parts[1] ? parts[1].charAt(0).toUpperCase() : '';
  return first ? `${first}. ${surname}` : surname;
}

// Lavozim matn ichida kichik harf bilan boshlanadi: "Boshlig'i" -> "boshlig'i"
function lowerFirst(text) {
  const t = (text || '').trim();
  return t ? t.charAt(0).toLowerCase() + t.slice(1) : '';
}

// ["A", "B", "C"] -> "A, B va C"; ["A", "B"] -> "A va B"; ["A"] -> "A"
function joinWithVa(items) {
  if (items.length <= 1) return items.join('');
  return items.slice(0, -1).join(', ') + ' va ' + items[items.length - 1];
}

// Hujjat matniga: "<Boshqarma/bo'lim> <lavozim> <A. Familiya>" - bir nechta bo'lsa "A va B" yoki "A, B va C"
function responsiblePeopleText(list) {
  return joinWithVa(list.map(function (p) {
    const unit = (p.unit || '').trim();
    const person = [lowerFirst(p.rank), formatInitialSpaceSurname(p.full_name)].filter(Boolean).join(' ');
    return unit && person ? unit + ', ' + person : (unit || person);     // "Departament, lavozim I. Ikromov"
  }).filter(Boolean));
}

// Faqat ismlar: "A. Narzullayev" yoki "A. Narzullayev va O. Abduqodirov" (3 va undan ko'p: "A, B va C")
function responsibleNamesText(list) {
  return joinWithVa(list.map(function (p) { return formatInitialSpaceSurname(p.full_name); }).filter(Boolean));
}

// Hisobotdagi materiallarning moddiy-javobgar shaxslari (dublikatsiz) -> hujjat pastida
function renderResponsibleBlock(people) {
  const seen = new Set();
  const list = [];
  (people || []).forEach(function (p) {
    const key = (p.full_name || '').trim().toLowerCase();
    if (!p.full_name || seen.has(key)) return;
    seen.add(key);
    list.push(p);
  });

  // Hujjat matnidagi gap ichida: "... dalolatnomani <javobgar shaxslar> ro'yxatiga ..."
  editorSetText('#blok_javobgar', responsiblePeopleText(list) || '_');
  // "... zaxiralarni <A. Narzullayev va O. Abduqodirov> hisobidan chiqarilishi uchun" (faqat ismlar)
  editorSetText('#blok_javobgar_ism', responsibleNamesText(list) || '_');

  if (!list.length) {
    editorSetHTML('#blok_3', '');
    return;
  }

  let html = `<div><b>Tovar-moddiy boyliklar uchun moddiy-javobgar shahs:</b></div>`;
  list.forEach(function (p) {
    html += `
      <div>
        <table style="border-collapse:collapse;width:100%;">
          <colgroup>
            <col style="width:50%;">
            <col style="width:50%;">
          </colgroup>
          <tbody>
            <tr>
              <td style="border:1px solid #fff;text-align:left;">
                <b>${esc(p.rank || '')}</b>
              </td>
              <td style="border:1px solid #fff;text-align:left;">
                <b>${esc(formatInitialSurname(p.full_name))}</b>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    `;
  });
  editorSetHTML('#blok_3', html);
}

function waitForTinyMCE(callback, tries = 0) {
  const ed = editorGet();
  if (ed) { callback(); return; }
  if (tries > 50) { console.log("TinyMCE topilmadi"); return; }
  setTimeout(function () { waitForTinyMCE(callback, tries + 1); }, 200);
}

function updateDocDate() {
  editorSetText('#doc_date', todayDmy() + ' y');
}

// Hisobot davri: "2026 yil III - chorak uchun". Yil va chorak tanlangan oraliqning OXIRGI sanasidan olinadi.
function quarterOfDate(isoDate) {
  const m = /^(\d{4})-(\d{2})-\d{2}/.exec(isoDate || '');
  if (!m) return null;
  const month = Number(m[2]);
  if (month < 1 || month > 12) return null;
  return { year: m[1], quarter: ['I', 'II', 'III', 'IV'][Math.ceil(month / 3) - 1] };
}

function updateReportPeriod() {
  const q = quarterOfDate($('#date2').val() || $('#date1').val());
  if (!q) return;
  editorSetText('#year', q.year);
  editorSetText('#chorak', q.quarter);
}

// ─── PDF yuklab olish ──────────────────────────────────────────────────────────

function downloadCurrentEditorAsPdf() {
  const ed = editorGet();
  if (!ed) {
    alert("Hujjat hali tayyor emas, birozdan so'ng qayta urinib ko'ring.");
    return;
  }

  ed.save();
  const rawBody = $('#body').val() || '';

  if (!rawBody.trim()) {
    alert('Hujjat matni bo\'sh — avval "Qidirish" tugmasini bosing.');
    return;
  }

  const $btn = $('#btnDownloadPdf');
  const originalHtml = $btn.html();
  $btn.prop('disabled', true).text('Tayyorlanmoqda...');

  const csrfToken = $('form input[name="csrfmiddlewaretoken"]').val();

  fetch("{% url 'download_pdf' %}", {
    method: 'POST',
    headers: {
      'X-CSRFToken': csrfToken,
      'X-Requested-With': 'XMLHttpRequest',
    },
    body: new URLSearchParams({
      body_html: rawBody,
      orientation: 'Landscape',
      filename: 'sarf_material',
    }),
  })
    .then(function (response) {
      const contentType = response.headers.get('content-type') || '';

      if (!response.ok) {
        if (contentType.includes('application/json')) {
          return response.json().then(function (data) {
            throw new Error(data.error || 'PDF yuklab olishda xatolik');
          });
        }
        return response.text().then(function (text) {
          console.error('Server javobi (HTML/text):', text.substring(0, 500));
          throw new Error(`Server xatoligi: ${response.status} ${response.statusText}`);
        });
      }

      if (!contentType.includes('application/pdf')) {
        return response.text().then(function (text) {
          console.error('Kutilmagan javob turi:', contentType, text.substring(0, 500));
          throw new Error('Server PDF o\'rniga boshqa formatda javob qaytardi');
        });
      }

      return response.blob();
    })
    .then(function (blob) {
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `sarf_material_${Date.now()}.pdf`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      window.URL.revokeObjectURL(url);
    })
    .catch(function (err) {
      console.error(err);
      alert(err.message || 'PDF yuklab olishda xatolik yuz berdi');
    })
    .finally(function () {
      $btn.prop('disabled', false).html(originalHtml);
    });
}

// ─── JQUERY READY ─────────────────────────────────────────────────────────────

$(function () {
    // Qo'lda tahrirlash checkbox — TinyMCE'ni standart holatda
    // faqat-o'qish rejimida ushlab turadi.
    (function () {
      const toggle = document.getElementById("editBodyToggle");
      if (!toggle) return;

      function applyEditMode() {
        const ed = editorGet();
        if (!ed) return;
        try {
          ed.mode.set(toggle.checked ? "design" : "readonly");
        } catch (e) {
          if (typeof ed.setMode === "function") {
            ed.setMode(toggle.checked ? "design" : "readonly");
          }
        }
      }

      toggle.addEventListener("change", applyEditMode);

      const waitEditor = setInterval(function () {
        const ed = editorGet();
        if (ed) {
          clearInterval(waitEditor);
          applyEditMode();
        }
      }, 300);
    })();

  $('#sender, #agreements').select2({
    width: '100%',
    placeholder: 'Tanlang...',
    allowClear: true
  });

  // Sanalarni avtomatik to'ldirish: oy boshidan bugungacha (Yakuniy hisobot va boshqa hisobotlardagidek).
  // toISOString() UTC ga o'tkazib, yarim tunda bir kun orqaga surib yuboradi, shuning uchun mahalliy sana qismlaridan yasaymiz.
  function toLocalIsoDate(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }
  const today      = new Date();
  const monthStart = new Date(today.getFullYear(), today.getMonth(), 1);

  if (!$('#date1').val()) $('#date1').val(toLocalIsoDate(monthStart));
  if (!$('#date2').val()) $('#date2').val(toLocalIsoDate(today));

  // ─── SEARCH MATERIALS ───────────────────────────────────────────────────────
  // Faqat o'z tashkilotim va o'z hududim bo'yicha avtomatik. Jadval: sarlavhada tashkilot va hudud nomi (statik),
  // pastda qatorlar -> "{Hudud} jami" -> "{Tashkilot} jami" -> "Jami".

  const MY_ORG_ID      = "{{ my_org.id|default:'' }}";
  const MY_ORG_NAME    = "{{ my_org.name|escapejs }}";
  const MY_REGION_ID   = "{{ my_region.id|default:'' }}";
  const MY_REGION_NAME = "{{ my_region.name|default:''|escapejs }}";
  // Jami qatorlari: "<DUK nomi> jami", "<Hudud> jami", "Jami" (jadval sarlavhasidagi nom bilan bir xil)
  const DUK_NAME = "“O‘zbekiston Respublikasi Iqtisodiyot va moliya vazirligi huzuridagi Axborot texnologiyalar markazi” DUK";

  function tdBase(extra) {
    return 'border:1px solid #000;' + (extra || '');
  }

  function searchMaterials() {
    const date1 = $('#date1').val();
    const date2 = $('#date2').val();

    if (!date1 || !date2) {
      alert("Iltimos, sanalarni to'liq tanlang!");
      return;
    }
    if (!MY_ORG_ID || !MY_REGION_ID) {
      alert("Tashkilot yoki hudud aniqlanmadi. Administrator bilan bog'laning.");
      return;
    }

    updateDocDate();
    updateReportPeriod();

    editorSetTbodyRows(`
      <tr>
        <td colspan="8" style="border:1px solid #000;text-align:center;padding:14px;font-size:10pt;">
          <i>Yuklanmoqda...</i>
        </td>
      </tr>
    `);

    const common = `&date1=${encodeURIComponent(date1)}&date2=${encodeURIComponent(date2)}&region=${encodeURIComponent(MY_REGION_ID)}`;

    // 1) Xizmat ko'rsatuvchi tashkilotga yopilgan arizalar (Svod formatida guruhlangan)
    // 2) Sarf materiallar (qo'lda sarflangan)  — ikkalasi bitta jadvalda
    const reqOrders = $.ajax({
      url: "{% url 'ajax_svod_materials' %}",
      method: "GET",
      dataType: "json",
      data: 'service_mode=1' + common,
    });
    const reqService = $.ajax({
      url: "{% url 'ajax_service_materials' %}",
      method: "GET",
      dataType: "json",
      data: $.param({ 'organizations[]': [MY_ORG_ID] }) + common,
    });

    $.when(reqOrders, reqService).done(function (ordersRes, serviceRes) {
      const ordersData = (ordersRes && ordersRes[0]) || {};
      const orderItems = [];
      (ordersData.organizations || []).forEach(function (org) {
        (org.regions || []).forEach(function (region) {
          (region.materials || []).forEach(function (item) { orderItems.push(item); });
        });
      });
      const serviceItems = Array.isArray(serviceRes && serviceRes[0]) ? serviceRes[0] : [];

      // Moddiy-javobgar shaxslar: arizadagi va sarfdagi materiallar egalari
      const owners = (ordersData.material_owners || []).slice();
      serviceItems.forEach(function (it) {
        owners.push({ id: null, full_name: it['full_name'], rank: it['rank_name'], unit: it['owner_unit'] });
      });

      if (!orderItems.length && !serviceItems.length) {
        renderResponsibleBlock([]);
        editorSetText('#blok_summa_soz', '');
        editorSetTbodyRows(`
          <tr>
            <td colspan="8" style="border:1px solid #000;text-align:center;color:#888;padding:14px;font-size:10pt;">
              Tanlangan sana oralig'ida ma'lumot topilmadi
            </td>
          </tr>
        `);
        return;
      }

      const cell = 'border:1px solid #000;font-size:8pt;text-align:center;';
      const regionName = esc(MY_REGION_NAME || "Noma'lum hudud");
      // Tashkilot va hudud nomi jadval sarlavhasida allaqachon bor (DUK va hudud qatorlari), shuning uchun bu yerda
      // takroran chiqarilmaydi: faqat materiallar va pastdagi "jami" qatorlari.
      let rows = '';

      let index = 1;
      let total = 0;

      // Ariza orqali yopilganlar
      orderItems.forEach(function (item) {
        total += Number(item['total_sum']) || 0;
        const info = (item['order_info'] || []).map(function (t) { return esc(t); }).join(',<br>');
        rows += `
          <tr>
            <td style="${cell}">${index++}</td>
            <td style="${cell}">${esc(item['material__name'])}</td>
            <td style="${cell}">${esc(item['material__unit__name'] || 'dona')}</td>
            <td style="${cell}">${formatNumber(item['total_number'])}</td>
            <td style="${cell}">${formatMoney(item['material__price'])}</td>
            <td style="${cell}">${formatMoney(item['total_sum'])}</td>
            <td style="${cell}">${info || '-'}</td>
            <td style="${cell}">${esc(item['material__code']) || '-'}</td>
          </tr>
        `;
      });

      // Sarf materiallar
      serviceItems.forEach(function (item) {
        total += Number(item['total_sum']) || 0;
        rows += `
          <tr>
            <td style="${cell}">${index++}</td>
            <td style="${cell}">${esc(item['material__name'])}</td>
            <td style="${cell}">${esc(item['material__unit__name'] || 'dona')}</td>
            <td style="${cell}">${formatNumber(item['outcome'])}</td>
            <td style="${cell}">${formatMoney(item['material__price'])}</td>
            <td style="${cell}">${formatMoney(item['total_sum'])}</td>
            <td style="${cell}">${esc(item['body']) || '-'}</td>
            <td style="${cell}">${esc(item['material__code']) || '-'}</td>
          </tr>
        `;
      });

      rows += `
        <tr>
          <td colspan="5" style="border:1px solid #000;font-size:8pt;text-align:right;font-weight:bold;background-color:rgb(253,246,220);">${DUK_NAME} jami:</td>
          <td style="border:1px solid #000;font-size:8pt;text-align:center;font-weight:bold;background-color:rgb(253,246,220);">${formatMoney(total)}</td>
          <td colspan="2" style="border:1px solid #000;background-color:rgb(253,246,220);"></td>
        </tr>
        <tr>
          <td colspan="5" style="border:1px solid #000;font-size:9pt;text-align:right;font-weight:bold;background-color:rgb(251,238,184);">${regionName} jami:</td>
          <td style="border:1px solid #000;font-size:9pt;text-align:center;font-weight:bold;background-color:rgb(251,238,184);">${formatMoney(total)}</td>
          <td colspan="2" style="border:1px solid #000;background-color:rgb(251,238,184);"></td>
        </tr>
        <tr>
          <td colspan="5" style="border:2px solid #000;font-size:10pt;text-align:right;font-weight:bold;background-color:rgb(245,199,86);">Jami:</td>
          <td style="border:2px solid #000;font-size:10pt;text-align:center;font-weight:bold;background-color:rgb(245,199,86);">${formatMoney(total)}</td>
          <td colspan="2" style="border:2px solid #000;background-color:rgb(245,199,86);"></td>
        </tr>
      `;

      editorSetTbodyRows(rows);
      editorSetText('#blok_summa_soz', amountInWords(total));     // "JAMI SO‘Z BILAN: ... so‘m ... tiyin"
      renderResponsibleBlock(owners);
    }).fail(function (xhr) {
      console.error("Material search error:", xhr && xhr.status, xhr && xhr.responseText);
      editorSetTbodyRows(`
        <tr>
          <td colspan="8" style="border:1px solid #000;text-align:center;color:red;padding:14px;font-size:10pt;">
            Xatolik yuz berdi: ${xhr && xhr.status} ${xhr && xhr.statusText}
          </td>
        </tr>
      `);
    });
  }

  // ─── EVENTS ─────────────────────────────────────────────────────────────────

  $('#date1, #date2').on('change', function () {
    updateReportPeriod();
  });

  $('#btnSearch').on('click', function () {
    searchMaterials();
  });

  $('#btnDownloadPdf').on('click', function (e) {
    e.preventDefault();
    downloadCurrentEditorAsPdf();
  });

  // ─── FORM SUBMIT: body ni Base64 qilib yuboramiz ─────────────────────────────

  $('form').on('submit', function (e) {
    e.preventDefault();

    const $form = $(this);

    if ($form.data("locked")) {
      return false;
    }
    $form.data("locked", true);
    $form.find('button[type="submit"]').prop("disabled", true);

    const ed = editorGet();
    if (ed) ed.save();

    const rawBody = $('#body').val() || '';
    const encoded = btoa(unescape(encodeURIComponent(rawBody)));

    let $hidden = $(this).find('input[name="body_encoded"]');
    if ($hidden.length === 0) {
      $hidden = $('<input type="hidden" name="body_encoded">').appendTo(this);
    }
    $hidden.val(encoded);

    $('#body').removeAttr('name');

    this.submit();
  });

  // ─── INITIAL LOAD ────────────────────────────────────────────────────────────

  waitForTinyMCE(function () {
    updateDocDate();
    updateReportPeriod();
  });

});
</script>
