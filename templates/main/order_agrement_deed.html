<script>
(function () {

  function formatUzDate(dateObj) {
    const day = String(dateObj.getDate()).padStart(2, '0');
    const month = String(dateObj.getMonth() + 1).padStart(2, '0');
    const year = dateObj.getFullYear();
    return `${day}.${month}.${year}`;
  }

  function getEditor() {
    if (!window.tinymce) return null;
    return tinymce.get('body') || null;
  }

  function setEditorText(elementId, text) {
    const editor = getEditor();
    if (!editor) return;

    const body = editor.getBody();
    if (!body) return;

    const el = body.querySelector('#' + elementId);
    if (el) {
      el.innerHTML = text || '';
      editor.save();
    }
  }

  // ✅ Sana qo‘yish
  function applyDate() {
    const today = formatUzDate(new Date());
    setEditorText('doc_date', today);
  }

  // ✅ Sender qo‘yish
  function applySender() {
    const selected = $('#sender_select option:selected');
    const senderName = selected.text().trim();

    if (!senderName || senderName === 'Tanlang...') {
      setEditorText('sender_name', '__');
      return;
    }

    setEditorText('sender_name', senderName);
  }

  // ✅ TinyMCE tayyor bo‘lishini kutamiz
  function waitForEditor(callback) {
    let i = 0;
    const timer = setInterval(function () {
      const ed = getEditor();

      if (ed && ed.initialized) {
        clearInterval(timer);
        callback(ed);
      }

      if (i++ > 100) clearInterval(timer);
    }, 150);
  }

  $(document).ready(function () {

    // select2 bo‘lsa ishlaydi
    if ($.fn.select2) {
      $('#sender_select').select2({
        width: '100%',
        placeholder: 'Tanlang...'
      });
    }

    // change event
    $('#sender_select').on('change', function () {
      applySender();
    });

    // TinyMCE ready
    waitForEditor(function (editor) {
      applyDate();
      applySender();

      editor.on('init', function () {
        applyDate();
        applySender();
      });

      editor.on('SetContent', function () {
        applyDate();
        applySender();
      });
    });

  });

})();
</script>
